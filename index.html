<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advanced Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui,sans-serif;
  background:#050b14;
  color:white;
}

/* ===== ОСНОВНОЙ КАНВАС (скрыт на мобильных) ===== */
#stars{
  position:fixed;
  inset:0;
  z-index:0;
  display:block;
}
/* На мобильных скрываем */
@media (max-width: 768px) {
  #stars {
    display: none;
  }
}

/* ===== UI ===== */
.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  border-radius:20px;
}

/* Центральный игровой блок (для десктопа остаётся по центру, для мобильных — адаптируем) */
.game{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:360px;
  padding:20px;
  z-index:3;
}

/* Мобильная адаптация: смещаем игровой блок вверх, добавляем нижние панели */
@media (max-width: 768px) {
  .game {
    position: fixed;
    left: 0;
    top: 0;
    transform: none;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: transparent;
    backdrop-filter: none;
    border: none;
    box-shadow: none;
    padding: 10px;
  }
  .game .glass {
    width: 100%;
    max-width: 360px;
    margin: 10px auto;
    padding: 15px;
  }
  /* нижние панели */
  .bottom-panels {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 5;
  }
  .panel {
    width: 100%;
  }
  .panel-content {
    max-height: 0;
    overflow: hidden;
    transition: 0.3s;
  }
  .panel-content.open {
    max-height: 300px;
    overflow-y: auto;
  }
  /* Кнопка клика крупнее */
  .click-btn {
    width: 200px;
    height: 200px;
    font-size: 28px;
    margin: 20px auto;
  }
  /* Иллюминатор на весь экран при открытии */
  #illuminator-container {
    width: 100%;
    height: 250px;
    background: rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
    border-radius: 16px;
  }
}

/* ===== КНОПКИ ===== */
button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:white;
  cursor:pointer;
  transition:.1s;
}
button:active{
  transform:scale(.94);
  box-shadow:0 0 15px rgba(0,255,213,.8);
}
button:disabled{
  opacity:0.3;
  pointer-events:none;
}

.click-btn{
  width:160px;height:160px;
  border-radius:50%;
  background:radial-gradient(circle,#00ffd5,#00b3a4);
  box-shadow:0 0 40px rgba(0,255,213,.7);
  font-size:22px;
  border: none;
  color: white;
  font-weight: bold;
}

/* ===== ФОН-ПРЕДМЕТЫ (десктоп) ===== */
.bg-items{
  position:absolute;
  inset:0;
  z-index:2;
}
.bg-item{
  position:absolute;
  width:60px;
  animation:float 6s ease-in-out infinite, spin 30s linear infinite;
  cursor:grab;
}

/* ===== ИЛЛЮМИНАТОР (мобильный) ===== */
#illuminator-container{
  position:relative;
  width:100%;
  height:300px;
  background:rgba(0,0,0,0.3);
  border-radius:16px;
  overflow:hidden;
  margin-top:8px;
}
.illuminator-item{
  position:absolute;
  width:60px;
  cursor:grab;
  animation:float 6s ease-in-out infinite, spin 30s linear infinite;
  z-index:3;
}
#illuminator-stars {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* ===== ЧАСТИЦЫ ===== */
.particle{
  position:absolute;
  color:#00ffd5;
  pointer-events:none;
  animation:part 1s forwards;
  z-index:10;
  font-weight: bold;
  text-shadow: 0 0 10px #00ffd5;
}
@keyframes part{
  to{opacity:0;transform:translateY(-60px)}
}

.controls{
  display:flex;
  gap:5px;
  margin-top:10px;
}
.controls button{
  margin:0;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
@keyframes spin{
  from{rotate:0deg}
  to{rotate:360deg}
}
</style>
</head>

<body>

<!-- Основной канвас звёзд (виден только на десктопе) -->
<canvas id="stars"></canvas>

<!-- Фон для предметов на десктопе -->
<div class="bg-items" id="bg"></div>

<!-- Игровой блок -->
<div class="game glass" id="gamePanel">
  <div style="text-align:center;">
    <h2>⚡ Advanced Clicker</h2>
    <div>Очки: <span id="score">0</span></div>
    <div>Сила клика: ×<span id="power">1</span></div>
    <div>Автокликер: <span id="auto">0</span></div>
  </div>

  <button class="click-btn" id="click">КЛИК</button>
  
  <button id="upgrade">🔥 Усилить ×2 (<span id="upPrice">100</span>)</button>
  <button id="autoUp">🤖 Автоклик (<span id="autoPrice">500</span>)</button>

  <div class="controls">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
    <button id="resetBtn">🔄 Сброс</button>
  </div>
</div>

<!-- Нижние панели для мобильных (скрыты на десктопе через медиа-запрос) -->
<div class="bottom-panels">
  <!-- Магазин -->
  <div class="panel glass" id="shopPanel">
    <button id="toggleShop">🛒 Магазин</button>
    <div class="panel-content glass" id="shop"></div>
  </div>

  <!-- Музыка -->
  <div class="panel glass" id="musicPanel">
    <button id="toggleMusic">🎵 Музыка</button>
    <div class="panel-content glass" id="musicPanelContent">
      <button id="musicMelody1">🎹 Мелодия 1</button>
      <button id="musicMelody2">🎸 Мелодия 2</button>
      <button id="musicMelody3">🌌 Космическая</button>
      <button id="musicMelody4">🚀 Интерстеллар</button>
      <button id="musicOff">🔇 Выключить</button>
    </div>
  </div>

  <!-- Иллюминатор (только для мобильных) -->
  <div class="panel glass" id="illuminatorPanel" style="display:none;">
    <button id="toggleIlluminator">🔮 Иллюминатор</button>
    <div class="panel-content glass" id="illuminatorContent">
      <div id="illuminator-container">
        <canvas id="illuminator-stars"></canvas>
        <!-- сюда будут добавляться предметы -->
      </div>
    </div>
  </div>
</div>

<script>
/* ===== ЗВЁЗДЫ ДЛЯ ДЕСКТОПА ===== */
const c = document.getElementById("stars");
const ctx = c.getContext("2d");
function resizeStars(){
  c.width = window.innerWidth;
  c.height = window.innerHeight;
}
resizeStars();
window.addEventListener('resize', resizeStars);

const starsDesktop = [...Array(7500)].map(()=>({
  x: Math.random() * c.width,
  y: Math.random() * c.height,
  s: Math.random() * 1.5
}));
function drawStarsDesktop(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle = "white";
  starsDesktop.forEach(st => {
    ctx.globalAlpha = Math.random() * 0.8 + 0.2;
    ctx.fillRect(st.x, st.y, st.s, st.s);
    st.y += st.s * 0.3;
    if(st.y > c.height) st.y = 0;
  });
  requestAnimationFrame(drawStarsDesktop);
}
// Запускаем только если не мобильный (на мобильных скрыт canvas через CSS)
if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) && window.innerWidth > 768) {
  drawStarsDesktop();
}

/* ===== ОПРЕДЕЛЕНИЕ МОБИЛЬНОСТИ ===== */
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
const illuminatorPanel = document.getElementById('illuminatorPanel');
if (isMobile) {
  illuminatorPanel.style.display = 'block';
  document.getElementById('bg').style.display = 'none'; // скрываем общий фон предметов
} else {
  illuminatorPanel.style.display = 'none';
}

/* ===== ЗВЁЗДЫ ДЛЯ ИЛЛЮМИНАТОРА (мобильный) ===== */
let illStarsInterval = null;
const illCanvas = document.getElementById('illuminator-stars');
let illCtx = null;
if (illCanvas) {
  illCtx = illCanvas.getContext('2d');
  function resizeIllStars() {
    const container = document.getElementById('illuminator-container');
    if (container) {
      illCanvas.width = container.clientWidth;
      illCanvas.height = container.clientHeight;
    }
  }
  window.addEventListener('resize', resizeIllStars);
  resizeIllStars();

  const starsIll = [...Array(3000)].map(()=>({
    x: Math.random() * illCanvas.width,
    y: Math.random() * illCanvas.height,
    s: Math.random() * 1.2
  }));

  function drawIllStars() {
    if (!illCtx) return;
    illCtx.clearRect(0, 0, illCanvas.width, illCanvas.height);
    illCtx.fillStyle = "white";
    starsIll.forEach(st => {
      illCtx.globalAlpha = Math.random() * 0.7 + 0.3;
      illCtx.fillRect(st.x, st.y, st.s, st.s);
      st.y += st.s * 0.2;
      if(st.y > illCanvas.height) st.y = 0;
    });
    illStarsInterval = requestAnimationFrame(drawIllStars);
  }

  // Запускаем анимацию только когда иллюминатор открыт
  let illOpen = false;
  function checkIlluminatorOpen() {
    const content = document.getElementById('illuminatorContent');
    if (content.classList.contains('open') && !illStarsInterval) {
      resizeIllStars();
      drawIllStars();
    } else if (!content.classList.contains('open') && illStarsInterval) {
      cancelAnimationFrame(illStarsInterval);
      illStarsInterval = null;
    }
  }
  
  // Следим за открытием через MutationObserver
  const observer = new MutationObserver(checkIlluminatorOpen);
  observer.observe(document.getElementById('illuminatorContent'), { attributes: true, attributeFilter: ['class'] });
}

/* ===== ЗВУКИ ===== */
const ac = new (window.AudioContext || window.webkitAudioContext)();
let musicInterval = null;
let currentMelody = 1; // 1,2,3,4 или 0 (выкл)

// Вспомогательная функция для проигрывания последовательности нот
function playNotes(notes, duration = 1.5, type = 'sine') {
  const now = ac.currentTime;
  notes.forEach((freq, index) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.02, now + index * 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.3 + duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(now + index * 0.3);
    osc.stop(now + index * 0.3 + duration);
  });
}

// Мелодия 1 (аккорд C-dur)
function playMelody1() {
  playNotes([261.63, 329.63, 392.0], 1.5, 'sine');
}

// Мелодия 2 (аккорд Am)
function playMelody2() {
  playNotes([220.0, 261.63, 329.63], 1.5, 'triangle');
}

// Мелодия 3 (космическая – высокие пэды, плавные)
function playMelody3() {
  const now = ac.currentTime;
  // Длинные высокие ноты с небольшим смещением
  [440.0, 554.37, 659.25, 880.0].forEach((freq, i) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.01, now + i * 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.5 + 2.5);
    osc.connect(gain).connect(ac.destination);
    osc.start(now + i * 0.5);
    osc.stop(now + i * 0.5 + 2.5);
  });
}

// Мелодия 4 (Интерстеллар – первые ноты темы)
function playMelody4() {
  const now = ac.currentTime;
  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // восходящая гамма
  notes.forEach((freq, i) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sawtooth'; // немного "органный" звук
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.015, now + i * 0.25);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.8);
    osc.connect(gain).connect(ac.destination);
    osc.start(now + i * 0.25);
    osc.stop(now + i * 0.25 + 0.8);
  });
}

function startMusic() {
  if (musicInterval) clearInterval(musicInterval);
  if (currentMelody === 0) return;
  const player = 
    currentMelody === 1 ? playMelody1 :
    currentMelody === 2 ? playMelody2 :
    currentMelody === 3 ? playMelody3 : playMelody4;
  player();
  musicInterval = setInterval(player, 4000); // повтор каждые 4 секунды
}

function changeMelody(melody) {
  currentMelody = melody;
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
  if (melody !== 0) startMusic();
}

// Звук клика
function clickSound(){
  const now = ac.currentTime;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'sine';
  osc.frequency.value = 660;
  gain.gain.setValueAtTime(0.1, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(gain).connect(ac.destination);
  osc.start(now);
  osc.stop(now + 0.15);
}

let musicStarted = false;
function tryStartMusic() {
  if (!musicStarted && currentMelody !== 0) {
    ac.resume().then(() => {
      startMusic();
      musicStarted = true;
    });
  }
}

/* ===== ИГРА ===== */
let score = 0;
let power = 1;
let auto = 0;
let upPrice = 100;
let autoPrice = 500;
let owned = {};      // { itemId: imgUrl }
let pos = {};        // для десктопа: { itemId: {x, y} }
let mobilePos = {};  // для мобильных: { itemId: {x, y} } внутри иллюминатора

// Элементы интерфейса
const scoreEl = document.getElementById('score');
const powerEl = document.getElementById('power');
const autoEl = document.getElementById('auto');
const upPriceSpan = document.getElementById('upPrice');
const autoPriceSpan = document.getElementById('autoPrice');

const bg = document.getElementById('bg');
const shop = document.getElementById('shop');
const illuminatorContainer = document.getElementById('illuminator-container');

// Уникальные названия (те же)
const itemNames = [
  "Звёздный осколок", "Лунный камень", "Пламенное сердце", "Древняя монета", "Кристалл дракона",
  "Глаз феникса", "Руна ветра", "Жемчужина глубин", "Клык оборотня", "Перо грифона",
  "Чешуя дракона", "Коготь виверны", "Слеза единорога", "Корень мандрагоры", "Светлячок в банке",
  "Механическое сердце", "Хрустальный череп", "Золотое яблоко", "Серебряная подкова", "Книга заклинаний",
  "Амулет времени", "Кольцо всевластия", "Кулон луны", "Браслет ветра", "Диадема солнца",
  "Посох мага", "Меч короля", "Щит воина", "Шлем викинга", "Лук эльфа",
  "Кинжал тени", "Топор варвара", "Булава паладина", "Копьё судьбы", "Молот Тора",
  "Сфера пророчеств", "Карта сокровищ", "Компас странника", "Фонарь душ", "Ключ от бездны",
  "Песочные часы", "Весы правосудия", "Зеркало истины", "Маска демона", "Крыло ангела",
  "Роза ветров", "Клевер удачи", "Жёлудь мира", "Шип розы", "Лепесток лотоса"
];

// Генерация предметов
const items = [...Array(50)].map((_, i) => ({
  id: 'item' + i,
  name: itemNames[i],
  price: Math.floor(800 * Math.pow(1.25, i)),
  img: `https://picsum.photos/seed/${i}/64`
}));

// Функция обновления интерфейса
function update() {
  scoreEl.textContent = Math.floor(score);
  powerEl.textContent = power;
  autoEl.textContent = auto;
  upPriceSpan.textContent = upPrice;
  autoPriceSpan.textContent = autoPrice;
}
update();

/* ===== ДОБАВЛЕНИЕ ПРЕДМЕТА ===== */
function addItemToView(id, imgSrc) {
  if (isMobile) {
    const el = document.createElement('img');
    el.src = imgSrc;
    el.className = 'illuminator-item';
    const containerRect = illuminatorContainer.getBoundingClientRect();
    const defaultX = containerRect.width ? Math.random() * (containerRect.width - 60) : 50;
    const defaultY = containerRect.height ? Math.random() * (containerRect.height - 60) : 50;
    el.style.left = (mobilePos[id]?.x || defaultX) + 'px';
    el.style.top = (mobilePos[id]?.y || defaultY) + 'px';
    makeDraggableInContainer(el, id);
    illuminatorContainer.appendChild(el);
  } else {
    const el = document.createElement('img');
    el.src = imgSrc;
    el.className = 'bg-item';
    el.style.left = (pos[id]?.x || Math.random() * innerWidth) + 'px';
    el.style.top = (pos[id]?.y || Math.random() * innerHeight) + 'px';
    makeDraggableOnScreen(el, id);
    bg.appendChild(el);
  }
}

function makeDraggableOnScreen(el, id) {
  let dx, dy;
  el.onmousedown = e => {
    e.preventDefault();
    dx = e.clientX - el.offsetLeft;
    dy = e.clientY - el.offsetTop;
    document.onmousemove = m => {
      el.style.left = (m.clientX - dx) + 'px';
      el.style.top = (m.clientY - dy) + 'px';
      pos[id] = { x: m.clientX - dx, y: m.clientY - dy };
    };
    document.onmouseup = () => {
      document.onmousemove = null;
      document.onmouseup = null;
    };
  };
}

function makeDraggableInContainer(el, id) {
  let dx, dy;
  el.onmousedown = e => {
    e.preventDefault();
    const containerRect = illuminatorContainer.getBoundingClientRect();
    dx = e.clientX - containerRect.left - el.offsetLeft;
    dy = e.clientY - containerRect.top - el.offsetTop;
    document.onmousemove = m => {
      let newX = m.clientX - containerRect.left - dx;
      let newY = m.clientY - containerRect.top - dy;
      newX = Math.max(0, Math.min(illuminatorContainer.clientWidth - el.clientWidth, newX));
      newY = Math.max(0, Math.min(illuminatorContainer.clientHeight - el.clientHeight, newY));
      el.style.left = newX + 'px';
      el.style.top = newY + 'px';
      mobilePos[id] = { x: newX, y: newY };
    };
    document.onmouseup = () => {
      document.onmousemove = null;
      document.onmouseup = null;
    };
  };
}

/* ===== МАГАЗИН ===== */
function renderShop() {
  shop.innerHTML = '';
  items.forEach(item => {
    const d = document.createElement('div');
    d.className = 'item';
    const bought = owned.hasOwnProperty(item.id);
    d.innerHTML = `
      <img src="${item.img}">
      <div style="flex:1">
        <strong>${item.name}</strong><br>
        ${bought ? '✅ Куплено' : '💰 ' + item.price}
      </div>
      <button ${bought ? 'disabled' : ''}>Купить</button>
    `;
    const btn = d.querySelector('button');
    if (!bought) {
      btn.onclick = () => {
        if (score >= item.price) {
          score -= item.price;
          owned[item.id] = item.img;
          addItemToView(item.id, item.img);
          update();
          renderShop();
        }
      };
    }
    shop.appendChild(d);
  });
}
renderShop();

/* ===== КЛИКЕР ===== */
document.getElementById('click').onclick = e => {
  tryStartMusic();
  ac.resume();
  clickSound();

  score += power;
  spawnParticle(e.clientX, e.clientY, '+' + power);
  update();
};

function spawnParticle(x, y, text) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = text;
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}

document.getElementById('upgrade').onclick = () => {
  if (score >= upPrice) {
    score -= upPrice;
    power *= 2;
    upPrice = Math.floor(upPrice * 2.6);
    update();
  }
};

document.getElementById('autoUp').onclick = () => {
  if (score >= autoPrice) {
    score -= autoPrice;
    auto++;
    autoPrice = Math.floor(autoPrice * 2.4);
    update();
  }
};

setInterval(() => {
  if (auto > 0) {
    score += power * auto;
    update();
  }
}, 1000);

/* ===== СОХРАНЕНИЕ/ЗАГРУЗКА ===== */
function saveGame() {
  localStorage.setItem('clicker_score', score);
  localStorage.setItem('clicker_power', power);
  localStorage.setItem('clicker_auto', auto);
  localStorage.setItem('clicker_upPrice', upPrice);
  localStorage.setItem('clicker_autoPrice', autoPrice);
  localStorage.setItem('clicker_owned', JSON.stringify(owned));
  if (isMobile) {
    localStorage.setItem('clicker_mobilePos', JSON.stringify(mobilePos));
  } else {
    localStorage.setItem('clicker_pos', JSON.stringify(pos));
  }
  alert('Прогресс сохранён!');
}

function loadGame() {
  const s = localStorage.getItem('clicker_score');
  if (s === null) {
    alert('Нет сохранённой игры');
    return;
  }
  score = Number(s);
  power = Number(localStorage.getItem('clicker_power')) || 1;
  auto = Number(localStorage.getItem('clicker_auto')) || 0;
  upPrice = Number(localStorage.getItem('clicker_upPrice')) || 100;
  autoPrice = Number(localStorage.getItem('clicker_autoPrice')) || 500;
  owned = JSON.parse(localStorage.getItem('clicker_owned')) || {};

  if (isMobile) {
    mobilePos = JSON.parse(localStorage.getItem('clicker_mobilePos')) || {};
    illuminatorContainer.innerHTML = '<canvas id="illuminator-stars"></canvas>'; // пересоздаём канвас
    // восстановим ссылку
    window.illCtx = document.getElementById('illuminator-stars').getContext('2d');
    Object.keys(owned).forEach(id => addItemToView(id, owned[id]));
  } else {
    pos = JSON.parse(localStorage.getItem('clicker_pos')) || {};
    bg.innerHTML = '';
    Object.keys(owned).forEach(id => addItemToView(id, owned[id]));
  }

  update();
  renderShop();
  alert('Прогресс загружен!');
}

function resetGame() {
  if (confirm('Сбросить весь прогресс?')) {
    score = 0;
    power = 1;
    auto = 0;
    upPrice = 100;
    autoPrice = 500;
    owned = {};
    pos = {};
    mobilePos = {};
    if (isMobile) {
      illuminatorContainer.innerHTML = '<canvas id="illuminator-stars"></canvas>';
      window.illCtx = document.getElementById('illuminator-stars').getContext('2d');
    } else {
      bg.innerHTML = '';
    }
    update();
    renderShop();
  }
}

document.getElementById('saveBtn').onclick = saveGame;
document.getElementById('loadBtn').onclick = loadGame;
document.getElementById('resetBtn').onclick = resetGame;

/* ===== УПРАВЛЕНИЕ ВКЛАДКАМИ ===== */
document.getElementById('toggleShop').onclick = () => {
  document.getElementById('shop').classList.toggle('open');
};
document.getElementById('toggleMusic').onclick = () => {
  document.getElementById('musicPanelContent').classList.toggle('open');
};
if (isMobile) {
  document.getElementById('toggleIlluminator').onclick = () => {
    document.getElementById('illuminatorContent').classList.toggle('open');
  };
}

// Музыкальные кнопки
document.getElementById('musicMelody1').onclick = () => { changeMelody(1); tryStartMusic(); };
document.getElementById('musicMelody2').onclick = () => { changeMelody(2); tryStartMusic(); };
document.getElementById('musicMelody3').onclick = () => { changeMelody(3); tryStartMusic(); };
document.getElementById('musicMelody4').onclick = () => { changeMelody(4); tryStartMusic(); };
document.getElementById('musicOff').onclick = () => { changeMelody(0); musicStarted = false; };
</script>
