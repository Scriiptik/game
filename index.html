<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Мемолента по годам 🎞️</title>
    <!-- Библиотеки: шрифты, иконки, лёгкие анимации -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,400&family=Comic+Neue:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            transition: background 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* адаптивный контейнер */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 16px;
            margin: 0 auto;
        }

        /* шапка с динамическим годом (для примера меняется редко) */
        .header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 0 0 30px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
        }
        .header h1 {
            font-size: clamp(1.8rem, 8vw, 3rem);
            font-family: 'Comic Neue', cursive;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* сетка для карточек */
        .meme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            justify-content: center;
        }

        /* базовая карточка мема */
        .meme-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.5s ease;
            border: 4px solid transparent; /* будет меняться по году */
        }
        .meme-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        /* изображение / гифка */
        .meme-media {
            width: 100%;
            aspect-ratio: 1 / 1; /* квадрат, но можно подстраивать */
            object-fit: cover;
            background: #ddd;
            display: block;
            border-bottom: 2px solid #eee;
            cursor: pointer;
        }
        .meme-media.video-fit {
            object-fit: contain; /* для видео лучше contain, но у нас только картинки/гифки */
            background: black;
        }

        /* нижняя часть карточки */
        .meme-info {
            padding: 15px;
            flex: 1;
        }
        .meme-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
            max-height: 3.2em;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meme-year {
            display: inline-block;
            background: #e0e0e0;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #333;
        }

        /* ===== темы в зависимости от года мема ===== */
        .meme-card.year-2024 {
            border-color: #ff6b6b;
            background: #fff5f5;
        }
        .meme-card.year-2024 .meme-title {
            color: #c92a2a;
            font-family: 'Comic Neue', cursive;
        }
        .meme-card.year-2023 {
            border-color: #4ecdc4;
            background: #f0fffe;
        }
        .meme-card.year-2023 .meme-title {
            color: #1c7e7a;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
        }
        .meme-card.year-2022 {
            border-color: #ffe66d;
            background: #fff9e6;
        }
        .meme-card.year-2022 .meme-title {
            color: #b25f00;
            font-style: italic;
        }
        .meme-card.year-2021 {
            border-color: #c77dff;
            background: #f3e8ff;
        }
        .meme-card.year-2021 .meme-title {
            color: #5a189a;
            text-transform: uppercase;
        }
        .meme-card.year-2020 {
            border-color: #f08c00;
            background: #fff4e0;
        }
        .meme-card.year-2020 .meme-title {
            color: #d9480f;
            font-family: 'Courier New', monospace;
        }
        .meme-card.year-2019 {
            border-color: #74c69d;
            background: #e9f7ef;
        }
        .meme-card.year-2019 .meme-title {
            color: #1e5f3e;
            text-decoration: underline wavy;
        }
        .meme-card.year-old { /* до 2018 */
            border-color: #adb5bd;
            background: #e9ecef;
            filter: sepia(0.3);
        }
        .meme-card.year-old .meme-title {
            color: #495057;
            font-family: 'Times New Roman', serif;
        }

        /* загрузчик и конец ленты */
        .loader {
            text-align: center;
            padding: 30px 10px;
            font-size: 1.4rem;
            color: #666;
        }
        .loader i {
            margin-right: 8px;
        }
        .end-message {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 1.2rem;
        }

        /* кнопка "наверх" (mobile friendly) */
        #scrollTopBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #764ba2;
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 999;
            transition: background 0.2s;
        }
        #scrollTopBtn:hover {
            background: #5a3d7a;
        }
        @media (max-width: 600px) {
            .meme-grid {
                grid-template-columns: 1fr;
            }
            #scrollTopBtn {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <header class="header animate__animated animate__fadeInDown">
        <h1><i class="fas fa-robot"></i> Мемолента <i class="fas fa-laugh-squint"></i></h1>
        <p>Скролль вниз — мемы подгружаются сами. Каждый год — свой стиль!</p>
    </header>

    <div class="container">
        <div id="memeContainer" class="meme-grid">
            <!-- карточки будут добавляться сюда -->
        </div>
        <div id="loader" class="loader">
            <i class="fas fa-spinner fa-pulse"></i> Загружаем мемные архивы...
        </div>
        <div id="endMessage" class="end-message" style="display: none;">
            <i class="fas fa-hourglass-end"></i> Вы доскроллили до дна мемохранилища (но это не точно)
        </div>
    </div>

    <button id="scrollTopBtn" title="Наверх"><i class="fas fa-arrow-up"></i></button>

    <!-- Подключаем axios для удобства запросов -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        (function() {
            // DOM элементы
            const container = document.getElementById('memeContainer');
            const loader = document.getElementById('loader');
            const endMessage = document.getElementById('endMessage');
            const scrollBtn = document.getElementById('scrollTopBtn');

            // Состояние
            let after = null;          // для пагинации Reddit
            let loading = false;
            let hasMore = true;
            let requestCount = 0;       // для разнообразия subreddits
            const subreddits = ['memes', 'dankmemes', 'wholesomememes', 'AdviceAnimals', 'MemeEconomy'];

            // --- Функция определения года и класса ---
            function getYearClass(timestamp) {
                const date = new Date(timestamp * 1000);
                const year = date.getFullYear();
                if (year >= 2024) return 'year-2024';
                if (year === 2023) return 'year-2023';
                if (year === 2022) return 'year-2022';
                if (year === 2021) return 'year-2021';
                if (year === 2020) return 'year-2020';
                if (year === 2019) return 'year-2019';
                return 'year-old'; // 2018 и ранее
            }

            // --- Вспомогательная функция: проверка, является ли URL изображением/гифкой ---
            function isImageOrGif(url) {
                if (!url) return false;
                const ext = url.split('?')[0].toLowerCase(); // отсекаем параметры
                return ext.endsWith('.jpg') || ext.endsWith('.jpeg') || ext.endsWith('.png') || ext.endsWith('.gif') || ext.includes('.gifv'); // gifv обработаем как гифку
            }

            // --- Функция для получения чистого URL медиа из поста Reddit ---
            function getMediaUrl(post) {
                // Сначала проверяем, есть ли preview с images (самое надёжное для статичных)
                if (post.preview && post.preview.images && post.preview.images[0]) {
                    const source = post.preview.images[0].source;
                    if (source && source.url) {
                        // декодируем &amp; и прочее
                        let url = source.url.replace(/&amp;/g, '&');
                        // Reddit отдаёт заэкранированные URL
                        return url;
                    }
                }
                // Если это напрямую изображение (url)
                if (post.url && isImageOrGif(post.url)) {
                    return post.url;
                }
                // Если есть media (для гифок, иногда)
                if (post.media && post.media.reddit_video) {
                    // Вернём fallback изображение из превью, т.к. видео сложно встроить
                    if (post.preview && post.preview.images && post.preview.images[0]) {
                        return post.preview.images[0].source.url.replace(/&amp;/g, '&');
                    }
                }
                // Пытаемся получить из secure_media
                if (post.secure_media && post.secure_media.reddit_video) {
                    if (post.preview && post.preview.images) {
                        return post.preview.images[0].source.url.replace(/&amp;/g, '&');
                    }
                }
                return null;
            }

            // --- Основная функция загрузки мемов ---
            async function fetchMemes() {
                if (loading || !hasMore) return;

                loading = true;
                loader.style.display = 'block';
                endMessage.style.display = 'none';

                try {
                    // Выбираем случайный сабреддит для разнообразия
                    const sub = subreddits[Math.floor(Math.random() * subreddits.length)];
                    let url = `https://www.reddit.com/r/${sub}.json?limit=15`;
                    if (after) {
                        url += `&after=${after}`;
                    }

                    const response = await axios.get(url, {
                        headers: { 'User-Agent': 'MemeScroll/1.0 (desktop; mobile)' } // Reddit требует user-agent
                    });

                    const data = response.data.data;
                    const posts = data.children;

                    if (!posts || posts.length === 0) {
                        hasMore = false;
                        loader.style.display = 'none';
                        endMessage.style.display = 'block';
                        return;
                    }

                    after = data.after; // сохраняем для следующей страницы
                    if (!after) hasMore = false;

                    // Фильтруем посты, у которых есть изображение/гифка
                    const validPosts = posts.filter(child => {
                        const post = child.data;
                        // Избегаем закреплённых постов, видео reddit (не встраиваются просто)
                        if (post.stickied) return false;
                        if (post.over_18) return false; // SFW
                        const mediaUrl = getMediaUrl(post);
                        return mediaUrl && isImageOrGif(mediaUrl);
                    });

                    if (validPosts.length === 0) {
                        // Если нет валидных в этой партии, пробуем ещё раз (рекурсивно, но осторожно)
                        if (hasMore) {
                            loading = false; // сбросим, чтобы следующая итерация могла загрузить
                            fetchMemes();
                            return;
                        }
                    }

                    // Обрабатываем каждый пост
                    validPosts.forEach(child => {
                        const post = child.data;
                        const title = post.title || 'Мем без названия';
                        const yearClass = getYearClass(post.created_utc);
                        const mediaUrl = getMediaUrl(post);

                        if (!mediaUrl) return;

                        // Создаём карточку
                        const card = document.createElement('div');
                        card.className = `meme-card ${yearClass} animate__animated animate__fadeInUp`;
                        card.setAttribute('data-year', yearClass);

                        // Медиа элемент (картинка или гифка)
                        let mediaElement;
                        if (mediaUrl.toLowerCase().includes('.gif') || mediaUrl.toLowerCase().includes('.gifv')) {
                            // Для гифок используем <img> с autoplay? лучше <img> так как гифка это изображение
                            mediaElement = document.createElement('img');
                            mediaElement.src = mediaUrl.replace('.gifv', '.gif'); // на всякий случай
                            mediaElement.alt = title;
                            mediaElement.loading = 'lazy';
                            mediaElement.classList.add('meme-media');
                        } else {
                            mediaElement = document.createElement('img');
                            mediaElement.src = mediaUrl;
                            mediaElement.alt = title;
                            mediaElement.loading = 'lazy';
                            mediaElement.classList.add('meme-media');
                        }

                        // Обработка ошибок загрузки изображения (можно заменить на плейсхолдер)
                        mediaElement.onerror = () => {
                            mediaElement.src = 'https://via.placeholder.com/300x300?text=Мем+не+загрузился:+(';
                        };

                        // Информационный блок
                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'meme-info';

                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'meme-title';
                        titleDiv.textContent = title.length > 70 ? title.slice(0, 70) + '…' : title;

                        const yearSpan = document.createElement('span');
                        yearSpan.className = 'meme-year';
                        const year = new Date(post.created_utc * 1000).getFullYear();
                        yearSpan.textContent = year + ' г.';

                        infoDiv.appendChild(titleDiv);
                        infoDiv.appendChild(yearSpan);

                        card.appendChild(mediaElement);
                        card.appendChild(infoDiv);

                        container.appendChild(card);
                    });

                } catch (error) {
                    console.error('Ошибка загрузки мемов:', error);
                    // Показываем сообщение, но не блокируем полностью
                    const errorDiv = document.createElement('div');
                    errorDiv.style.gridColumn = '1 / -1';
                    errorDiv.style.padding = '20px';
                    errorDiv.style.background = '#ffdddd';
                    errorDiv.style.borderRadius = '12px';
                    errorDiv.textContent = '😿 Не удалось загрузить мемы. Попробуй позже.';
                    container.appendChild(errorDiv);
                } finally {
                    loading = false;
                    loader.style.display = 'none';
                    if (!hasMore) {
                        endMessage.style.display = 'block';
                    } else {
                        endMessage.style.display = 'none';
                    }
                }
            }

            // --- Бесконечный скролл ---
            function handleScroll() {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;

                // Если осталось меньше 400px до низа - загружаем
                if (scrollY + windowHeight >= documentHeight - 400) {
                    fetchMemes();
                }

                // Кнопка "наверх"
                if (scrollY > 300) {
                    scrollBtn.style.display = 'block';
                } else {
                    scrollBtn.style.display = 'none';
                }
            }

            window.addEventListener('scroll', () => {
                requestAnimationFrame(handleScroll);
            });

            // Кнопка наверх
            scrollBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Стартовая загрузка
            fetchMemes();

            // Периодическая проверка на случай, если контент не занял весь экран (скролла нет)
            setTimeout(() => {
                if (document.documentElement.scrollHeight <= window.innerHeight) {
                    fetchMemes(); // подгрузим ещё
                }
            }, 500);
        })();
    </script>
</body>
</html>
