<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advanced Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui,sans-serif;
  background:#050b14;
  color:white;
}

/* ===== ЗВЁЗДЫ ===== */
#stars{
  position:fixed;
  inset:0;
  z-index:0;
}

/* ===== UI ===== */
.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  border-radius:20px;
}

.game{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:360px;
  padding:20px;
  z-index:3;
}

.shop-panel{
  position:absolute;
  top:15px;
  left:15px;
  z-index:4;
}

.shop{
  margin-top:8px;
  max-height:0;
  overflow:auto;
  transition:.4s;
  width:260px;
}
.shop.open{max-height:500px}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.item img{width:36px}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:white;
  cursor:pointer;
  transition:.1s;
}
button:active{
  transform:scale(.94);
  box-shadow:0 0 15px rgba(0,255,213,.8);
}

.click-btn{
  width:160px;height:160px;
  border-radius:50%;
  background:radial-gradient(circle,#00ffd5,#00b3a4);
  box-shadow:0 0 40px rgba(0,255,213,.7);
  font-size:22px;
}

/* ===== ФОН-ПРЕДМЕТЫ ===== */
.bg-items{
  position:absolute;
  inset:0;
  z-index:2;
}
.bg-item{
  position:absolute;
  width:60px;
  animation:float 6s ease-in-out infinite, spin 30s linear infinite;
  cursor:grab;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
@keyframes spin{
  from{rotate:0deg}
  to{rotate:360deg}
}

/* ===== ЧАСТИЦЫ ===== */
.particle{
  position:absolute;
  color:#00ffd5;
  pointer-events:none;
  animation:part 1s forwards;
}
@keyframes part{
  to{opacity:0;transform:translateY(-60px)}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="bg-items" id="bg"></div>

<div class="shop-panel glass">
  <button id="toggleShop">🛒 Магазин</button>
  <div class="shop glass" id="shop"></div>
</div>

<div class="game glass">
  <h2>⚡ Advanced Clicker</h2>
  <div>Очки: <span id="score">0</span></div>
  <div>Сила клика: ×<span id="power">1</span></div>
  <div>Автокликер: <span id="auto">0</span></div>

  <button class="click-btn" id="click">КЛИК</button>
  <button id="upgrade">🔥 Усилить ×2 (<span id="upPrice">100</span>)</button>
  <button id="autoUp">🤖 Автоклик (<span id="autoPrice">500</span>)</button>
</div>

<script>
/* ===== ЗВЁЗДЫ ===== */
const c=document.getElementById("stars"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;
const stars=[...Array(15000)].map(()=>({
x:Math.random()*c.width,
y:Math.random()*c.height,
s:Math.random()*1.5
}));
function draw(){
ctx.clearRect(0,0,c.width,c.height);
ctx.fillStyle="white";
stars.forEach(st=>{
ctx.globalAlpha=Math.random();
ctx.fillRect(st.x,st.y,st.s,st.s);
st.y+=st.s*.3;
if(st.y>c.height)st.y=0;
});
requestAnimationFrame(draw);
}
draw();

/* ===== ЗВУКИ (Web Audio) ===== */
const ac=new AudioContext();
function clickSound(){
const o=ac.createOscillator(),g=ac.createGain();
o.type="sine";o.frequency.value=800;
g.gain.value=.05;
o.connect(g).connect(ac.destination);
o.start();o.stop(ac.currentTime+.08);
}
function music(){
const o=ac.createOscillator(),g=ac.createGain();
o.type="triangle";o.frequency.value=120;
g.gain.value=.02;
o.connect(g).connect(ac.destination);
o.start();
}
music();

/* ===== ИГРА ===== */
let score=+localStorage.score||0;
let power=+localStorage.power||1;
let auto=+localStorage.auto||0;
let upPrice=+localStorage.upPrice||100;
let autoPrice=+localStorage.autoPrice||500;
let owned=JSON.parse(localStorage.owned||"{}");
let pos=JSON.parse(localStorage.pos||"{}");

const items=[...Array(50)].map((_,i)=>({
id:"item"+i,
price:Math.floor(800*Math.pow(1.25,i)),
img:`https://picsum.photos/seed/${i}/64`
}));

const bg=document.getElementById("bg");
const shop=document.getElementById("shop");

function save(){
Object.assign(localStorage,{score,power,auto,upPrice,autoPrice,
owned:JSON.stringify(owned),pos:JSON.stringify(pos)});
}

click.onclick=e=>{
ac.resume();clickSound();
score+=power;
spawn(e.clientX,e.clientY,"+"+power);
update();
};

upgrade.onclick=()=>{
if(score>=upPrice){
score-=upPrice;
power*=2;
upPrice=Math.floor(upPrice*2.6);
update();
}
};

autoUp.onclick=()=>{
if(score>=autoPrice){
score-=autoPrice;
auto++;
autoPrice=Math.floor(autoPrice*2.4);
update();
}
};

toggleShop.onclick=()=>shop.classList.toggle("open");

function renderShop(){
shop.innerHTML="";
items.forEach(i=>{
const d=document.createElement("div");
d.className="item";
d.innerHTML=`<img src="${i.img}">
<div>${i.id}<br>${owned[i.id]?"Куплено":"💰"+i.price}</div>
<button ${owned[i.id]?"disabled":""}>Купить</button>`;
d.querySelector("button").onclick=()=>{
if(score>=i.price){
score-=i.price;
owned[i.id]=i.img;
addBg(i.id,i.img);
update();renderShop();
}};
shop.appendChild(d);
});
}

function addBg(id,img){
const el=document.createElement("img");
el.src=img;el.className="bg-item";
el.style.left=(pos[id]?.x||Math.random()*innerWidth)+"px";
el.style.top=(pos[id]?.y||Math.random()*innerHeight)+"px";
drag(el,id);bg.appendChild(el);
}

function drag(el,id){
let dx,dy;
el.onmousedown=e=>{
dx=e.offsetX;dy=e.offsetY;
document.onmousemove=m=>{
el.style.left=m.pageX-dx+"px";
el.style.top=m.pageY-dy+"px";
pos[id]={x:m.pageX-dx,y:m.pageY-dy};
};
document.onmouseup=()=>{document.onmousemove=null;save();}
};
}

function spawn(x,y,t){
const p=document.createElement("div");
p.className="particle";
p.textContent=t;
p.style.left=x+"px";p.style.top=y+"px";
document.body.appendChild(p);
setTimeout(()=>p.remove(),900);
}

setInterval(()=>{if(auto>0){score+=power*auto;update()}},1000);

function update(){
scoreEl.textContent=score;
powerEl.textContent=power;
autoEl.textContent=auto;
save();
}

const scoreEl=scoreSpan=score=document.getElementById("score");
const powerEl=document.getElementById("power");
const autoEl=document.getElementById("auto");

Object.keys(owned).forEach(id=>addBg(id,owned[id]));
renderShop();update();
</script>
</body>
</html>
