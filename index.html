<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advanced Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui,sans-serif;
  background:#050b14;
  color:white;
}

/* ===== ЗВЁЗДЫ (ПК) ===== */
#stars{
  position:fixed;
  inset:0;
  z-index:0;
  display:block;
}

/* ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== */
.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  border-radius:20px;
}

/* ---------- ПК версия (ширина > 768px) ---------- */
@media (min-width: 769px) {
  /* Левая панель */
  .desktop-panels {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 260px;
  }
  .desktop-panel {
    width: 100%;
  }
  .panel-content {
    margin-top: 8px;
    max-height: 0;
    overflow: hidden;
    transition: 0.4s;
  }
  .panel-content.open {
    max-height: 500px;
    overflow-y: auto;
  }
  
  /* Центральный игровой блок */
  .game {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    padding: 20px;
    z-index: 3;
  }
  
  /* Фон-предметы */
  .bg-items {
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  .bg-item {
    position: absolute;
    width: 60px;
    animation: float 6s ease-in-out infinite, spin 30s linear infinite;
    cursor: grab;
  }
  
  /* Скрываем мобильные элементы */
  .mobile-header {
    display: none;
  }
  #illuminatorPanel {
    display: none;
  }
}

/* ---------- Мобильная версия (ширина ≤ 768px) ---------- */
@media (max-width: 768px) {
  /* Отключаем звёзды на фоне */
  #stars {
    display: none;
  }
  
  /* Верхняя панель с тремя кнопками */
  .mobile-header {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    gap: 5px;
    z-index: 10;
  }
  .mobile-header button {
    flex: 1;
    padding: 8px 0;
    font-size: 14px;
    margin: 0;
    background: rgba(255,255,255,.15);
    border: none;
    border-radius: 20px;
    color: white;
  }
  .mobile-header button:active {
    transform: scale(0.96);
  }
  
  /* Контейнеры для выезжающих панелей */
  .mobile-panel {
    position: fixed;
    top: 55px;
    left: 10px;
    right: 10px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    z-index: 9;
    background: rgba(10, 20, 30, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
  }
  .mobile-panel.open {
    max-height: 350px;
    overflow-y: auto;
  }
  
  /* Иллюминатор внутри мобильной панели */
  #illuminator-container {
    width: 100%;
    height: 250px;
    background: rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
    border-radius: 16px;
  }
  .illuminator-item {
    position: absolute;
    width: 60px;
    cursor: grab;
    animation: float 6s ease-in-out infinite, spin 30s linear infinite;
    z-index: 3;
  }
  #illuminator-stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  
  /* Игровой блок по центру */
  .game {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 360px;
    padding: 15px;
    text-align: center;
    z-index: 5;
  }
  
  .click-btn {
    width: 180px;
    height: 180px;
    font-size: 24px;
    margin: 10px auto;
  }
  
  .controls {
    display: flex;
    gap: 5px;
    margin-top: 10px;
  }
  
  /* Скрываем десктопные панели */
  .desktop-panels {
    display: none;
  }
  .bg-items {
    display: none;
  }
}

/* Общие стили для элементов */
.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.item img{width:36px; height:36px; object-fit:cover; border-radius:8px;}

button{
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:white;
  cursor:pointer;
  transition:.1s;
}
button:active{
  transform:scale(.94);
  box-shadow:0 0 15px rgba(0,255,213,.8);
}
button:disabled{
  opacity:0.3;
  pointer-events:none;
}

.particle{
  position:absolute;
  color:#00ffd5;
  pointer-events:none;
  animation:part 1s forwards;
  z-index:10;
  font-weight:bold;
  text-shadow:0 0 10px #00ffd5;
}
@keyframes part{
  to{opacity:0;transform:translateY(-60px)}
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
@keyframes spin{
  from{rotate:0deg}
  to{rotate:360deg}
}
</style>
</head>
<body>

<!-- Звёздный фон для ПК -->
<canvas id="stars"></canvas>

<!-- Десктопные панели (видны только на ПК) -->
<div class="desktop-panels">
  <!-- Магазин -->
  <div class="desktop-panel glass">
    <button id="toggleShopDesktop">🛒 Магазин</button>
    <div class="panel-content glass" id="shopDesktop"></div>
  </div>
  <!-- Музыка -->
  <div class="desktop-panel glass">
    <button id="toggleMusicDesktop">🎵 Музыка</button>
    <div class="panel-content glass" id="musicDesktop">
      <button id="musicMelody1">🎹 Мелодия 1</button>
      <button id="musicMelody2">🎸 Мелодия 2</button>
      <button id="musicMelody3">🌌 Космическая</button>
      <button id="musicMelody4">🚀 Интерстеллар</button>
      <button id="musicOff">🔇 Выключить</button>
    </div>
  </div>
  <!-- Иллюминатор на ПК скрыт, но можно добавить при желании -->
</div>

<!-- Мобильный верхний хедер (виден только на мобильных) -->
<div class="mobile-header">
  <button id="mobileShopBtn">🛒</button>
  <button id="mobileMusicBtn">🎵</button>
  <button id="mobileIlluminatorBtn">🔮</button>
</div>

<!-- Мобильные панели (содержимое) -->
<div class="mobile-panel" id="mobileShopPanel">
  <div class="glass" style="padding:10px;" id="shopMobile"></div>
</div>
<div class="mobile-panel" id="mobileMusicPanel">
  <div class="glass" style="padding:10px;">
    <button id="musicMelody1_mob">🎹 Мелодия 1</button>
    <button id="musicMelody2_mob">🎸 Мелодия 2</button>
    <button id="musicMelody3_mob">🌌 Космическая</button>
    <button id="musicMelody4_mob">🚀 Интерстеллар</button>
    <button id="musicOff_mob">🔇 Выключить</button>
  </div>
</div>
<div class="mobile-panel" id="mobileIlluminatorPanel">
  <div class="glass" style="padding:10px;">
    <div id="illuminator-container">
      <canvas id="illuminator-stars"></canvas>
      <!-- сюда будут добавляться предметы -->
    </div>
  </div>
</div>

<!-- Фон для предметов на ПК -->
<div class="bg-items" id="bg"></div>

<!-- Основной игровой блок -->
<div class="game glass">
  <div>
    <h2>⚡ Advanced Clicker</h2>
    <div>Очки: <span id="score">0</span></div>
    <div>Сила клика: ×<span id="power">1</span></div>
    <div>Автокликер: <span id="auto">0</span></div>
  </div>

  <button class="click-btn" id="click">КЛИК</button>
  
  <button id="upgrade">🔥 Усилить ×2 (<span id="upPrice">100</span>)</button>
  <button id="autoUp">🤖 Автоклик (<span id="autoPrice">500</span>)</button>

  <div class="controls">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
    <button id="resetBtn">🔄 Сброс</button>
  </div>
</div>

<script>
/* ===== ЗВЁЗДЫ ДЛЯ ПК ===== */
const c = document.getElementById("stars");
if (c) {
  const ctx = c.getContext("2d");
  function resizeStars(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  resizeStars();
  window.addEventListener('resize', resizeStars);

  const starsDesktop = [...Array(7500)].map(()=>({
    x: Math.random() * c.width,
    y: Math.random() * c.height,
    s: Math.random() * 1.5
  }));
  function drawStarsDesktop(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle = "white";
    starsDesktop.forEach(st => {
      ctx.globalAlpha = Math.random() * 0.8 + 0.2;
      ctx.fillRect(st.x, st.y, st.s, st.s);
      st.y += st.s * 0.3;
      if(st.y > c.height) st.y = 0;
    });
    requestAnimationFrame(drawStarsDesktop);
  }
  // Запускаем только если ПК (ширина > 768)
  if (window.innerWidth > 768) {
    drawStarsDesktop();
  }
}

/* ===== ОПРЕДЕЛЕНИЕ ПЛАТФОРМЫ ===== */
const isMobile = window.innerWidth <= 768;

/* ===== ЗВЁЗДЫ ДЛЯ ИЛЛЮМИНАТОРА (мобильный) ===== */
let illStarsInterval = null;
const illCanvas = document.getElementById('illuminator-stars');
if (illCanvas) {
  const illCtx = illCanvas.getContext('2d');
  function resizeIllStars() {
    const container = document.getElementById('illuminator-container');
    if (container) {
      illCanvas.width = container.clientWidth;
      illCanvas.height = container.clientHeight;
    }
  }
  window.addEventListener('resize', resizeIllStars);
  resizeIllStars();

  const starsIll = [...Array(3000)].map(()=>({
    x: Math.random() * illCanvas.width,
    y: Math.random() * illCanvas.height,
    s: Math.random() * 1.2
  }));

  function drawIllStars() {
    if (!illCtx) return;
    illCtx.clearRect(0, 0, illCanvas.width, illCanvas.height);
    illCtx.fillStyle = "white";
    starsIll.forEach(st => {
      illCtx.globalAlpha = Math.random() * 0.7 + 0.3;
      illCtx.fillRect(st.x, st.y, st.s, st.s);
      st.y += st.s * 0.2;
      if(st.y > illCanvas.height) st.y = 0;
    });
    illStarsInterval = requestAnimationFrame(drawIllStars);
  }

  // Запускаем анимацию, если открыта мобильная панель иллюминатора
  function checkIlluminatorOpen() {
    const panel = document.getElementById('mobileIlluminatorPanel');
    if (panel && panel.classList.contains('open') && !illStarsInterval) {
      resizeIllStars();
      drawIllStars();
    } else if ((!panel || !panel.classList.contains('open')) && illStarsInterval) {
      cancelAnimationFrame(illStarsInterval);
      illStarsInterval = null;
    }
  }
  
  // Наблюдаем за классом панели
  const observer = new MutationObserver(checkIlluminatorOpen);
  const mobIllPanel = document.getElementById('mobileIlluminatorPanel');
  if (mobIllPanel) observer.observe(mobIllPanel, { attributes: true, attributeFilter: ['class'] });
}

/* ===== ЗВУКИ ===== */
const ac = new (window.AudioContext || window.webkitAudioContext)();
let musicInterval = null;
let currentMelody = 1;

function playNotes(notes, duration = 1.5, type = 'sine') {
  const now = ac.currentTime;
  notes.forEach((freq, index) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.02, now + index * 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.3 + duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(now + index * 0.3);
    osc.stop(now + index * 0.3 + duration);
  });
}

function playMelody1() { playNotes([261.63, 329.63, 392.0], 1.5, 'sine'); }
function playMelody2() { playNotes([220.0, 261.63, 329.63], 1.5, 'triangle'); }
function playMelody3() {
  const now = ac.currentTime;
  [440.0, 554.37, 659.25, 880.0].forEach((freq, i) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.01, now + i * 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.5 + 2.5);
    osc.connect(gain).connect(ac.destination);
    osc.start(now + i * 0.5);
    osc.stop(now + i * 0.5 + 2.5);
  });
}
function playMelody4() {
  const now = ac.currentTime;
  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
  notes.forEach((freq, i) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.015, now + i * 0.25);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.8);
    osc.connect(gain).connect(ac.destination);
    osc.start(now + i * 0.25);
    osc.stop(now + i * 0.25 + 0.8);
  });
}

function startMusic() {
  if (musicInterval) clearInterval(musicInterval);
  if (currentMelody === 0) return;
  const player = 
    currentMelody === 1 ? playMelody1 :
    currentMelody === 2 ? playMelody2 :
    currentMelody === 3 ? playMelody3 : playMelody4;
  player();
  musicInterval = setInterval(player, 4000);
}

function changeMelody(melody) {
  currentMelody = melody;
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
  if (melody !== 0) startMusic();
}

function clickSound(){
  const now = ac.currentTime;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'sine';
  osc.frequency.value = 660;
  gain.gain.setValueAtTime(0.1, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(gain).connect(ac.destination);
  osc.start(now);
  osc.stop(now + 0.15);
}

let musicStarted = false;
function tryStartMusic() {
  if (!musicStarted && currentMelody !== 0) {
    ac.resume().then(() => {
      startMusic();
      musicStarted = true;
    });
  }
}

/* ===== ИГРОВЫЕ ДАННЫЕ ===== */
let score = 0;
let power = 1;
let auto = 0;
let upPrice = 100;
let autoPrice = 500;
let owned = {};      // { itemId: imgUrl }
let pos = {};        // для ПК: координаты
let mobilePos = {};  // для мобильных: координаты внутри иллюминатора

const scoreEl = document.getElementById('score');
const powerEl = document.getElementById('power');
const autoEl = document.getElementById('auto');
const upPriceSpan = document.getElementById('upPrice');
const autoPriceSpan = document.getElementById('autoPrice');

const bg = document.getElementById('bg');
const illuminatorContainer = document.getElementById('illuminator-container');

// Названия предметов
const itemNames = [
  "Звёздный осколок", "Лунный камень", "Пламенное сердце", "Древняя монета", "Кристалл дракона",
  "Глаз феникса", "Руна ветра", "Жемчужина глубин", "Клык оборотня", "Перо грифона",
  "Чешуя дракона", "Коготь виверны", "Слеза единорога", "Корень мандрагоры", "Светлячок в банке",
  "Механическое сердце", "Хрустальный череп", "Золотое яблоко", "Серебряная подкова", "Книга заклинаний",
  "Амулет времени", "Кольцо всевластия", "Кулон луны", "Браслет ветра", "Диадема солнца",
  "Посох мага", "Меч короля", "Щит воина", "Шлем викинга", "Лук эльфа",
  "Кинжал тени", "Топор варвара", "Булава паладина", "Копьё судьбы", "Молот Тора",
  "Сфера пророчеств", "Карта сокровищ", "Компас странника", "Фонарь душ", "Ключ от бездны",
  "Песочные часы", "Весы правосудия", "Зеркало истины", "Маска демона", "Крыло ангела",
  "Роза ветров", "Клевер удачи", "Жёлудь мира", "Шип розы", "Лепесток лотоса"
];

const items = [...Array(50)].map((_, i) => ({
  id: 'item' + i,
  name: itemNames[i],
  price: Math.floor(800 * Math.pow(1.25, i)),
  img: `https://picsum.photos/seed/${i}/64`
}));

function update() {
  scoreEl.textContent = Math.floor(score);
  powerEl.textContent = power;
  autoEl.textContent = auto;
  upPriceSpan.textContent = upPrice;
  autoPriceSpan.textContent = autoPrice;
}
update();

/* ===== ДОБАВЛЕНИЕ ПРЕДМЕТА ===== */
function addItemToView(id, imgSrc) {
  if (isMobile) {
    const el = document.createElement('img');
    el.src = imgSrc;
    el.className = 'illuminator-item';
    const containerRect = illuminatorContainer.getBoundingClientRect();
    const defaultX = containerRect.width ? Math.random() * (containerRect.width - 60) : 50;
    const defaultY = containerRect.height ? Math.random() * (containerRect.height - 60) : 50;
    el.style.left = (mobilePos[id]?.x || defaultX) + 'px';
    el.style.top = (mobilePos[id]?.y || defaultY) + 'px';
    makeDraggableInContainer(el, id);
    illuminatorContainer.appendChild(el);
  } else {
    const el = document.createElement('img');
    el.src = imgSrc;
    el.className = 'bg-item';
    el.style.left = (pos[id]?.x || Math.random() * innerWidth) + 'px';
    el.style.top = (pos[id]?.y || Math.random() * innerHeight) + 'px';
    makeDraggableOnScreen(el, id);
    bg.appendChild(el);
  }
}

function makeDraggableOnScreen(el, id) {
  let dx, dy;
  el.onmousedown = e => {
    e.preventDefault();
    dx = e.clientX - el.offsetLeft;
    dy = e.clientY - el.offsetTop;
    document.onmousemove = m => {
      el.style.left = (m.clientX - dx) + 'px';
      el.style.top = (m.clientY - dy) + 'px';
      pos[id] = { x: m.clientX - dx, y: m.clientY - dy };
    };
    document.onmouseup = () => {
      document.onmousemove = null;
      document.onmouseup = null;
    };
  };
}

function makeDraggableInContainer(el, id) {
  let dx, dy;
  el.onmousedown = e => {
    e.preventDefault();
    const containerRect = illuminatorContainer.getBoundingClientRect();
    dx = e.clientX - containerRect.left - el.offsetLeft;
    dy = e.clientY - containerRect.top - el.offsetTop;
    document.onmousemove = m => {
      let newX = m.clientX - containerRect.left - dx;
      let newY = m.clientY - containerRect.top - dy;
      newX = Math.max(0, Math.min(illuminatorContainer.clientWidth - el.clientWidth, newX));
      newY = Math.max(0, Math.min(illuminatorContainer.clientHeight - el.clientHeight, newY));
      el.style.left = newX + 'px';
      el.style.top = newY + 'px';
      mobilePos[id] = { x: newX, y: newY };
    };
    document.onmouseup = () => {
      document.onmousemove = null;
      document.onmouseup = null;
    };
  };
}

/* ===== МАГАЗИН (рендер для обеих платформ) ===== */
function renderShop(targetElement) {
  targetElement.innerHTML = '';
  items.forEach(item => {
    const d = document.createElement('div');
    d.className = 'item';
    const bought = owned.hasOwnProperty(item.id);
    d.innerHTML = `
      <img src="${item.img}">
      <div style="flex:1">
        <strong>${item.name}</strong><br>
        ${bought ? '✅ Куплено' : '💰 ' + item.price}
      </div>
      <button ${bought ? 'disabled' : ''}>Купить</button>
    `;
    const btn = d.querySelector('button');
    if (!bought) {
      btn.onclick = () => {
        if (score >= item.price) {
          score -= item.price;
          owned[item.id] = item.img;
          addItemToView(item.id, item.img);
          update();
          renderShop(document.getElementById('shopDesktop'));
          renderShop(document.getElementById('shopMobile'));
        }
      };
    }
    targetElement.appendChild(d);
  });
}

// Заполняем оба магазина (десктоп и мобильный)
renderShop(document.getElementById('shopDesktop'));
renderShop(document.getElementById('shopMobile'));

/* ===== КЛИКЕР ===== */
document.getElementById('click').onclick = e => {
  tryStartMusic();
  ac.resume();
  clickSound();

  score += power;
  spawnParticle(e.clientX, e.clientY, '+' + power);
  update();
};

function spawnParticle(x, y, text) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = text;
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}

document.getElementById('upgrade').onclick = () => {
  if (score >= upPrice) {
    score -= upPrice;
    power *= 2;
    upPrice = Math.floor(upPrice * 2.6);
    update();
  }
};

document.getElementById('autoUp').onclick = () => {
  if (score >= autoPrice) {
    score -= autoPrice;
    auto++;
    autoPrice = Math.floor(autoPrice * 2.4);
    update();
  }
};

setInterval(() => {
  if (auto > 0) {
    score += power * auto;
    update();
  }
}, 1000);

/* ===== СОХРАНЕНИЕ/ЗАГРУЗКА ===== */
function saveGame() {
  localStorage.setItem('clicker_score', score);
  localStorage.setItem('clicker_power', power);
  localStorage.setItem('clicker_auto', auto);
  localStorage.setItem('clicker_upPrice', upPrice);
  localStorage.setItem('clicker_autoPrice', autoPrice);
  localStorage.setItem('clicker_owned', JSON.stringify(owned));
  if (isMobile) {
    localStorage.setItem('clicker_mobilePos', JSON.stringify(mobilePos));
  } else {
    localStorage.setItem('clicker_pos', JSON.stringify(pos));
  }
  alert('Прогресс сохранён!');
}

function loadGame() {
  const s = localStorage.getItem('clicker_score');
  if (s === null) {
    alert('Нет сохранённой игры');
    return;
  }
  score = Number(s);
  power = Number(localStorage.getItem('clicker_power')) || 1;
  auto = Number(localStorage.getItem('clicker_auto')) || 0;
  upPrice = Number(localStorage.getItem('clicker_upPrice')) || 100;
  autoPrice = Number(localStorage.getItem('clicker_autoPrice')) || 500;
  owned = JSON.parse(localStorage.getItem('clicker_owned')) || {};

  if (isMobile) {
    mobilePos = JSON.parse(localStorage.getItem('clicker_mobilePos')) || {};
    illuminatorContainer.innerHTML = '<canvas id="illuminator-stars"></canvas>';
    // перезапустим звёзды
    Object.keys(owned).forEach(id => addItemToView(id, owned[id]));
  } else {
    pos = JSON.parse(localStorage.getItem('clicker_pos')) || {};
    bg.innerHTML = '';
    Object.keys(owned).forEach(id => addItemToView(id, owned[id]));
  }

  update();
  renderShop(document.getElementById('shopDesktop'));
  renderShop(document.getElementById('shopMobile'));
  alert('Прогресс загружен!');
}

function resetGame() {
  if (confirm('Сбросить весь прогресс?')) {
    score = 0;
    power = 1;
    auto = 0;
    upPrice = 100;
    autoPrice = 500;
    owned = {};
    pos = {};
    mobilePos = {};
    if (isMobile) {
      illuminatorContainer.innerHTML = '<canvas id="illuminator-stars"></canvas>';
    } else {
      bg.innerHTML = '';
    }
    update();
    renderShop(document.getElementById('shopDesktop'));
    renderShop(document.getElementById('shopMobile'));
  }
}

document.getElementById('saveBtn').onclick = saveGame;
document.getElementById('loadBtn').onclick = loadGame;
document.getElementById('resetBtn').onclick = resetGame;

/* ===== УПРАВЛЕНИЕ ПАНЕЛЯМИ ===== */
// Десктоп
document.getElementById('toggleShopDesktop').onclick = () => {
  document.querySelector('#shopDesktop').classList.toggle('open');
};
document.getElementById('toggleMusicDesktop').onclick = () => {
  document.querySelector('#musicDesktop').classList.toggle('open');
};

// Мобильные кнопки
document.getElementById('mobileShopBtn').onclick = () => {
  document.getElementById('mobileShopPanel').classList.toggle('open');
  document.getElementById('mobileMusicPanel').classList.remove('open');
  document.getElementById('mobileIlluminatorPanel').classList.remove('open');
};
document.getElementById('mobileMusicBtn').onclick = () => {
  document.getElementById('mobileMusicPanel').classList.toggle('open');
  document.getElementById('mobileShopPanel').classList.remove('open');
  document.getElementById('mobileIlluminatorPanel').classList.remove('open');
};
document.getElementById('mobileIlluminatorBtn').onclick = () => {
  document.getElementById('mobileIlluminatorPanel').classList.toggle('open');
  document.getElementById('mobileShopPanel').classList.remove('open');
  document.getElementById('mobileMusicPanel').classList.remove('open');
  // запустим звёзды, если открыто
  if (illStarsInterval) cancelAnimationFrame(illStarsInterval);
  if (document.getElementById('mobileIlluminatorPanel').classList.contains('open')) {
    resizeIllStars();
    drawIllStars();
  }
};

// Музыкальные кнопки (десктоп и мобильные)
const musicButtons = [
  { id: 'musicMelody1', melody: 1 },
  { id: 'musicMelody2', melody: 2 },
  { id: 'musicMelody3', melody: 3 },
  { id: 'musicMelody4', melody: 4 },
  { id: 'musicOff', melody: 0 },
  { id: 'musicMelody1_mob', melody: 1 },
  { id: 'musicMelody2_mob', melody: 2 },
  { id: 'musicMelody3_mob', melody: 3 },
  { id: 'musicMelody4_mob', melody: 4 },
  { id: 'musicOff_mob', melody: 0 }
];
musicButtons.forEach(b => {
  const btn = document.getElementById(b.id);
  if (btn) {
    btn.onclick = () => {
      changeMelody(b.melody);
      if (b.melody !== 0) tryStartMusic();
      else musicStarted = false;
    };
  }
});
</script>
