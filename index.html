<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>🚀 Space Mining · Иконки и планеты</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Все стили без изменений, такие же, как в предыдущем ответе */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0f1a;
      color: #f0f4ff;
    }
    #starsPc {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
      pointer-events: none;
    }
    .glass {
      background: rgba(15, 25, 40, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
    .click-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #aaffdd, #22aaff);
      border: 4px solid #aaddff;
      box-shadow: 0 0 30px #22aaff, 0 10px 20px rgba(0,0,0,0.5);
      font-size: 32px;
      font-weight: bold;
      color: #001122;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.1s;
      margin: 10px auto;
      display: block;
      position: relative;
      overflow: hidden;
    }
    .click-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 60px #88ddff;
    }
    .click-btn::after {
      content: '💎';
      position: absolute;
      font-size: 60px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.2;
    }
    .game {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 460px;
      max-width: 94vw;
      padding: 35px 20px 45px;
      z-index: 5;
      text-align: center;
      background: linear-gradient(145deg, #2b3f60, #0a1a2f);
      border: 3px solid #88ddff;
      border-radius: 90px 90px 120px 120px;
      box-shadow: 0 40px 60px rgba(0,0,0,0.9), 0 0 60px #22aaff;
    }
    .game::before {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 60px;
      background: linear-gradient(to top, #2b3f60, #3a5f8a);
      border-radius: 70% 70% 20px 20px;
      border: 2px solid #88ddff;
      border-bottom: none;
      box-shadow: 0 -15px 25px #22aaff66;
    }
    .game .window-left, .game .window-right {
      position: absolute;
      top: 40px;
      width: 45px;
      height: 45px;
      background: radial-gradient(circle at 30% 30%, #ffffff, #88aaff);
      border-radius: 50%;
      border: 2px solid #aaddff;
      box-shadow: inset 0 0 12px cyan, 0 0 20px cyan;
    }
    .game .window-left { left: 25px; }
    .game .window-right { right: 25px; }
    .game .wing-left, .game .wing-right {
      position: absolute;
      bottom: 0;
      width: 85px;
      height: 150px;
      background: linear-gradient(135deg, #1a2e4a, #0a1a30);
      border: 2px solid #88ddff;
      z-index: -1;
    }
    .game .wing-left {
      left: -40px;
      transform: skewY(25deg);
      border-radius: 50% 0 0 40%;
    }
    .game .wing-right {
      right: -40px;
      transform: skewY(-25deg);
      border-radius: 0 50% 40% 0;
    }
    .game .engine {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 60px;
      background: radial-gradient(circle, #ffaa33, #ff5500);
      border-radius: 50%;
      filter: blur(25px);
      animation: flame 0.4s infinite alternate;
      z-index: -2;
    }
    @keyframes flame {
      0% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.4); }
    }
    .game .antenna {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 50px;
      background: silver;
    }
    .game .antenna::after {
      content: '';
      position: absolute;
      top: -12px;
      left: -10px;
      width: 26px;
      height: 26px;
      background: radial-gradient(circle, #ffdd44, #ffaa00);
      border-radius: 50%;
      box-shadow: 0 0 25px gold;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      font-size: 16px;
      margin: 8px 0;
      background: rgba(0, 20, 40, 0.7);
      padding: 10px;
      border-radius: 40px;
      border: 1px solid #22aaff;
    }
    .stats span {
      margin: 2px 5px;
    }
    .energy-bar {
      width: 100%;
      height: 14px;
      background: #333;
      border-radius: 7px;
      margin: 8px 0;
      overflow: hidden;
    }
    .energy-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ffaa, #00aaff);
      width: 100%;
      transition: width 0.1s;
    }
    button {
      background: rgba(0, 30, 60, 0.8);
      border: 1px solid #22aaff;
      border-radius: 40px;
      padding: 8px 14px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      backdrop-filter: blur(5px);
      transition: 0.1s;
      cursor: pointer;
      box-shadow: 0 0 10px #22aaff66;
      margin: 4px;
    }
    button:active {
      transform: scale(0.94);
      background: #2266aa;
    }
    button:disabled {
      opacity: 0.3;
      pointer-events: none;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }
    .desktop-panels {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 280px;
    }
    .desktop-panel {
      width: 100%;
    }
    .desktop-panel > button {
      width: 100%;
      text-align: left;
      background: rgba(20, 40, 70, 0.9);
    }
    .panel-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s;
      margin-top: 8px;
      background: rgba(0, 20, 40, 0.9);
      border-radius: 24px;
    }
    .panel-content.open {
      max-height: 500px;
      overflow-y: auto;
    }
    .bg-items {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: all;
    }
    .bg-item {
      position: absolute;
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 20px;
      cursor: grab;
      filter: drop-shadow(0 0 12px cyan);
      animation: float 5s ease-in-out infinite;
      pointer-events: auto;
    }
    .mobile-header {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .mobile-header button {
      flex: 1;
      background: rgba(10, 20, 40, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 12px 0;
      font-size: 20px;
    }
    .mobile-panel {
      position: fixed;
      top: 75px;
      left: 12px;
      right: 12px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
      z-index: 19;
      background: rgba(0, 5, 15, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 32px;
    }
    .mobile-panel.open {
      max-height: 80vh;
      overflow-y: auto;
    }
    #illuminator-viewport {
      width: 100%;
      height: 80vh;
      overflow: hidden;
      position: relative;
      background: #010314;
      border-radius: 50%;
      touch-action: none;
      margin: 0 auto;
      box-shadow: 0 0 30px rgba(0,200,255,0.3);
    }
    #illuminator-stars-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
    }
    #illuminator-content {
      transform-origin: 0 0;
      width: 100%;
      height: 100%;
      position: relative;
      will-change: transform;
      z-index: 2;
    }
    .illuminator-item {
      position: absolute;
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 20px;
      cursor: grab;
      filter: drop-shadow(0 0 12px gold);
      z-index: 10;
      animation: float 5s infinite;
      touch-action: none;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .falling-asteroid {
      position: fixed;
      width: 50px;
      height: 50px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%23aa8866"><circle cx="50" cy="50" r="40" fill="%238b5a2b"/><circle cx="30" cy="30" r="8" fill="%23cd7f32"/><circle cx="70" cy="60" r="12" fill="%23b87333"/><circle cx="20" cy="70" r="6" fill="%239c7c3b"/></svg>') center/contain no-repeat;
      pointer-events: auto;
      cursor: pointer;
      z-index: 100;
      filter: drop-shadow(0 0 8px orange);
      animation: fall linear forwards;
    }
    .golden-asteroid {
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%23ffd700"><circle cx="50" cy="50" r="40" fill="%23ffd700"/><circle cx="30" cy="30" r="8" fill="%23f0e68c"/><circle cx="70" cy="60" r="12" fill="%23ffaa00"/><circle cx="20" cy="70" r="6" fill="%23ffff00"/></svg>') center/contain no-repeat;
    }
    @keyframes fall {
      to { top: 110vh; }
    }
    .boost-indicator {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #ffaa33;
      color: #1a1f2e;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: bold;
      box-shadow: 0 0 20px gold;
      z-index: 200;
      display: none;
    }
    .floating-number {
      position: fixed;
      font-size: 32px;
      font-weight: bold;
      color: gold;
      text-shadow: 0 0 20px orange;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }
    .event-message {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #2288ff;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: bold;
      z-index: 300;
      animation: fadeOut 3s forwards;
      box-shadow: 0 0 30px cyan;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (max-width: 768px) {
      #starsPc { display: none; }
      .desktop-panels { display: none; }
    }
    @media (min-width: 769px) {
      .mobile-header, .mobile-panel { display: none; }
    }
    .shop-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .shop-item img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #88ddff;
      background: #0a1a30;
    }
    .shop-item .info {
      flex: 1;
      text-align: left;
    }
    .shop-item .name {
      font-weight: bold;
      color: #ffdd88;
    }
    .shop-item .desc {
      font-size: 12px;
      color: #aaccff;
    }
    .shop-item .price {
      font-size: 14px;
      color: #88ffaa;
    }
    .shop-item button {
      padding: 6px 12px;
      font-size: 14px;
    }
    .ship-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #335;
    }
    .ship-icon {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #88aaff, #224488);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }
    .research-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #335;
    }
  </style>
</head>
<body>

<canvas id="starsPc"></canvas>

<div class="game" id="gameRocket">
  <div class="window-left"></div>
  <div class="window-right"></div>
  <div class="wing-left"></div>
  <div class="wing-right"></div>
  <div class="engine"></div>
  <div class="antenna"></div>

  <h2><i class="fas fa-rocket"></i> SPACE MINING</h2>
  <div class="stats">
    <span><i class="fas fa-gem"></i> <span id="score">2000</span></span>
    <span><i class="fas fa-bolt"></i> x<span id="power">1</span></span>
    <span><i class="fas fa-robot"></i> <span id="auto">0</span></span>
  </div>
  <div class="stats">
    <span><i class="fas fa-battery-full"></i> <span id="energy">100</span>/<span id="maxEnergy">100</span></span>
    <span><i class="fas fa-star"></i> престиж <span id="prestige">0</span></span>
  </div>
  <div class="energy-bar">
    <div class="energy-fill" id="energyBar" style="width:100%"></div>
  </div>

  <button class="click-btn" id="click">КЛИК</button>

  <div style="display: flex; gap:5px; justify-content:center; flex-wrap:wrap;">
    <button id="upgrade"><i class="fas fa-arrow-up"></i> БУР ×2 (<span id="upPrice">100</span>)</button>
    <button id="autoUp"><i class="fas fa-cogs"></i> АВТОДРОН (<span id="autoPrice">500</span>)</button>
  </div>
  <div style="margin-top:5px;">
    <button id="prestigeBtn" disabled><i class="fas fa-sync-alt"></i> ПРЕСТИЖ (нужно 500k)</button>
  </div>

  <div class="controls">
    <button id="saveBtn"><i class="fas fa-save"></i></button>
    <button id="loadBtn"><i class="fas fa-folder-open"></i></button>
    <button id="resetBtn"><i class="fas fa-redo-alt"></i></button>
  </div>
</div>

<!-- ПК панели -->
<div class="desktop-panels">
  <div class="desktop-panel glass">
    <button id="toggleShopDesktop"><i class="fas fa-store"></i> МАГАЗИН ПЛАНЕТ</button>
    <div class="panel-content glass" id="shopDesktop"></div>
  </div>
  <div class="desktop-panel glass">
    <button id="toggleShipDesktop"><i class="fas fa-space-shuttle"></i> МАГАЗИН КОРАБЛЕЙ</button>
    <div class="panel-content glass" id="shipDesktop"></div>
  </div>
  <div class="desktop-panel glass">
    <button id="toggleResearchDesktop"><i class="fas fa-flask"></i> ИССЛЕДОВАНИЯ</button>
    <div class="panel-content glass" id="researchDesktop"></div>
  </div>
  <div class="desktop-panel glass">
    <button id="toggleMusicDesktop"><i class="fas fa-music"></i> МУЗЫКА (20 треков)</button>
    <div class="panel-content glass" id="musicDesktop"></div>
  </div>
</div>

<!-- Мобильный хедер -->
<div class="mobile-header">
  <button id="mobileShopBtn"><i class="fas fa-store"></i></button>
  <button id="mobileShipBtn"><i class="fas fa-space-shuttle"></i></button>
  <button id="mobileResearchBtn"><i class="fas fa-flask"></i></button>
  <button id="mobileMusicBtn"><i class="fas fa-music"></i></button>
  <button id="mobileIlluminatorBtn"><i class="fas fa-globe"></i></button>
</div>

<!-- Мобильные панели -->
<div class="mobile-panel glass" id="mobileShopPanel"><div style="padding:12px;" id="shopMobile"></div></div>
<div class="mobile-panel glass" id="mobileShipPanel"><div style="padding:12px;" id="shipMobile"></div></div>
<div class="mobile-panel glass" id="mobileResearchPanel"><div style="padding:12px;" id="researchMobile"></div></div>
<div class="mobile-panel glass" id="mobileMusicPanel"><div style="padding:12px;" id="musicMobile"></div></div>
<div class="mobile-panel glass" id="mobileIlluminatorPanel">
  <div style="padding:10px;">
    <div id="illuminator-viewport">
      <canvas id="illuminator-stars-canvas"></canvas>
      <div id="illuminator-content"></div>
    </div>
    <p><i class="fas fa-finger"></i> двумя пальцами zoom/pan</p>
  </div>
</div>

<div class="bg-items" id="bgPcItems"></div>
<div class="boost-indicator" id="boostIndicator"><i class="fas fa-bolt"></i> x10 УСКОРЕНИЕ</div>

<script>
(function() {
  // ================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==================
  let score = 2000; // начальный капитал
  let power = 1;
  let auto = 0;
  let upPrice = 100;
  let autoPrice = 500;

  let energy = 100;
  let maxEnergy = 100;
  let energyRegen = 1;

  let prestige = 0;
  let prestigeMultiplier = 1;
  const PRESTIGE_THRESHOLD = 500000;

  const research = [
    { id: 'power1', name: 'Мощный бур', desc: 'Увеличивает силу клика на 1', max: 5, level: 0, baseCost: 500 },
    { id: 'auto1', name: 'Автоматизация', desc: '+1 автокликер', max: 5, level: 0, baseCost: 800 },
    { id: 'energy1', name: 'Энергоэффективность', desc: 'Шанс не тратить энергию +5%', max: 5, level: 0, baseCost: 400 },
    { id: 'regen1', name: 'Регенерация', desc: '+0.2 энергии/сек', max: 5, level: 0, baseCost: 300 },
    { id: 'crit1', name: 'Критический удар', desc: 'Шанс двойной добычи 5%', max: 5, level: 0, baseCost: 600 },
    { id: 'luck1', name: 'Везучий шахтёр', desc: 'Шанс редкого минерала +2%', max: 5, level: 0, baseCost: 700 },
    { id: 'maxEnergy1', name: 'Накопители', desc: '+20 макс. энергии', max: 5, level: 0, baseCost: 500 },
    { id: 'asteroid1', name: 'Астероидный магнат', desc: 'Увеличивает награду с астероидов на 20%', max: 5, level: 0, baseCost: 900 }
  ];

  // Магазин предметов (астероиды и планеты) с проверенными иконками
  const shopItems = [
    // Астероиды (5)
    { id: 'ast1', name: 'Астероид Церера', desc: 'Богат водяным льдом. Даёт +10 к макс. энергии.', price: 800, bonus: () => { maxEnergy += 10; energy += 10; }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Ceres_-_RC3_-_Haulani_Crater_%2822381131621%29.jpg/1024px-Ceres_-_RC3_-_Haulani_Crater_%2822381131621%29.jpg' },
    { id: 'ast2', name: 'Астероид Веста', desc: 'Один из крупнейших. Даёт +0.2 регенерации энергии.', price: 950, bonus: () => { energyRegen += 0.2; }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Vesta_full_mosaic.jpg/1024px-Vesta_full_mosaic.jpg' },
    { id: 'ast3', name: 'Астероид Эрос', desc: 'Близкий к Земле. Увеличивает силу клика на 1.', price: 1100, bonus: () => { power += 1; }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Eros_-_PIA02923_%28color%29.jpg/1024px-Eros_-_PIA02923_%28color%29.jpg' },
    { id: 'ast4', name: 'Астероид Итокава', desc: 'Имеет необычную форму. +2% к удаче.', price: 1300, bonus: () => { research.find(r => r.id === 'luck1').level = Math.min(5, research.find(r => r.id === 'luck1').level + 1); }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Itokawa.jpg/1024px-Itokawa.jpg' },
    { id: 'ast5', name: 'Астероид Рюгу', desc: 'Содержит органические вещества. Даёт +1 автокликер.', price: 1500, bonus: () => { auto += 1; }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Ryugu_close_up.jpg/1024px-Ryugu_close_up.jpg' },
    // Планеты (10)
    { id: 'pl1', name: 'Меркурий', desc: 'Ближайшая к Солнцу. +5% к криту.', price: 2000, bonus: () => { research.find(r => r.id === 'crit1').level = Math.min(5, research.find(r => r.id === 'crit1').level + 1); }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Mercury_in_color_-_Prockter07-edit1.jpg/1024px-Mercury_in_color_-_Prockter07-edit1.jpg' },
    { id: 'pl2', name: 'Венера', desc: 'Планета с плотной атмосферой. +20 к макс. энергии.', price: 2400, bonus: () => { maxEnergy += 20; energy += 20; }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Venus-real_color.jpg/1024px-Venus-real_color.jpg' },
    { id: 'pl3', name: 'Земля', desc: 'Колыбель человечества. +0.3 регенерации.', price: 3000, bonus: () => { energyRegen += 0.3; }, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_earth_at_night.jpg/1024px-The_earth_at_night.jpg' },

  // ================== МУЗЫКА (20 треков) ==================
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const ac = new AudioContext();
  let musicInterval = null;
  let currentMelody = 0;

  function createLongMelody(index) {
    return function() {
      const now = ac.currentTime;
      const baseFreq = 180 + index * 12;
      const type = index % 4 === 0 ? 'sine' : (index % 4 === 1 ? 'triangle' : (index % 4 === 2 ? 'square' : 'sawtooth'));
      for (let i = 0; i < 40 + index; i++) {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        let freq = baseFreq * (1 + 0.3 * Math.sin(i * 0.5)) * (1 + 0.1 * Math.sin(i * 1.3));
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.03, now + i * 0.35);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.35 + 0.8);
        osc.connect(gain).connect(ac.destination);
        osc.start(now + i * 0.35);
        osc.stop(now + i * 0.35 + 0.9);
      }
      for (let j = 0; j < 20; j++) {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'triangle';
        osc.frequency.value = baseFreq * 0.5 * (1 + 0.2 * Math.sin(j * 0.8));
        gain.gain.setValueAtTime(0.05, now + j * 1.0);
        gain.gain.exponentialRampToValueAtTime(0.001, now + j * 1.0 + 1.5);
        osc.connect(gain).connect(ac.destination);
        osc.start(now + j * 1.0);
        osc.stop(now + j * 1.0 + 1.6);
      }
    };
  }

  const melodies = [null];
  for (let i = 1; i <= 20; i++) melodies.push(createLongMelody(i));

  function startMusic() {
    if (musicInterval) clearInterval(musicInterval);
    if (currentMelody === 0 || !melodies[currentMelody]) return;
    melodies[currentMelody]();
    musicInterval = setInterval(() => {
      if (currentMelody && melodies[currentMelody]) melodies[currentMelody]();
    }, 30000);
  }

  function changeMelody(index) {
    currentMelody = index;
    if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
    if (index !== 0) startMusic();
  }

  function clickSound() {
    const now = ac.currentTime;
    const osc1 = ac.createOscillator();
    const gain1 = ac.createGain();
    osc1.type = 'sine';
    osc1.frequency.value = 659.25;
    gain1.gain.setValueAtTime(0.1, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc1.connect(gain1).connect(ac.destination);
    osc1.start(now);
    osc1.stop(now + 0.15);
    const osc2 = ac.createOscillator();
    const gain2 = ac.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = 880;
    gain2.gain.setValueAtTime(0.07, now + 0.03);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc2.connect(gain2).connect(ac.destination);
    osc2.start(now + 0.03);
    osc2.stop(now + 0.18);
  }

  // ================== ЗВЁЗДНЫЙ ФОН ==================
  const canvasPc = document.getElementById('starsPc');
  if (canvasPc) {
    const ctxPc = canvasPc.getContext('2d');
    let w, h;
    function resizePc() { w = window.innerWidth; h = window.innerHeight; canvasPc.width = w; canvasPc.height = h; }
    resizePc();
    window.addEventListener('resize', resizePc);
    let starsPc = [...Array(3000)].map(() => ({ x: Math.random() * w, y: Math.random() * h, s: Math.random() * 1.8 }));
    function drawPcStars() {
      if (!ctxPc) return;
      ctxPc.clearRect(0, 0, w, h);
      ctxPc.fillStyle = 'white';
      starsPc.forEach(s => {
        ctxPc.globalAlpha = 0.7 + Math.random() * 0.3;
        ctxPc.fillRect(s.x, s.y, s.s, s.s);
        let speedFactor = boostMultiplier > 1 ? 2 : 1;
        s.y += s.s * 0.2 * speedFactor;
        if (s.y > h) s.y = 0;
      });
      requestAnimationFrame(drawPcStars);
    }
    drawPcStars();
  }

  // ================== ИЛЛЮМИНАТОР ==================
  const illCanvas = document.getElementById('illuminator-stars-canvas');
  const illCtx = illCanvas ? illCanvas.getContext('2d') : null;
  let worldStars = [];
  const WORLD_SIZE = 4000;
  if (illCanvas) {
    for (let i = 0; i < 2000; i++) {
      worldStars.push({ x: (Math.random() - 0.5) * WORLD_SIZE, y: (Math.random() - 0.5) * WORLD_SIZE, speed: 0.1 + Math.random() * 0.3, size: Math.random() * 1.5 + 0.5 });
    }
    let scale = 1, translateX = 0, translateY = 0;
    function drawIllStars() {
      if (!illCtx || !illCanvas) return;
      const w = illCanvas.width; const h = illCanvas.height;
      illCtx.clearRect(0, 0, w, h);
      illCtx.fillStyle = 'white';
      worldStars.forEach(star => {
        const screenX = translateX + star.x * scale;
        const screenY = translateY + star.y * scale;
        if (screenX > -10 && screenX < w + 10 && screenY > -10 && screenY < h + 10) {
          illCtx.globalAlpha = 0.6 + Math.random() * 0.3;
          illCtx.fillRect(screenX, screenY, star.size, star.size);
        }
        let speedFactor = boostMultiplier > 1 ? 3 : 1;
        star.y += star.speed * 0.5 * speedFactor;
        if (star.y > WORLD_SIZE/2) star.y = -WORLD_SIZE/2;
      });
      requestAnimationFrame(drawIllStars);
    }
    drawIllStars();
    window.illuminatorTransform = { set: (s, tx, ty) => { scale = s; translateX = tx; translateY = ty; } };
  }

  // ================== ДОБАВЛЕНИЕ ПРЕДМЕТОВ (С КАРТИНКАМИ) ==================
  function addItemToWorld(id, imgSrc) {
    const fallbackSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%234488aa"/><text x="50" y="70" font-size="60" text-anchor="middle" fill="white">🪐</text></svg>';
    if (isMobile) {
      const content = document.getElementById('illuminator-content');
      if (!content) return;
      const img = document.createElement('img');
      img.src = imgSrc;
      img.className = 'illuminator-item';
      img.dataset.id = id;
      img.onerror = () => { img.src = fallbackSvg; };
      const viewport = document.getElementById('illuminator-viewport');
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      const screenCenterX = vpW / 2;
      const screenCenterY = vpH / 2;
      const scale = window.currentScale !== undefined ? window.currentScale : 1;
      const transX = window.currentTranslateX !== undefined ? window.currentTranslateX : 0;
      const transY = window.currentTranslateY !== undefined ? window.currentTranslateY : 0;
      const contentX = (screenCenterX - transX) / scale - 32;
      const contentY = (screenCenterY - transY) / scale - 32;
      let x = contentX, y = contentY;
      if (mobItemPos[id]) {
        x = mobItemPos[id].x;
        y = mobItemPos[id].y;
      } else {
        mobItemPos[id] = { x, y };
      }
      img.style.left = x + 'px';
      img.style.top = y + 'px';
      makeDraggableInIlluminator(img, id);
      content.appendChild(img);
    } else {
      const bg = document.getElementById('bgPcItems');
      const img = document.createElement('img');
      img.src = imgSrc;
      img.className = 'bg-item';
      img.dataset.id = id;
      img.onerror = () => { img.src = fallbackSvg; };
      let x = 100, y = 100;
      if (pcItemPos[id]) {
        x = pcItemPos[id].x;
        y = pcItemPos[id].y;
      } else {
        x = Math.random() * (window.innerWidth - 100);
        y = Math.random() * (window.innerHeight - 100);
        pcItemPos[id] = { x, y };
      }
      img.style.left = x + 'px';
      img.style.top = y + 'px';
      makeDraggableOnPc(img, id);
      bg.appendChild(img);
    }
  }

  function makeDraggableOnPc(el, id) {
    let dx, dy;
    el.onmousedown = (e) => {
      e.preventDefault();
      dx = e.clientX - el.offsetLeft;
      dy = e.clientY - el.offsetTop;
      document.onmousemove = (m) => {
        el.style.left = (m.clientX - dx) + 'px';
        el.style.top = (m.clientY - dy) + 'px';
        pcItemPos[id] = { x: m.clientX - dx, y: m.clientY - dy };
      };
      document.onmouseup = () => { document.onmousemove = null; };
    };
  }

  function makeDraggableInIlluminator(el, id) {
    let startX, startY, startLeft, startTop;
    const content = document.getElementById('illuminator-content');
    function dragStart(clientX, clientY) {
      startLeft = parseFloat(el.style.left) || 0;
      startTop = parseFloat(el.style.top) || 0;
      startX = clientX;
      startY = clientY;
    }
    function dragMove(clientX, clientY) {
      const scale = window.currentScale !== undefined ? window.currentScale : 1;
      const dx = (clientX - startX) / scale;
      const dy = (clientY - startY) / scale;
      let newX = startLeft + dx;
      let newY = startTop + dy;
      newX = Math.max(0, Math.min(content.clientWidth - el.clientWidth, newX));
      newY = Math.max(0, Math.min(content.clientHeight - el.clientHeight, newY));
      el.style.left = newX + 'px';
      el.style.top = newY + 'px';
      mobItemPos[id] = { x: newX, y: newY };
    }
    el.onmousedown = (e) => {
      e.preventDefault();
      dragStart(e.clientX, e.clientY);
      document.onmousemove = (m) => { dragMove(m.clientX, m.clientY); };
      document.onmouseup = () => { document.onmousemove = null; };
    };
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const touch = e.touches[0];
      dragStart(touch.clientX, touch.clientY);
    }, { passive: false });
    el.addEventListener('touchmove', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const touch = e.touches[0];
      dragMove(touch.clientX, touch.clientY);
    }, { passive: false });
    el.addEventListener('touchend', (e) => { e.preventDefault(); });
  }

  // ================== ЗУМ/ПАН ИЛЛЮМИНАТОРА ==================
  const viewport = document.getElementById('illuminator-viewport');
  const content = document.getElementById('illuminator-content');
  if (viewport && content) {
    let scale = 1, translateX = 0, translateY = 0;
    let startDistance = 0, startScale = 1;
    let startPan = { x: 0, y: 0 };
    viewport.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        startDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        startScale = scale;
      } else if (e.touches.length === 1) {
        startPan = { x: e.touches[0].clientX - translateX, y: e.touches[0].clientY - translateY };
      }
    });
    viewport.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        scale = Math.min(3, Math.max(0.8, startScale * (dist / startDistance)));
        applyTransform();
      } else if (e.touches.length === 1) {
        translateX = e.touches[0].clientX - startPan.x;
        translateY = e.touches[0].clientY - startPan.y;
        applyTransform();
      }
    });
    function applyTransform() {
      content.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      if (window.illuminatorTransform) window.illuminatorTransform.set(scale, translateX, translateY);
      window.currentScale = scale;
      window.currentTranslateX = translateX;
      window.currentTranslateY = translateY;
    }
    window.currentScale = 1; window.currentTranslateX = 0; window.currentTranslateY = 0;
  }

  // ================== РЕНДЕР МАГАЗИНА ПРЕДМЕТОВ ==================
  function renderShop(container) {
    if (!container) return;
    container.innerHTML = '';
    shopItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'shop-item';
      const bought = ownedItems.hasOwnProperty(item.id);
      div.innerHTML = `
        <img src="${item.img}" alt="${item.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 100\\'><circle cx=\\'50\\' cy=\\'50\\' r=\\'45\\' fill=\\'%234488aa\\'/><text x=\\'50\\' y=\\'70\\' font-size=\\'60\\' text-anchor=\\'middle\\' fill=\\'white\\'>🪐</text></svg>'">
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="desc">${item.desc}</div>
          <div class="price">💰 ${item.price}</div>
        </div>
        <button ${bought ? 'disabled' : ''}>${bought ? '✅' : 'Купить'}</button>
      `;
      const btn = div.querySelector('button');
      if (!bought) {
        btn.onclick = () => {
          if (score >= item.price) {
            score -= item.price;
            ownedItems[item.id] = item.img;
            item.bonus();
            addItemToWorld(item.id, item.img);
            updateStats();
            renderShop(document.getElementById('shopDesktop'));
            renderShop(document.getElementById('shopMobile'));
          }
        };
      }
      container.appendChild(div);
    });
  }

  // ================== РЕНДЕР МАГАЗИНА КОРАБЛЕЙ ==================
  function renderShips(container) {
    if (!container) return;
    container.innerHTML = '';
    ships.forEach(ship => {
      const div = document.createElement('div');
      div.className = 'ship-item';
      const owned = ownedShips.includes(ship.id);
      const isCurrent = currentShip === ship.id;
      div.innerHTML = `
        <div class="ship-icon">${ship.img}</div>
        <div style="flex:1">
          <div><strong>${ship.name}</strong> ${isCurrent ? '(текущий)' : ''}</div>
          <div><small>${ship.desc}</small></div>
          ${ship.price > 0 ? `<div>💰 ${ship.price}</div>` : ''}
        </div>
        <button ${owned ? 'disabled' : ''} ${ship.price === 0 ? 'disabled' : ''}>${owned ? 'Владеете' : 'Купить'}</button>
      `;
      const btn = div.querySelector('button');
      if (!owned && ship.price > 0) {
        btn.onclick = () => {
          if (score >= ship.price) {
            score -= ship.price;
            ownedShips.push(ship.id);
            equipShip(ship.id);
            updateStats();
            renderShips(document.getElementById('shipDesktop'));
            renderShips(document.getElementById('shipMobile'));
          }
        };
      } else if (owned && !isCurrent) {
        btn.textContent = 'Выбрать';
        btn.disabled = false;
        btn.onclick = () => {
          equipShip(ship.id);
          renderShips(container);
        };
      }
      container.appendChild(div);
    });
  }

  function equipShip(shipId) {
    currentShip = shipId;
    const ship = ships.find(s => s.id === shipId);
    if (ship) {
      if (ship.bonus.maxEnergy) { maxEnergy += ship.bonus.maxEnergy; energy += ship.bonus.maxEnergy; }
      if (ship.bonus.regen) energyRegen += ship.bonus.regen;
      if (ship.bonus.auto) auto += ship.bonus.auto;
      // другие бонусы можно добавить
    }
  }

  // ================== РЕНДЕР ИССЛЕДОВАНИЙ ==================
  function renderResearch(container) {
    if (!container) return;
    container.innerHTML = '';
    research.forEach(r => {
      const div = document.createElement('div');
      div.className = 'research-item';
      let cost = Math.floor(r.baseCost * Math.pow(1.5, r.level));
      div.innerHTML = `<div><strong>${r.name} (ур. ${r.level}/${r.max})</strong><br><small>${r.desc}</small></div><div><button ${r.level >= r.max ? 'disabled' : ''}>улучшить ${cost}</button></div>`;
      const btn = div.querySelector('button');
      if (r.level < r.max) {
        btn.onclick = () => {
          if (score >= cost) {
            score -= cost;
            r.level++;
            if (r.id === 'power1') power += 1;
            else if (r.id === 'auto1') auto += 1;
            else if (r.id === 'regen1') energyRegen += 0.2;
            else if (r.id === 'maxEnergy1') { maxEnergy += 20; energy += 20; }
            updateStats();
            renderResearch(container);
          }
        };
      }
      container.appendChild(div);
    });
  }

  // ================== ОСНОВНЫЕ МЕХАНИКИ ==================
  setInterval(() => {
    energy = Math.min(maxEnergy, energy + energyRegen);
    updateStats();
  }, 1000);

  setInterval(() => {
    if (auto > 0 && energy >= auto) {
      energy -= auto;
      let gain = power * auto * boostMultiplier * prestigeMultiplier;
      let luckLevel = research.find(r => r.id === 'luck1').level;
      if (Math.random() < 0.1 + luckLevel * 0.02) gain *= 1.5;
      score += gain;
      updateStats();
    }
  }, 1000);

  document.getElementById('click').onclick = (e) => {
    ac.resume();
    if (energy < 1) return;
    energy -= 1;
    clickSound();
    let gain = power * boostMultiplier * prestigeMultiplier;
    let energySaveLevel = research.find(r => r.id === 'energy1').level;
    if (Math.random() < energySaveLevel * 0.05) energy += 1;
    let critLevel = research.find(r => r.id === 'crit1').level;
    if (Math.random() < critLevel * 0.05) gain *= 2;
    let luckLevel = research.find(r => r.id === 'luck1').level;
    if (Math.random() < 0.1 + luckLevel * 0.02) gain *= 1.5;
    score += gain;
    updateStats();
    showFloatingNumber(e.clientX, e.clientY, '+' + Math.floor(gain));
  };

  document.getElementById('upgrade').onclick = () => {
    if (score >= upPrice) { score -= upPrice; power *= 2; upPrice = Math.floor(upPrice * 2.6); updateStats(); }
  };
  document.getElementById('autoUp').onclick = () => {
    if (score >= autoPrice) { score -= autoPrice; auto++; autoPrice = Math.floor(autoPrice * 2.4); updateStats(); }
  };

  document.getElementById('prestigeBtn').onclick = () => {
    if (score >= PRESTIGE_THRESHOLD) {
      prestige++;
      prestigeMultiplier = 1 + prestige * 0.05;
      score = 0;
      power = 1;
      auto = 0;
      upPrice = 100;
      autoPrice = 500;
      energy = maxEnergy;
      research.forEach(r => r.level = 0);
      energyRegen = 1;
      maxEnergy = 100;
      updateStats();
      alert('Престиж получен! Множитель добычи теперь ' + prestigeMultiplier.toFixed(2) + 'x');
    }
  };

  // ================== ПАДАЮЩИЕ АСТЕРОИДЫ ==================
  function spawnFallingAsteroid() {
    const isGolden = Math.random() < 0.3;
    const asteroid = document.createElement('div');
    asteroid.className = 'falling-asteroid' + (isGolden ? ' golden-asteroid' : '');
    asteroid.style.left = Math.random() * window.innerWidth + 'px';
    asteroid.style.top = '-60px';
    asteroid.style.animationDuration = (4 + Math.random() * 4) + 's';
    document.body.appendChild(asteroid);
    asteroid.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isGolden) {
        boostMultiplier = 10;
        document.getElementById('boostIndicator').style.display = 'block';
        setTimeout(() => { boostMultiplier = 1; document.getElementById('boostIndicator').style.display = 'none'; }, 5000);
      } else {
        let gain = 50 + Math.random() * 100;
        let asteroidLevel = research.find(r => r.id === 'asteroid1').level;
        gain *= (1 + asteroidLevel * 0.2);
        score += gain;
        showFloatingNumber(e.clientX, e.clientY, '+' + Math.floor(gain) + '💎');
      }
      asteroid.remove();
    });
    setTimeout(() => { if (asteroid.parentNode) asteroid.remove(); }, 10000);
  }
  setInterval(() => { if (Math.random() < 0.4) spawnFallingAsteroid(); }, 4000);

  // ================== СЛУЧАЙНЫЕ СОБЫТИЯ ==================
  function randomEvent() {
    let r = Math.random();
    if (r < 0.33) {
      let gain = 500 + Math.random() * 1000;
      score += gain;
      showMessage('☄️ Метеоритный дождь! +' + Math.floor(gain) + ' ресурсов');
    } else if (r < 0.66) {
      let loss = Math.min(score, 200 + Math.random() * 300);
      score -= loss;
      showMessage('🔧 Поломка бура! Потеряно ' + Math.floor(loss) + ' ресурсов');
    } else {
      boostMultiplier = 5;
      setTimeout(() => { boostMultiplier = 1; }, 10000);
      showMessage('🏺 Найден артефакт! x5 на 10 сек');
    }
    updateStats();
  }
  function showMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'event-message';
    msg.innerText = text;
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 3000);
  }
  setInterval(randomEvent, 30000);

  // ================== СОХРАНЕНИЕ ==================
  document.getElementById('saveBtn').onclick = () => {
    localStorage.setItem('miningLegend', JSON.stringify({
      score, power, auto, upPrice, autoPrice, ownedItems, pcItemPos, mobItemPos,
      energy, maxEnergy, energyRegen, prestige, research, ownedShips, currentShip
    }));
    alert('Сохранено');
  };
  document.getElementById('loadBtn').onclick = () => {
    let d = JSON.parse(localStorage.getItem('miningLegend') || 'null');
    if (!d) return;
    score = d.score; power = d.power; auto = d.auto; upPrice = d.upPrice; autoPrice = d.autoPrice;
    ownedItems = d.ownedItems || {}; pcItemPos = d.pcPos || {}; mobItemPos = d.mobPos || {};
    energy = d.energy; maxEnergy = d.maxEnergy; energyRegen = d.energyRegen; prestige = d.prestige;
    if (d.research) d.research.forEach((r, i) => { if (research[i]) research[i].level = r.level; });
    ownedShips = d.ownedShips || ['ship0'];
    currentShip = d.currentShip || 'ship0';
    updateStats();
    document.getElementById('bgPcItems').innerHTML = '';
    document.getElementById('illuminator-content').innerHTML = '';
    Object.keys(ownedItems).forEach(id => addItemToWorld(id, ownedItems[id]));
    renderShop(document.getElementById('shopDesktop'));
    renderShop(document.getElementById('shopMobile'));
    renderShips(document.getElementById('shipDesktop'));
    renderShips(document.getElementById('shipMobile'));
    renderResearch(document.getElementById('researchDesktop'));
    renderResearch(document.getElementById('researchMobile'));
  };
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Сброс?')) {
      score = 2000; power = 1; auto = 0; upPrice = 100; autoPrice = 500; ownedItems = {}; pcItemPos = {}; mobItemPos = {};
      energy = 100; maxEnergy = 100; energyRegen = 1; prestige = 0;
      research.forEach(r => r.level = 0);
      ownedShips = ['ship0']; currentShip = 'ship0';
      updateStats();
      document.getElementById('bgPcItems').innerHTML = '';
      document.getElementById('illuminator-content').innerHTML = '';
      renderShop(document.getElementById('shopDesktop'));
      renderShop(document.getElementById('shopMobile'));
      renderShips(document.getElementById('shipDesktop'));
      renderShips(document.getElementById('shipMobile'));
      renderResearch(document.getElementById('researchDesktop'));
      renderResearch(document.getElementById('researchMobile'));
    }
  };

  // ================== МУЗЫКАЛЬНЫЕ КНОПКИ ==================
  function createMusicButtons() {
    const contPc = document.getElementById('musicDesktop');
    const contMob = document.getElementById('musicMobile');
    for (let i = 0; i <= 20; i++) {
      let idx = i === 20 ? 0 : i+1;
      let label = i === 20 ? '🔇 Выкл' : `🎵 Трек ${i+1}`;
      let btnPc = document.createElement('button');
      btnPc.innerHTML = label;
      btnPc.onclick = () => { ac.resume(); changeMelody(idx); };
      contPc.appendChild(btnPc);
      let btnMob = document.createElement('button');
      btnMob.innerHTML = label;
      btnMob.onclick = () => { ac.resume(); changeMelody(idx); };
      contMob.appendChild(btnMob);
    }
  }
  createMusicButtons();

  // ================== ПАНЕЛИ ==================
  document.getElementById('toggleShopDesktop').onclick = () => document.getElementById('shopDesktop').classList.toggle('open');
  document.getElementById('toggleShipDesktop').onclick = () => document.getElementById('shipDesktop').classList.toggle('open');
  document.getElementById('toggleResearchDesktop').onclick = () => document.getElementById('researchDesktop').classList.toggle('open');
  document.getElementById('toggleMusicDesktop').onclick = () => document.getElementById('musicDesktop').classList.toggle('open');
  document.getElementById('mobileShopBtn').onclick = () => {
    document.getElementById('mobileShopPanel').classList.toggle('open');
    document.getElementById('mobileShipPanel').classList.remove('open');
    document.getElementById('mobileResearchPanel').classList.remove('open');
    document.getElementById('mobileMusicPanel').classList.remove('open');
    document.getElementById('mobileIlluminatorPanel').classList.remove('open');
  };
  document.getElementById('mobileShipBtn').onclick = () => {
    document.getElementById('mobileShipPanel').classList.toggle('open');
    document.getElementById('mobileShopPanel').classList.remove('open');
    document.getElementById('mobileResearchPanel').classList.remove('open');
    document.getElementById('mobileMusicPanel').classList.remove('open');
    document.getElementById('mobileIlluminatorPanel').classList.remove('open');
  };
  document.getElementById('mobileResearchBtn').onclick = () => {
    document.getElementById('mobileResearchPanel').classList.toggle('open');
    document.getElementById('mobileShopPanel').classList.remove('open');
    document.getElementById('mobileShipPanel').classList.remove('open');
    document.getElementById('mobileMusicPanel').classList.remove('open');
    document.getElementById('mobileIlluminatorPanel').classList.remove('open');
  };
  document.getElementById('mobileMusicBtn').onclick = () => {
    document.getElementById('mobileMusicPanel').classList.toggle('open');
    document.getElementById('mobileShopPanel').classList.remove('open');
    document.getElementById('mobileShipPanel').classList.remove('open');
    document.getElementById('mobileResearchPanel').classList.remove('open');
    document.getElementById('mobileIlluminatorPanel').classList.remove('open');
  };
  document.getElementById('mobileIlluminatorBtn').onclick = () => {
    document.getElementById('mobileIlluminatorPanel').classList.toggle('open');
    document.getElementById('mobileShopPanel').classList.remove('open');
    document.getElementById('mobileShipPanel').classList.remove('open');
    document.getElementById('mobileResearchPanel').classList.remove('open');
    document.getElementById('mobileMusicPanel').classList.remove('open');
  };

  // Инициализация
  renderShop(document.getElementById('shopDesktop'));
  renderShop(document.getElementById('shopMobile'));
  renderShips(document.getElementById('shipDesktop'));
  renderShips(document.getElementById('shipMobile'));
  renderResearch(document.getElementById('researchDesktop'));
  renderResearch(document.getElementById('researchMobile'));

  window.addEventListener('resize', () => {
    if (illCanvas && document.getElementById('illuminator-viewport')) {
      illCanvas.width = document.getElementById('illuminator-viewport').clientWidth;
      illCanvas.height = document.getElementById('illuminator-viewport').clientHeight;
    }
  });
  if (illCanvas && document.getElementById('illuminator-viewport')) {
    illCanvas.width = document.getElementById('illuminator-viewport').clientWidth;
    illCanvas.height = document.getElementById('illuminator-viewport').clientHeight;
  }

  function showFloatingNumber(x, y, text) {
    let div = document.createElement('div');
    div.className = 'floating-number';
    div.textContent = text;
    div.style.left = (x - 20) + 'px';
    div.style.top = (y - 20) + 'px';
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
  }

  equipShip('ship0');
})();
</script>

</body>
</html>
