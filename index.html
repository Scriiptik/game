<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Линейка</title>

<meta name="theme-color" content="#000000">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: black;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}

video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: black;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
}

#hint {
    position: fixed;
    top: 16px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 14px;
    opacity: 0.85;
}

#ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    color: white;
    padding: 14px 18px;
    border-radius: 18px;
    text-align: center;
    min-width: 220px;
}

#value {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
}

button {
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
}
</style>
</head>

<body>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div id="hint">Коснись двух точек для измерения</div>

<div id="ui">
    <div id="value">— см</div>
    <button onclick="reset()">Сброс</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const value = document.getElementById("value");

let points = [];
let cmPerPixel = 0.026; // калибровка вручную

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });

        video.srcObject = stream;

        await video.play(); // ВАЖНО для iOS
    } catch (e) {
        alert("Не удалось включить камеру. Открой сайт через HTTPS.");
        console.error(e);
    }
}

startCamera();

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

canvas.addEventListener("touchstart", e => {
    if (points.length === 2) return;

    const t = e.touches[0];
    points.push({ x: t.clientX, y: t.clientY });

    if (points.length === 2) draw();
});

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const [a, b] = points;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "#ff3b30";
    ctx.lineWidth = 3;
    ctx.stroke();

    const px = Math.hypot(a.x - b.x, a.y - b.y);
    const cm = (px * cmPerPixel).toFixed(1);

    ctx.fillStyle = "#ff3b30";
    ctx.font = "20px Arial";
    ctx.fillText(cm + " см", b.x + 10, b.y - 10);

    value.textContent = cm + " см";
}

function reset() {
    points = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    value.textContent = "— см";
}
</script>

</body>
</html>
