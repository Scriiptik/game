<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>🌟 Astro Clicker · звёздные предметы</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0f1a;
      color: #f0f4ff;
    }

    /* ----- фон ПК (звёзды canvas) ----- */
    #starsPc {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
      pointer-events: none;
    }

    /* ----- стеклянные панели ----- */
    .glass {
      background: rgba(15, 25, 40, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 10, 30, 0.6);
    }

    /* ----- КНОПКА КЛИКА (круглая) ----- */
    .click-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff6b0, #ffaa33);
      border: none;
      box-shadow: 0 0 30px #ffb347, 0 10px 20px rgba(0,0,0,0.5);
      font-size: 32px;
      font-weight: bold;
      color: #1a1f2e;
      text-transform: uppercase;
      letter-spacing: 4px;
      cursor: pointer;
      transition: 0.1s;
      margin: 20px auto;
      display: block;
    }
    .click-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 60px #ffdd44, 0 5px 15px black;
    }

    /* ----- общий центр ----- */
    .game {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      max-width: 90vw;
      padding: 24px 20px;
      z-index: 5;
      text-align: center;
      background: rgba(5, 15, 30, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 48px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      margin: 12px 0;
      background: rgba(0,0,0,0.3);
      padding: 10px 15px;
      border-radius: 40px;
    }

    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 40px;
      padding: 10px 16px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      backdrop-filter: blur(5px);
      transition: 0.1s;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.94);
      background: rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 20px gold;
    }
    button:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    /* ========== ПК панели (слева) ========== */
    .desktop-panels {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 260px;
    }
    .desktop-panel {
      width: 100%;
    }
    .desktop-panel > button {
      width: 100%;
      text-align: left;
      background: rgba(20,40,70,0.7);
    }
    .panel-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s;
      margin-top: 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 24px;
    }
    .panel-content.open {
      max-height: 500px;
      overflow-y: auto;
    }

    /* ----- ПК фон для предметов (перетаскивание) ----- */
    .bg-items {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: all;
    }
    .bg-item {
      position: absolute;
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 20px;
      cursor: grab;
      filter: drop-shadow(0 0 12px cyan);
      animation: float 5s ease-in-out infinite;
      pointer-events: auto;
    }

    /* ========== МОБИЛЬНЫЙ ИНТЕРФЕЙС ========== */
    .mobile-header {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .mobile-header button {
      flex: 1;
      background: rgba(10,20,40,0.8);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 12px 0;
      font-size: 20px;
    }

    .mobile-panel {
      position: fixed;
      top: 75px;
      left: 12px;
      right: 12px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
      z-index: 19;
      background: rgba(0,5,15,0.9);
      backdrop-filter: blur(16px);
      border-radius: 32px;
    }
    .mobile-panel.open {
      max-height: 60vh;
      overflow-y: hidden;
    }

    /* ----- ИЛЛЮМИНАТОР (круглый, большой) ----- */
    #illuminator-viewport {
      width: 100%;
      height: 60vh;                /* чуть больше */
      overflow: hidden;
      position: relative;
      background: #010314;
      border-radius: 50%;           /* круглый */
      touch-action: none;
      margin: 0 auto;
      box-shadow: 0 0 30px rgba(0,200,255,0.3);
    }
    /* канвас со звёздами (под предметами) */
    #illuminator-stars-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;           /* тоже круглый */
    }
    #illuminator-content {
      transform-origin: 0 0;
      width: 100%;
      height: 100%;
      position: relative;
      will-change: transform;
      z-index: 2;
    }
    .illuminator-item {
      position: absolute;
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 20px;
      cursor: grab;
      filter: drop-shadow(0 0 12px gold);
      z-index: 10;
      animation: float 5s infinite;
      touch-action: none;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* всплывающее число при клике */
    .floating-number {
      position: fixed;
      font-size: 32px;
      font-weight: bold;
      color: gold;
      text-shadow: 0 0 20px orange;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }

    /* общие предметы */
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .item img {
      width: 44px; height: 44px; border-radius: 16px;
    }

    /* адаптация: скрываем ненужное */
    @media (max-width: 768px) {
      #starsPc { display: none; }
      .desktop-panels { display: none; }
    }
    @media (min-width: 769px) {
      .mobile-header, .mobile-panel { display: none; }
    }
  </style>
</head>
<body>

<!-- ===== ЗВЁЗДЫ ПК ===== -->
<canvas id="starsPc"></canvas>

<!-- ===== ПК ПАНЕЛИ (магазин, музыка) ===== -->
<div class="desktop-panels">
  <div class="desktop-panel glass">
    <button id="toggleShopDesktop">🛒 МАГАЗИН ПРЕДМЕТОВ</button>
    <div class="panel-content glass" id="shopDesktop"></div>
  </div>
  <div class="desktop-panel glass">
    <button id="toggleMusicDesktop">🎵 МУЗЫКА (10 треков)</button>
    <div class="panel-content glass" id="musicDesktop"></div>
  </div>
</div>

<!-- ===== МОБИЛЬНЫЙ ХЕДЕР ===== -->
<div class="mobile-header">
  <button id="mobileShopBtn">🛒</button>
  <button id="mobileMusicBtn">🎵</button>
  <button id="mobileIlluminatorBtn">🔮 ИЛЛЮМИНАТОР</button>
</div>

<!-- ===== МОБИЛЬНЫЕ ПАНЕЛИ ===== -->
<div class="mobile-panel glass" id="mobileShopPanel">
  <div style="padding:12px;" id="shopMobile"></div>
</div>
<div class="mobile-panel glass" id="mobileMusicPanel">
  <div style="padding:12px; display: flex; flex-wrap: wrap; gap:6px;" id="musicMobile">
    <!-- будут заполнены кнопки -->
  </div>
</div>
<div class="mobile-panel glass" id="mobileIlluminatorPanel">
  <div style="padding:10px;">
    <div id="illuminator-viewport">
      <canvas id="illuminator-stars-canvas"></canvas>
      <div id="illuminator-content"></div>
    </div>
    <p style="text-align:center; margin:6px 0;">👆 двумя пальцами zoom / pan</p>
  </div>
</div>

<!-- ===== ФОН ПК ДЛЯ ПРЕДМЕТОВ ===== -->
<div class="bg-items" id="bgPcItems"></div>

<!-- ===== ОСНОВНОЙ ИГРОВОЙ БЛОК (ЦЕНТР) ===== -->
<div class="game glass">
  <h2 style="margin:0 0 12px;">⚡ ASTRO CLICKER</h2>
  <div class="stats">
    <span>✨ <span id="score">0</span></span>
    <span>💥 x<span id="power">1</span></span>
    <span>🤖 <span id="auto">0</span></span>
  </div>

  <button class="click-btn" id="click">КЛИК</button>

  <button id="upgrade">🔥 УСИЛИТЬ ×2  (<span id="upPrice">100</span>)</button>
  <button id="autoUp">⚙️ АВТОКЛИКЕР (<span id="autoPrice">500</span>)</button>

  <div class="controls">
    <button id="saveBtn">💾 СОХР</button>
    <button id="loadBtn">📂 ЗАГР</button>
    <button id="resetBtn">🔄 СБРОС</button>
  </div>
</div>

<script>
(function() {
  // --------------------------------------------------------------
  // 1. Глобальные переменные
  // --------------------------------------------------------------
  let score = 0;
  let power = 1;
  let auto = 0;
  let upPrice = 100;
  let autoPrice = 500;
  let owned = {};          // id -> img url
  let pcItemPos = {};      // координаты на ПК фоне
  let mobItemPos = {};     // координаты внутри illuminator-content (абсолютные, без масштаба)

  const isMobile = window.innerWidth <= 768;

  // элементы
  const scoreEl = document.getElementById('score');
  const powerEl = document.getElementById('power');
  const autoEl = document.getElementById('auto');
  const upPriceSpan = document.getElementById('upPrice');
  const autoPriceSpan = document.getElementById('autoPrice');

  function updateStats() {
    scoreEl.textContent = Math.floor(score);
    powerEl.textContent = power;
    autoEl.textContent = auto;
    upPriceSpan.textContent = upPrice;
    autoPriceSpan.textContent = autoPrice;
  }
  updateStats();

  // --------------------------------------------------------------
  // 2. Генерация предметов (50 штук)
  // --------------------------------------------------------------
  const itemNames = [
    "Звёздный осколок","Лунный камень","Пламенное сердце","Древняя монета","Кристалл дракона",
    "Глаз феникса","Руна ветра","Жемчужина глубин","Клык оборотня","Перо грифона",
    "Чешуя дракона","Коготь виверны","Слеза единорога","Корень мандрагоры","Светлячок в банке",
    "Механическое сердце","Хрустальный череп","Золотое яблоко","Серебряная подкова","Книга заклинаний",
    "Амулет времени","Кольцо всевластия","Кулон луны","Браслет ветра","Диадема солнца",
    "Посох мага","Меч короля","Щит воина","Шлем викинга","Лук эльфа",
    "Кинжал тени","Топор варвара","Булава паладина","Копьё судьбы","Молот Тора",
    "Сфера пророчеств","Карта сокровищ","Компас странника","Фонарь душ","Ключ от бездны",
    "Песочные часы","Весы правосудия","Зеркало истины","Маска демона","Крыло ангела",
    "Роза ветров","Клевер удачи","Жёлудь мира","Шип розы","Лепесток лотоса"
  ];
  const items = [...Array(50)].map((_, i) => ({
    id: 'item' + i,
    name: itemNames[i],
    price: Math.floor(800 * Math.pow(1.25, i)),
    img: `https://picsum.photos/seed/item${i}/128`
  }));

  // --------------------------------------------------------------
  // 3. Звуки / Музыка (10 треков + ИНТЕРСТЕЛЛАР)
  // --------------------------------------------------------------
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const ac = new AudioContext();
  let musicInterval = null;
  let currentMelody = 0; // 0 = off

  function playNotes(notes, duration = 1.2, type = 'sine', baseTime = 0.3) {
    const now = ac.currentTime;
    notes.forEach((freq, idx) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.03, now + idx * baseTime);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * baseTime + duration);
      osc.connect(gain).connect(ac.destination);
      osc.start(now + idx * baseTime);
      osc.stop(now + idx * baseTime + duration);
    });
  }

  const m1 = () => playNotes([261.63, 329.63, 392.00, 523.25], 1.0, 'sine', 0.25);
  const m2 = () => playNotes([220, 174.61, 261.63, 329.63], 1.5, 'triangle', 0.35);
  const m3 = () => playNotes([110, 146.83, 220, 293.66], 2.0, 'sawtooth', 0.5);
  const m4 = () => playNotes([440, 554.37, 659.25, 880], 1.2, 'square', 0.2);
  const m5 = () => playNotes([392, 493.88, 587.33, 698.46], 1.1, 'sine', 0.3);
  const m6 = () => playNotes([82.41, 110, 146.83, 196], 2.0, 'triangle', 0.6);
  const m7 = () => playNotes([1046.5, 1318.5, 1568, 2093], 1.8, 'sine', 0.15);
  const m8 = () => playNotes([155.56, 207.65, 311.13, 415.30], 1.7, 'sawtooth', 0.4);
  const m9 = () => playNotes([330, 415, 523, 659], 1.4, 'square', 0.28);
  function playInterstellar() {
    const now = ac.currentTime;
    const bass = [110, 130.81, 146.83, 164.81]; 
    for (let i = 0; i < 8; i++) {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = bass[i % 4] * 0.5;
      gain.gain.setValueAtTime(0.1, now + i * 1.2);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 1.2 + 1.0);
      osc.connect(gain).connect(ac.destination);
      osc.start(now + i * 1.2);
      osc.stop(now + i * 1.2 + 1.2);
    }
    const melody = [880, 783.99, 659.25, 587.33, 523.25, 587.33, 659.25]; 
    melody.forEach((f, j) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.06, now + 0.5 + j * 0.9);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5 + j * 0.9 + 1.3);
      osc.connect(gain).connect(ac.destination);
      osc.start(now + 0.5 + j * 0.9);
      osc.stop(now + 0.5 + j * 0.9 + 1.5);
    });
  }

  const melodies = [null, m1, m2, m3, m4, m5, m6, m7, m8, m9, playInterstellar];

  function startMusic() {
    if (musicInterval) clearInterval(musicInterval);
    if (currentMelody === 0 || !melodies[currentMelody]) return;
    melodies[currentMelody]();
    musicInterval = setInterval(() => {
      if (currentMelody && melodies[currentMelody]) melodies[currentMelody]();
    }, 5500);
  }

  function changeMelody(index) {
    currentMelody = index;
    if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
    if (index !== 0) startMusic();
  }

  // ----- новый приятный звук клика (две ноты) -----
  function clickSound() {
    const now = ac.currentTime;
    // основной тон
    const osc1 = ac.createOscillator();
    const gain1 = ac.createGain();
    osc1.type = 'sine';
    osc1.frequency.value = 659.25; // ми
    gain1.gain.setValueAtTime(0.1, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc1.connect(gain1).connect(ac.destination);
    osc1.start(now);
    osc1.stop(now + 0.15);

    // второй тон чуть позже
    const osc2 = ac.createOscillator();
    const gain2 = ac.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = 880; // ля
    gain2.gain.setValueAtTime(0.07, now + 0.03);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc2.connect(gain2).connect(ac.destination);
    osc2.start(now + 0.03);
    osc2.stop(now + 0.18);
  }

  // --------------------------------------------------------------
  // 4. Звёздный фон ПК (анимация)
  // --------------------------------------------------------------
  const canvasPc = document.getElementById('starsPc');
  if (canvasPc) {
    const ctxPc = canvasPc.getContext('2d');
    let w, h;
    function resizePc() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvasPc.width = w; canvasPc.height = h;
    }
    resizePc();
    window.addEventListener('resize', resizePc);
    const starsPc = [...Array(3000)].map(() => ({
      x: Math.random() * w, y: Math.random() * h, s: Math.random() * 1.8
    }));
    function drawPcStars() {
      if (!ctxPc) return;
      ctxPc.clearRect(0, 0, w, h);
      ctxPc.fillStyle = 'white';
      starsPc.forEach(s => {
        ctxPc.globalAlpha = 0.7 + Math.random() * 0.3;
        ctxPc.fillRect(s.x, s.y, s.s, s.s);
        s.y += s.s * 0.2;
        if (s.y > h) s.y = 0;
      });
      requestAnimationFrame(drawPcStars);
    }
    drawPcStars();
  }

  // --------------------------------------------------------------
  // 5. Звёзды для иллюминатора (мировые координаты)
  // --------------------------------------------------------------
  const illCanvas = document.getElementById('illuminator-stars-canvas');
  const illCtx = illCanvas ? illCanvas.getContext('2d') : null;
  let worldStars = [];
  const WORLD_SIZE = 4000; // мир от -2000 до 2000

  if (illCanvas) {
    // инициализация звёзд в мировом пространстве
    for (let i = 0; i < 2000; i++) {
      worldStars.push({
        x: (Math.random() - 0.5) * WORLD_SIZE,
        y: (Math.random() - 0.5) * WORLD_SIZE,
        speed: 0.1 + Math.random() * 0.3,
        size: Math.random() * 1.5 + 0.5
      });
    }

    // параметры трансформации (обновляются из touch-событий)
    let scale = 1, translateX = 0, translateY = 0;

    // функция перерисовки звёзд с учётом текущей трансформации
    function drawIllStars() {
      if (!illCtx || !illCanvas) return;
      const w = illCanvas.width;
      const h = illCanvas.height;
      illCtx.clearRect(0, 0, w, h);
      illCtx.fillStyle = 'white';

      worldStars.forEach(star => {
        // мировые координаты -> экранные
        const screenX = translateX + star.x * scale;
        const screenY = translateY + star.y * scale;
        // проверка видимости (с небольшим запасом)
        if (screenX > -10 && screenX < w + 10 && screenY > -10 && screenY < h + 10) {
          illCtx.globalAlpha = 0.6 + Math.random() * 0.3;
          illCtx.fillRect(screenX, screenY, star.size, star.size);
        }
        // медленное движение звёзд (для эффекта)
        star.y += star.speed * 0.5;
        if (star.y > WORLD_SIZE/2) star.y = -WORLD_SIZE/2;
      });
      requestAnimationFrame(drawIllStars);
    }
    drawIllStars();

    // экспорт параметров для использования в touch-обработчиках
    window.illuminatorTransform = {
      set: (s, tx, ty) => { scale = s; translateX = tx; translateY = ty; }
    };
  }

  // --------------------------------------------------------------
  // 6. Рендер магазина
  // --------------------------------------------------------------
  function renderShop(container) {
    if (!container) return;
    container.innerHTML = '';
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item';
      const bought = owned.hasOwnProperty(item.id);
      div.innerHTML = `
        <img src="${item.img}">
        <div style="flex:1"><strong>${item.name}</strong><br>${bought ? '✅' : '💰 '+item.price}</div>
        <button ${bought ? 'disabled' : ''}>купить</button>
      `;
      const btn = div.querySelector('button');
      if (!bought) {
        btn.onclick = () => {
          if (score >= item.price) {
            score -= item.price;
            owned[item.id] = item.img;
            addItemToWorld(item.id, item.img);
            updateStats();
            renderShop(document.getElementById('shopDesktop'));
            renderShop(document.getElementById('shopMobile'));
          }
        };
      }
      container.appendChild(div);
    });
  }

  // Добавление предмета в мир
  function addItemToWorld(id, imgSrc) {
    if (isMobile) {
      const content = document.getElementById('illuminator-content');
      if (!content) return;
      const img = document.createElement('img');
      img.src = imgSrc;
      img.className = 'illuminator-item';
      img.dataset.id = id;

      // ---- ИЗМЕНЕНО: появление по центру текущего видимого окна ----
      const viewport = document.getElementById('illuminator-viewport');
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      // центр viewport в экранных координатах
      const screenCenterX = vpW / 2;
      const screenCenterY = vpH / 2;
      // текущие параметры трансформации (берём из глобальных переменных, которые обновляются в touch-событиях)
      const scale = window.currentScale !== undefined ? window.currentScale : 1;
      const transX = window.currentTranslateX !== undefined ? window.currentTranslateX : 0;
      const transY = window.currentTranslateY !== undefined ? window.currentTranslateY : 0;
      // переводим в координаты контента
      const contentX = (screenCenterX - transX) / scale - 32; // 32 = половина ширины предмета
      const contentY = (screenCenterY - transY) / scale - 32;

      let x = contentX, y = contentY;
      // если координаты уже сохранены ранее, используем их (приоритет сохранённых)
      if (mobItemPos[id]) {
        x = mobItemPos[id].x;
        y = mobItemPos[id].y;
      } else {
        mobItemPos[id] = { x, y };
      }
      // ограничивать не будем, пусть ставится ровно по центру даже за краем
      img.style.left = x + 'px';
      img.style.top = y + 'px';
      makeDraggableInIlluminator(img, id);
      content.appendChild(img);
    } else {
      const bg = document.getElementById('bgPcItems');
      const img = document.createElement('img');
      img.src = imgSrc;
      img.className = 'bg-item';
      img.dataset.id = id;
      let x = 100, y = 100;
      if (pcItemPos[id]) {
        x = pcItemPos[id].x;
        y = pcItemPos[id].y;
      } else {
        x = Math.random() * (window.innerWidth - 100);
        y = Math.random() * (window.innerHeight - 100);
        pcItemPos[id] = { x, y };
      }
      img.style.left = x + 'px';
      img.style.top = y + 'px';
      makeDraggableOnPc(img, id);
      bg.appendChild(img);
    }
  }

  // Перетаскивание на ПК (мышь)
  function makeDraggableOnPc(el, id) {
    let dx, dy;
    el.onmousedown = (e) => {
      e.preventDefault();
      dx = e.clientX - el.offsetLeft;
      dy = e.clientY - el.offsetTop;
      document.onmousemove = (m) => {
        el.style.left = (m.clientX - dx) + 'px';
        el.style.top = (m.clientY - dy) + 'px';
        pcItemPos[id] = { x: m.clientX - dx, y: m.clientY - dy };
      };
      document.onmouseup = () => { document.onmousemove = null; };
    };
  }

  // Перетаскивание внутри иллюминатора (мышь + touch)
  function makeDraggableInIlluminator(el, id) {
    let startX, startY, startLeft, startTop;
    const content = document.getElementById('illuminator-content');

    function dragStart(clientX, clientY) {
      startLeft = parseFloat(el.style.left) || 0;
      startTop = parseFloat(el.style.top) || 0;
      startX = clientX;
      startY = clientY;
    }

    function dragMove(clientX, clientY) {
      const scale = window.currentScale !== undefined ? window.currentScale : 1;
      const dx = (clientX - startX) / scale;
      const dy = (clientY - startY) / scale;
      let newX = startLeft + dx;
      let newY = startTop + dy;
      // границы
      newX = Math.max(0, Math.min(content.clientWidth - el.clientWidth, newX));
      newY = Math.max(0, Math.min(content.clientHeight - el.clientHeight, newY));
      el.style.left = newX + 'px';
      el.style.top = newY + 'px';
      mobItemPos[id] = { x: newX, y: newY };
    }

    // мышь
    el.onmousedown = (e) => {
      e.preventDefault();
      dragStart(e.clientX, e.clientY);
      document.onmousemove = (m) => { dragMove(m.clientX, m.clientY); };
      document.onmouseup = () => { document.onmousemove = null; };
    };

    // touch
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      dragStart(touch.clientX, touch.clientY);
    }, { passive: false });

    el.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      dragMove(touch.clientX, touch.clientY);
    }, { passive: false });

    el.addEventListener('touchend', (e) => {
      e.preventDefault();
      // ничего не делаем
    });
  }

  // --------------------------------------------------------------
  // 7. ЗУМ/ПАН для иллюминатора
  // --------------------------------------------------------------
  const viewport = document.getElementById('illuminator-viewport');
  const content = document.getElementById('illuminator-content');
  if (viewport && content) {
    let scale = 1, translateX = 0, translateY = 0;
    let startDistance = 0, startScale = 1;
    let startPan = { x: 0, y: 0 };

    viewport.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        startDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        startScale = scale;
      } else if (e.touches.length === 1) {
        startPan = { x: e.touches[0].clientX - translateX, y: e.touches[0].clientY - translateY };
      }
    });

    viewport.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        scale = Math.min(3, Math.max(0.8, startScale * (dist / startDistance)));
        applyTransform();
      } else if (e.touches.length === 1) {
        translateX = e.touches[0].clientX - startPan.x;
        translateY = e.touches[0].clientY - startPan.y;
        applyTransform();
      }
    });

    function applyTransform() {
      content.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      // передаём параметры в звёздный канвас
      if (window.illuminatorTransform) {
        window.illuminatorTransform.set(scale, translateX, translateY);
      }
      // также запоминаем для перетаскивания и появления новых предметов
      window.currentScale = scale;
      window.currentTranslateX = translateX;
      window.currentTranslateY = translateY;
    }

    // инициализация
    window.currentScale = 1;
    window.currentTranslateX = 0;
    window.currentTranslateY = 0;
  }

  // --------------------------------------------------------------
  // 8. Всплывающее число при клике
  // --------------------------------------------------------------
  function showFloatingNumber(x, y, value) {
    const div = document.createElement('div');
    div.className = 'floating-number';
    div.textContent = `+${value}`;
    div.style.left = (x - 20) + 'px';
    div.style.top = (y - 20) + 'px';
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
  }

  // --------------------------------------------------------------
  // 9. Обработчики кликов, авто, кнопки
  // --------------------------------------------------------------
  document.getElementById('click').onclick = (e) => {
    ac.resume();
    clickSound();
    score += power;
    updateStats();
    showFloatingNumber(e.clientX, e.clientY, power);
  };

  document.getElementById('upgrade').onclick = () => {
    if (score >= upPrice) {
      score -= upPrice;
      power *= 2;
      upPrice = Math.floor(upPrice * 2.6);
      updateStats();
    }
  };
  document.getElementById('autoUp').onclick = () => {
    if (score >= autoPrice) {
      score -= autoPrice;
      auto++;
      autoPrice = Math.floor(autoPrice * 2.4);
      updateStats();
    }
  };
  setInterval(() => {
    if (auto > 0) {
      score += power * auto;
      updateStats();
    }
  }, 1000);

  // сохранение / загрузка
  document.getElementById('saveBtn').onclick = () => {
    localStorage.setItem('clickerData', JSON.stringify({
      score, power, auto, upPrice, autoPrice, owned,
      pcPos: pcItemPos, mobPos: mobItemPos
    }));
    alert('сохранено');
  };
  document.getElementById('loadBtn').onclick = () => {
    const d = JSON.parse(localStorage.getItem('clickerData') || 'null');
    if (!d) return alert('нет сохранения');
    score = d.score; power = d.power; auto = d.auto; upPrice = d.upPrice; autoPrice = d.autoPrice;
    owned = d.owned || {};
    pcItemPos = d.pcPos || {};
    mobItemPos = d.mobPos || {};
    updateStats();
    // перестроить предметы
    if (isMobile) {
      document.getElementById('illuminator-content').innerHTML = ''; // канвас уже есть отдельно
    } else {
      document.getElementById('bgPcItems').innerHTML = '';
    }
    Object.keys(owned).forEach(id => addItemToWorld(id, owned[id]));
    renderShop(document.getElementById('shopDesktop'));
    renderShop(document.getElementById('shopMobile'));
  };
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('сброс?')) {
      score=0; power=1; auto=0; upPrice=100; autoPrice=500; owned={}; pcItemPos={}; mobItemPos={};
      updateStats();
      if (isMobile) {
        document.getElementById('illuminator-content').innerHTML = '';
      } else {
        document.getElementById('bgPcItems').innerHTML = '';
      }
      renderShop(document.getElementById('shopDesktop'));
      renderShop(document.getElementById('shopMobile'));
    }
  };

  // --------------------------------------------------------------
  // 10. Музыкальные кнопки
  // --------------------------------------------------------------
  function createMusicButtons() {
    const containerPc = document.getElementById('musicDesktop');
    const containerMob = document.getElementById('musicMobile');
    const labels = ['☀️ Мелодия 1','🌙 Мелодия 2','🌀 Мелодия 3','📡 Мелодия 4','🎹 Мелодия 5',
                    '🔮 Мелодия 6','⚡ Мелодия 7','🌌 Мелодия 8','🚀 Мелодия 9','🌟 ИНТЕРСТЕЛЛАР','🔇 Выкл.'];
    for (let i = 0; i <= 10; i++) {
      const idx = i === 10 ? 0 : i+1;
      const btnPc = document.createElement('button');
      btnPc.textContent = labels[i] || '🎵';
      btnPc.onclick = () => { ac.resume(); changeMelody(idx); };
      containerPc.appendChild(btnPc);

      const btnMob = document.createElement('button');
      btnMob.textContent = labels[i] || '🎵';
      btnMob.onclick = () => { ac.resume(); changeMelody(idx); };
      containerMob.appendChild(btnMob);
    }
  }
  createMusicButtons();

  // --------------------------------------------------------------
  // 11. Панели открыть/закрыть
  // --------------------------------------------------------------
  document.getElementById('toggleShopDesktop').onclick = () => {
    document.getElementById('shopDesktop').classList.toggle('open');
  };
  document.getElementById('toggleMusicDesktop').onclick = () => {
    document.getElementById('musicDesktop').classList.toggle('open');
  };
  document.getElementById('mobileShopBtn').onclick = () => {
    document.getElementById('mobileShopPanel').classList.toggle('open');
    document.getElementById('mobileMusicPanel').classList.remove('open');
    document.getElementById('mobileIlluminatorPanel').classList.remove('open');
  };
  document.getElementById('mobileMusicBtn').onclick = () => {
    document.getElementById('mobileMusicPanel').classList.toggle('open');
    document.getElementById('mobileShopPanel').classList.remove('open');
    document.getElementById('mobileIlluminatorPanel').classList.remove('open');
  };
  document.getElementById('mobileIlluminatorBtn').onclick = () => {
    document.getElementById('mobileIlluminatorPanel').classList.toggle('open');
    document.getElementById('mobileShopPanel').classList.remove('open');
    document.getElementById('mobileMusicPanel').classList.remove('open');
  };

  // инициализация магазинов
  renderShop(document.getElementById('shopDesktop'));
  renderShop(document.getElementById('shopMobile'));

  // небольшой хак: обновим размер канваса иллюминатора при ресайзе
  window.addEventListener('resize', () => {
    if (illCanvas && viewport) {
      illCanvas.width = viewport.clientWidth;
      illCanvas.height = viewport.clientHeight;
    }
  });
  if (illCanvas && viewport) {
    illCanvas.width = viewport.clientWidth;
    illCanvas.height = viewport.clientHeight;
  }
})();
</script>
