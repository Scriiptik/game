<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advanced Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui,sans-serif;
  background:#050b14;
  color:white;
}

/* ===== ЗВЁЗДЫ ===== */
#stars{
  position:fixed;
  inset:0;
  z-index:0;
}

/* ===== UI ===== */
.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  border-radius:20px;
}

.game{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:360px;
  padding:20px;
  z-index:3;
}

.shop-panel{
  position:absolute;
  top:15px;
  left:15px;
  z-index:4;
}

.shop{
  margin-top:8px;
  max-height:0;
  overflow:auto;
  transition:.4s;
  width:260px;
}
.shop.open{max-height:500px}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.item img{width:36px}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.15);
  color:white;
  cursor:pointer;
  transition:.1s;
}
button:active{
  transform:scale(.94);
  box-shadow:0 0 15px rgba(0,255,213,.8);
}
button:disabled{
  opacity:0.3;
  pointer-events:none;
}

.click-btn{
  width:160px;height:160px;
  border-radius:50%;
  background:radial-gradient(circle,#00ffd5,#00b3a4);
  box-shadow:0 0 40px rgba(0,255,213,.7);
  font-size:22px;
}

/* ===== ФОН-ПРЕДМЕТЫ ===== */
.bg-items{
  position:absolute;
  inset:0;
  z-index:2;
}
.bg-item{
  position:absolute;
  width:60px;
  animation:float 6s ease-in-out infinite, spin 30s linear infinite;
  cursor:grab;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
@keyframes spin{
  from{rotate:0deg}
  to{rotate:360deg}
}

/* ===== ЧАСТИЦЫ ===== */
.particle{
  position:absolute;
  color:#00ffd5;
  pointer-events:none;
  animation:part 1s forwards;
}
@keyframes part{
  to{opacity:0;transform:translateY(-60px)}
}

.controls{
  display:flex;
  gap:5px;
  margin-top:10px;
}
.controls button{
  margin:0;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="bg-items" id="bg"></div>

<div class="shop-panel glass">
  <button id="toggleShop">🛒 Магазин</button>
  <div class="shop glass" id="shop"></div>
</div>

<div class="game glass">
  <h2>⚡ Advanced Clicker</h2>
  <div>Очки: <span id="score">0</span></div>
  <div>Сила клика: ×<span id="power">1</span></div>
  <div>Автокликер: <span id="auto">0</span></div>

  <button class="click-btn" id="click">КЛИК</button>
  <button id="upgrade">🔥 Усилить ×2 (<span id="upPrice">100</span>)</button>
  <button id="autoUp">🤖 Автоклик (<span id="autoPrice">500</span>)</button>

  <div class="controls">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
    <button id="resetBtn">🔄 Сброс</button>
  </div>
</div>

<script>
/* ===== ЗВЁЗДЫ ===== */
const c=document.getElementById("stars"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;
const stars=[...Array(15000)].map(()=>({
x:Math.random()*c.width,
y:Math.random()*c.height,
s:Math.random()*1.5
}));
function draw(){
ctx.clearRect(0,0,c.width,c.height);
ctx.fillStyle="white";
stars.forEach(st=>{
ctx.globalAlpha=Math.random();
ctx.fillRect(st.x,st.y,st.s,st.s);
st.y+=st.s*.3;
if(st.y>c.height)st.y=0;
});
requestAnimationFrame(draw);
}
draw();

/* ===== ЗВУКИ (Web Audio) ===== */
const ac=new AudioContext();
let musicInterval = null;

// Приятный звук клика
function clickSound(){
  const now = ac.currentTime;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'sine';
  osc.frequency.value = 660; // нота ми
  gain.gain.setValueAtTime(0.1, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.connect(gain).connect(ac.destination);
  osc.start(now);
  osc.stop(now + 0.15);
}

// Фоновая музыка (зацикленный аккорд C‑dur)
function startBackgroundMusic() {
  if (musicInterval) return;
  musicInterval = setInterval(() => {
    const now = ac.currentTime;
    // Аккорд: до, ми, соль
    [261.63, 329.63, 392.0].forEach(freq => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.02, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 1.5);
    });
  }, 3000); // каждые 3 секунды
}

// Музыка стартует после первого клика
let musicStarted = false;
function tryStartMusic() {
  if (!musicStarted) {
    ac.resume();
    startBackgroundMusic();
    musicStarted = true;
  }
}

/* ===== ИГРА ===== */
// Начальные значения (без автозагрузки)
let score = 0;
let power = 1;
let auto = 0;
let upPrice = 100;
let autoPrice = 500;
let owned = {};      // { itemId: imgUrl }
let pos = {};        // { itemId: {x, y} }

// Элементы интерфейса
const scoreEl = document.getElementById('score');
const powerEl = document.getElementById('power');
const autoEl = document.getElementById('auto');
const upPriceSpan = document.getElementById('upPrice');
const autoPriceSpan = document.getElementById('autoPrice');

const bg = document.getElementById('bg');
const shop = document.getElementById('shop');

// Генерация предметов (50 шт) с названиями
const items = [...Array(50)].map((_, i) => ({
  id: 'item' + i,
  name: `Реликвия ${i+1}`,          // простые уникальные названия
  price: Math.floor(800 * Math.pow(1.25, i)),
  img: `https://picsum.photos/seed/${i}/64`
}));

// Функция обновления интерфейса
function update() {
  scoreEl.textContent = Math.floor(score);
  powerEl.textContent = power;
  autoEl.textContent = auto;
  upPriceSpan.textContent = upPrice;
  autoPriceSpan.textContent = autoPrice;
}
update();

// Сохранение в localStorage
function saveGame() {
  localStorage.setItem('clicker_score', score);
  localStorage.setItem('clicker_power', power);
  localStorage.setItem('clicker_auto', auto);
  localStorage.setItem('clicker_upPrice', upPrice);
  localStorage.setItem('clicker_autoPrice', autoPrice);
  localStorage.setItem('clicker_owned', JSON.stringify(owned));
  localStorage.setItem('clicker_pos', JSON.stringify(pos));
  alert('Прогресс сохранён!');
}

// Загрузка из localStorage
function loadGame() {
  const s = localStorage.getItem('clicker_score');
  if (s === null) {
    alert('Нет сохранённой игры');
    return;
  }
  score = Number(s);
  power = Number(localStorage.getItem('clicker_power')) || 1;
  auto = Number(localStorage.getItem('clicker_auto')) || 0;
  upPrice = Number(localStorage.getItem('clicker_upPrice')) || 100;
  autoPrice = Number(localStorage.getItem('clicker_autoPrice')) || 500;
  owned = JSON.parse(localStorage.getItem('clicker_owned')) || {};
  pos = JSON.parse(localStorage.getItem('clicker_pos')) || {};

  // Перестроить фон
  bg.innerHTML = '';
  Object.keys(owned).forEach(id => addBgItem(id, owned[id]));

  update();
  renderShop(); // обновить состояние кнопок в магазине
  alert('Прогресс загружен!');
}

// Сброс к начальным значениям
function resetGame() {
  if (confirm('Сбросить весь прогресс?')) {
    score = 0;
    power = 1;
    auto = 0;
    upPrice = 100;
    autoPrice = 500;
    owned = {};
    pos = {};
    bg.innerHTML = '';
    update();
    renderShop();
  }
}

/* ===== ДОБАВЛЕНИЕ ПРЕДМЕТА НА ФОН ===== */
function addBgItem(id, imgSrc) {
  const el = document.createElement('img');
  el.src = imgSrc;
  el.className = 'bg-item';
  el.style.left = (pos[id]?.x || Math.random() * innerWidth) + 'px';
  el.style.top = (pos[id]?.y || Math.random() * innerHeight) + 'px';
  makeDraggable(el, id);
  bg.appendChild(el);
}

// Перетаскивание (обновляет pos, но не сохраняет автоматически)
function makeDraggable(el, id) {
  let dx, dy;
  el.onmousedown = e => {
    e.preventDefault();
    dx = e.clientX - el.offsetLeft;
    dy = e.clientY - el.offsetTop;
    document.onmousemove = m => {
      el.style.left = (m.clientX - dx) + 'px';
      el.style.top = (m.clientY - dy) + 'px';
      pos[id] = { x: m.clientX - dx, y: m.clientY - dy };
    };
    document.onmouseup = () => {
      document.onmousemove = null;
      document.onmouseup = null;
    };
  };
}

/* ===== МАГАЗИН ===== */
function renderShop() {
  shop.innerHTML = '';
  items.forEach(item => {
    const d = document.createElement('div');
    d.className = 'item';
    const bought = owned.hasOwnProperty(item.id);
    d.innerHTML = `
      <img src="${item.img}">
      <div style="flex:1">
        <strong>${item.name}</strong><br>
        ${bought ? '✅ Куплено' : '💰 ' + item.price}
      </div>
      <button ${bought ? 'disabled' : ''}>Купить</button>
    `;
    const btn = d.querySelector('button');
    if (!bought) {
      btn.onclick = () => {
        if (score >= item.price) {
          score -= item.price;
          owned[item.id] = item.img;
          // Добавляем на фон
          addBgItem(item.id, item.img);
          update();
          renderShop(); // обновить магазин (кнопка станет disabled)
        }
      };
    }
    shop.appendChild(d);
  });
}
renderShop();

/* ===== КЛИКЕР ===== */
document.getElementById('click').onclick = e => {
  tryStartMusic(); // запустить фоновую музыку при первом клике
  ac.resume();     // на всякий случай
  clickSound();

  score += power;
  spawn(e.clientX, e.clientY, '+' + power);
  update();
};

// Улучшение силы клика
document.getElementById('upgrade').onclick = () => {
  if (score >= upPrice) {
    score -= upPrice;
    power *= 2;
    upPrice = Math.floor(upPrice * 2.6);
    update();
  }
};

// Автокликер
document.getElementById('autoUp').onclick = () => {
  if (score >= autoPrice) {
    score -= autoPrice;
    auto++;
    autoPrice = Math.floor(autoPrice * 2.4);
    update();
  }
};

// Автоматический сбор автокликера
setInterval(() => {
  if (auto > 0) {
    score += power * auto;
    update();
  }
}, 1000);

// Частицы при клике
function spawn(x, y, text) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = text;
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}

// Кнопки сохранения/загрузки/сброса
document.getElementById('saveBtn').onclick = saveGame;
document.getElementById('loadBtn').onclick = loadGame;
document.getElementById('resetBtn').onclick = resetGame;

// Открытие/закрытие магазина
document.getElementById('toggleShop').onclick = () => shop.classList.toggle('open');

// Инициализация пустого фона (без автозагрузки)
// (ничего не загружаем, всё уже в начальных значениях)
</script>
</body>
</html>
