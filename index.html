<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎮 НЕОН-АРКАДА · все игры + жестовый Paint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <style>
    body {
      background: linear-gradient(145deg, #0a0f1e 0%, #1a1f33 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .glass {
      background: rgba(20, 30, 50, 0.3);
      backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(100, 220, 255, 0.25);
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0, 255, 200, 0.3);
    }
    .neon-text {
      text-shadow: 0 0 5px #00ffff, 0 0 15px #00ccff, 0 0 30px #0066ff;
    }
    .game-card {
      transition: transform 0.2s ease, box-shadow 0.2s;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 1.5rem;
      cursor: pointer;
    }
    .game-card:hover {
      transform: scale(1.05) translateY(-6px);
      box-shadow: 0 0 25px #00ffe1, 0 10px 25px -5px black;
    }
    .back-btn {
      background: rgba(0,0,0,0.5);
      border: 1px solid cyan;
      border-radius: 3rem;
      padding: 0.6rem 1.5rem;
      color: white;
      backdrop-filter: blur(8px);
      transition: 0.2s;
    }
    .back-btn:hover {
      background: cyan;
      color: black;
      box-shadow: 0 0 20px cyan;
    }
    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 60vh;
    }
    .instructions {
      background: rgba(0,0,0,0.5);
      border-left: 4px solid cyan;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #aaf0ff;
      max-width: 600px;
    }
    .paint-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4/3;
    }
    .paint-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1.5rem;
      transform: scaleX(-1);
    }
    .paint-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 1.5rem;
      pointer-events: none;
    }
    #drawCanvas {
      z-index: 2;
      background-color: transparent;
    }
    #skeletonCanvas {
      z-index: 3;
      background-color: transparent;
    }
    .color-palette {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 40px;
      backdrop-filter: blur(5px);
      border: 1px solid cyan;
      z-index: 4;
    }
    .color-swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid white;
      transition: 0.1s;
      cursor: pointer;
      box-shadow: 0 0 8px currentColor;
    }
    .color-swatch.active {
      transform: scale(1.2);
      border-color: cyan;
      box-shadow: 0 0 20px cyan;
    }
    .tool-indicator {
      background: rgba(0,0,0,0.6);
      padding: 6px 20px;
      border-radius: 40px;
      border: 1px solid cyan;
      color: white;
      font-size: 1.2rem;
    }
    .mobile-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .mobile-btn {
      background: rgba(0,255,200,0.2);
      border: 1px solid cyan;
      border-radius: 2rem;
      padding: 0.75rem 1.5rem;
      font-size: 1.5rem;
      min-width: 70px;
    }
  </style>
</head>
<body class="text-white p-2 md:p-4">

<div id="app" class="max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-4xl md:text-5xl font-bold neon-text bg-gradient-to-r from-cyan-300 to-purple-300 bg-clip-text text-transparent">🎮 НЕОН-АРКАДА</h1>
    <span class="glass px-4 py-2 text-xl"><i class="fas fa-crown text-yellow-300 mr-2"></i>31 игра</span>
  </div>

  <div id="menu-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 opacity-0"></div>

  <div id="game-view" class="hidden glass p-3 md:p-6">
    <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
      <button id="back-to-menu" class="back-btn text-sm md:text-base"><i class="fas fa-arrow-left mr-2"></i>Меню</button>
      <h2 id="game-title" class="text-2xl md:text-3xl neon-text"></h2>
      <div class="w-16"></div>
    </div>
    <div id="game-canvas-container" class="game-area"></div>
  </div>
</div>

<script>
(function() {
  const gamesList = [
    "Крестики-нолики", "Змейка", "Тетрис", "Сапёр", "2048", "Пинг-понг", "Виселица", "Угадай число",
    "Камень-ножницы-бумага", "Флиппер", "Мемори", "Пасьянс (упрощ.)", "Гонки", "Flappy Bird", "Шахматы (пешки)", "Шашки (упрощ.)",
    "Судоку (лёгкое)", "Зума (демо)", "Тир", "Jump Game", "Лабиринт", "Саймон говорит", "Слова из слов", "Викторина",
    "Кости", "Рулетка", "Угадай мелодию", "Пятнашки", "Арканоид", "Match-3 (упрощ.)", "🎨 ЖЕСТОВЫЙ PAINT"
  ];

  const menuContainer = document.getElementById('menu-container');
  const gameView = document.getElementById('game-view');
  const gameTitle = document.getElementById('game-title');
  const gameCanvasContainer = document.getElementById('game-canvas-container');
  const backBtn = document.getElementById('back-to-menu');

  let currentGameIndex = -1;
  const gameInstances = new Array(31).fill(null);

  function addInstructions(container, text) {
    const instr = document.createElement('div');
    instr.className = 'instructions';
    instr.innerHTML = `<i class="fas fa-info-circle mr-2 text-cyan-300"></i>${text}`;
    container.appendChild(instr);
  }

  function addMobileControls(container, onDirection, onAction) {
    const div = document.createElement('div');
    div.className = 'mobile-controls';
    div.innerHTML = `
      <button class="mobile-btn up"><i class="fas fa-arrow-up"></i></button>
      <button class="mobile-btn down"><i class="fas fa-arrow-down"></i></button>
      <button class="mobile-btn left"><i class="fas fa-arrow-left"></i></button>
      <button class="mobile-btn right"><i class="fas fa-arrow-right"></i></button>
      <button class="mobile-btn action">⏎</button>
    `;
    div.querySelector('.up').onclick = () => onDirection?.('up');
    div.querySelector('.down').onclick = () => onDirection?.('down');
    div.querySelector('.left').onclick = () => onDirection?.('left');
    div.querySelector('.right').onclick = () => onDirection?.('right');
    div.querySelector('.action').onclick = () => onAction?.();
    container.appendChild(div);
  }

  // ====================== ЖЕСТОВЫЙ PAINT (индекс 30) ======================
  function runGesturePaint(container) {
    addInstructions(container, '🎨 Жесты: указательный палец — кисть; раскрытая ладонь — ластик; наведите палец на цвет и сделайте пинч (соедините с большим) для выбора.');

    const mainDiv = document.createElement('div');
    mainDiv.className = 'relative w-full max-w-4xl mx-auto';

    const paintContainer = document.createElement('div');
    paintContainer.className = 'paint-container';

    const video = document.createElement('video');
    video.setAttribute('autoplay', true);
    video.setAttribute('playsinline', true);

    const drawCanvas = document.createElement('canvas');
    drawCanvas.id = 'drawCanvas';
    const skeletonCanvas = document.createElement('canvas');
    skeletonCanvas.id = 'skeletonCanvas';

    paintContainer.appendChild(video);
    paintContainer.appendChild(drawCanvas);
    paintContainer.appendChild(skeletonCanvas);
    mainDiv.appendChild(paintContainer);

    const paletteDiv = document.createElement('div');
    paletteDiv.className = 'color-palette';
    const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#ffffff', '#000000'];
    let currentColor = '#ff4444';
    const swatches = [];
    colors.forEach((c, i) => {
      const swatch = document.createElement('div');
      swatch.className = `color-swatch ${c === currentColor ? 'active' : ''}`;
      swatch.style.backgroundColor = c;
      swatch.dataset.color = c;
      swatch.onclick = () => {
        currentColor = c;
        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        document.getElementById('selected-color-show').innerText = c;
      };
      paletteDiv.appendChild(swatch);
      swatches.push(swatch);
    });
    mainDiv.appendChild(paletteDiv);

    const statusBar = document.createElement('div');
    statusBar.className = 'flex justify-between items-center w-full mt-2';
    statusBar.innerHTML = `
      <div class="tool-indicator" id="tool-indicator"><i class="fas fa-paint-brush mr-2"></i>Кисть</div>
      <div class="text-xl"><span id="selected-color-show">#ff4444</span> <i class="fas fa-palette ml-2"></i></div>
    `;
    mainDiv.appendChild(statusBar);

    const btnDiv = document.createElement('div');
    btnDiv.className = 'flex gap-4 mt-4';
    const clearBtn = document.createElement('button');
    clearBtn.className = 'back-btn';
    clearBtn.innerHTML = '<i class="fas fa-trash mr-2"></i>Очистить';
    clearBtn.onclick = () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    };
    const saveBtn = document.createElement('button');
    saveBtn.className = 'back-btn';
    saveBtn.innerHTML = '<i class="fas fa-download mr-2"></i>Сохранить';
    saveBtn.onclick = () => {
      const a = document.createElement('a');
      a.download = 'paint.png';
      a.href = drawCanvas.toDataURL();
      a.click();
    };
    btnDiv.appendChild(clearBtn); btnDiv.appendChild(saveBtn);
    mainDiv.appendChild(btnDiv);

    container.appendChild(mainDiv);

    const drawCtx = drawCanvas.getContext('2d');
    const skeletonCtx = skeletonCanvas.getContext('2d');
    drawCtx.lineWidth = 8;
    drawCtx.lineCap = 'round';
    drawCtx.strokeStyle = currentColor;

    video.addEventListener('loadeddata', () => {
      const w = video.videoWidth;
      const h = video.videoHeight;
      drawCanvas.width = w;
      drawCanvas.height = h;
      skeletonCanvas.width = w;
      skeletonCanvas.height = h;
    });

    const hands = new Hands({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    let lastX = null, lastY = null;
    let currentTool = 'brush';

    function getSwatchAreas() {
      const w = drawCanvas.width;
      const h = drawCanvas.height;
      const paletteY = h - 60;
      const swatchSize = 40;
      const totalWidth = colors.length * (swatchSize + 8) - 8;
      const startX = (w - totalWidth) / 2;
      return colors.map((c, i) => ({
        color: c,
        x: startX + i * (swatchSize + 8),
        y: paletteY,
        size: swatchSize
      }));
    }

    hands.onResults(results => {
      if (!results.multiHandLandmarks?.length) {
        lastX = lastY = null;
        skeletonCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const w = drawCanvas.width;
      const h = drawCanvas.height;
      if (w === 0 || h === 0) return;

      const convertX = x => (1 - x) * w;
      const convertY = y => y * h;

      const indexTip = convertX(landmarks[8].x);
      const indexTipY = convertY(landmarks[8].y);
      const thumbTip = convertX(landmarks[4].x);
      const thumbTipY = convertY(landmarks[4].y);
      const palmX = convertX(landmarks[0].x);
      const palmY = convertY(landmarks[0].y);

      const indexMcpY = convertY(landmarks[5].y);
      const indexExtended = indexTipY < indexMcpY - 20;

      const middleTipY = convertY(landmarks[12].y);
      const middleMcpY = convertY(landmarks[9].y);
      const middleExtended = middleTipY < middleMcpY - 20;

      const ringTipY = convertY(landmarks[16].y);
      const ringMcpY = convertY(landmarks[13].y);
      const ringExtended = ringTipY < ringMcpY - 20;

      const pinkyTipY = convertY(landmarks[20].y);
      const pinkyMcpY = convertY(landmarks[17].y);
      const pinkyExtended = pinkyTipY < pinkyMcpY - 20;

      const isPalmOpen = indexExtended && middleExtended && ringExtended && pinkyExtended;

      const pinchDist = Math.hypot(indexTip - thumbTip, indexTipY - thumbTipY);
      const isPinch = pinchDist < 30;

      const areas = getSwatchAreas();
      let hoveredColor = null;
      for (let area of areas) {
        if (indexTip >= area.x && indexTip <= area.x + area.size &&
            indexTipY >= area.y && indexTipY <= area.y + area.size) {
          hoveredColor = area.color;
          break;
        }
      }

      if (isPinch && hoveredColor) {
        currentColor = hoveredColor;
        swatches.forEach(sw => {
          if (sw.dataset.color === currentColor) sw.classList.add('active');
          else sw.classList.remove('active');
        });
        document.getElementById('selected-color-show').innerText = currentColor;
      }

      if (isPalmOpen) {
        currentTool = 'eraser';
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.lineWidth = 40;
      } else {
        currentTool = 'brush';
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.lineWidth = 10;
        drawCtx.strokeStyle = currentColor;
      }
      document.getElementById('tool-indicator').innerHTML = currentTool === 'eraser' ?
        '<i class="fas fa-eraser mr-2"></i>Ластик' : '<i class="fas fa-paint-brush mr-2"></i>Кисть';

      let drawX, drawY;
      if (currentTool === 'eraser') {
        drawX = palmX;
        drawY = palmY;
      } else {
        drawX = indexTip;
        drawY = indexTipY;
      }

      if (lastX && lastY && !isPinch) {
        drawCtx.beginPath();
        drawCtx.moveTo(lastX, lastY);
        drawCtx.lineTo(drawX, drawY);
        drawCtx.stroke();
      }
      lastX = drawX;
      lastY = drawY;

      // Отрисовка скелета
      skeletonCtx.clearRect(0, 0, w, h);
      const connections = [
        [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12], [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20], [5,9],[9,13],[13,17]
      ];

      skeletonCtx.beginPath();
      for (let [a, b] of connections) {
        const ax = convertX(landmarks[a].x);
        const ay = convertY(landmarks[a].y);
        const bx = convertX(landmarks[b].x);
        const by = convertY(landmarks[b].y);
        skeletonCtx.moveTo(ax, ay);
        skeletonCtx.lineTo(bx, by);
      }
      skeletonCtx.strokeStyle = 'rgba(0,255,255,0.6)';
      skeletonCtx.lineWidth = 3;
      skeletonCtx.stroke();

      for (let i = 0; i < landmarks.length; i++) {
        const x = convertX(landmarks[i].x);
        const y = convertY(landmarks[i].y);
        skeletonCtx.beginPath();
        skeletonCtx.arc(x, y, 4, 0, 2 * Math.PI);
        skeletonCtx.fillStyle = i === 8 ? '#ff0' : '#0ff';
        skeletonCtx.fill();
      }

      if (hoveredColor) {
        const area = areas.find(a => a.color === hoveredColor);
        if (area) {
          skeletonCtx.strokeStyle = 'white';
          skeletonCtx.lineWidth = 4;
          skeletonCtx.strokeRect(area.x, area.y, area.size, area.size);
        }
      }
    });

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640, height: 480
    });
    camera.start().catch(e => alert('Ошибка камеры: ' + e.message));

    return () => { camera.stop(); hands.close(); };
  }

  // ====================== ОСТАЛЬНЫЕ ИГРЫ (полноценные, из предыдущего ответа) ======================
  const gameRunners = [
    // 0 Крестики-нолики
    (container) => {
      addInstructions(container, 'Играйте за X. Компьютер ходит O. Нажмите на клетку.');
      let board = ['', '', '', '', '', '', '', '', ''];
      let turn = 'X';
      const div = document.createElement('div');
      div.className = 'grid grid-cols-3 gap-2 w-64 h-64';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'glass flex items-center justify-center text-4xl font-bold cursor-pointer hover:bg-cyan-500/30';
        cell.dataset.index = i;
        cell.onclick = () => {
          if (board[i] === '' && turn === 'X') {
            board[i] = 'X'; cell.innerText = 'X'; turn = 'O';
            setTimeout(() => {
              const empty = board.reduce((a, v, idx) => v === '' ? [...a, idx] : a, []);
              if (empty.length && turn === 'O') {
                const idx = empty[Math.floor(Math.random() * empty.length)];
                board[idx] = 'O'; div.children[idx].innerText = 'O'; turn = 'X';
              }
            }, 200);
          }
        };
        div.appendChild(cell);
      }
      container.appendChild(div);
      return () => {};
    },
    // 1 Змейка
    (container) => {
      addInstructions(container, 'Управляйте стрелками или кнопками. Съешьте красное, чтобы вырасти. Не врезайтесь в стены и себя.');
      const canvas = document.createElement('canvas');
      canvas.width = 300; canvas.height = 300;
      canvas.className = 'glass w-full max-w-[400px] aspect-square';
      const ctx = canvas.getContext('2d');
      container.appendChild(canvas);
      let snake = [{x:10, y:10}], food = {x:5, y:5}, dir = 'right', gameOver = false, score = 0;
      const scoreDiv = document.createElement('div');
      scoreDiv.className = 'text-cyan-300 mt-2 text-xl'; scoreDiv.innerText = 'Счёт: 0';
      container.appendChild(scoreDiv);

      function randomFood() {
        do { food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)}; } while (snake.some(s => s.x === food.x && s.y === food.y));
      }

      function update() {
        if (gameOver) return;
        let newHead = {...snake[0]};
        if (dir === 'right') newHead.x++; else if (dir === 'left') newHead.x--; else if (dir === 'up') newHead.y--; else if (dir === 'down') newHead.y++;
        if (newHead.x < 0 || newHead.x >= 15 || newHead.y < 0 || newHead.y >= 15 || snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
          gameOver = true; alert('Игра окончена! Счёт: ' + score); return;
        }
        snake.unshift(newHead);
        if (newHead.x === food.x && newHead.y === food.y) {
          score++; scoreDiv.innerText = 'Счёт: ' + score; randomFood();
        } else snake.pop();
      }

      function draw() {
        ctx.clearRect(0,0,300,300); ctx.fillStyle = '#0a0f1e'; ctx.fillRect(0,0,300,300);
        snake.forEach(s => { ctx.fillStyle = '#00ffc3'; ctx.fillRect(s.x*20, s.y*20, 18, 18); });
        ctx.fillStyle = '#ff44aa'; ctx.fillRect(food.x*20, food.y*20, 18, 18);
      }

      const interval = setInterval(() => { update(); draw(); }, 200);
      window.addEventListener('keydown', e => {
        if (e.key.startsWith('Arrow')) e.preventDefault();
        if (e.key === 'ArrowUp' && dir !== 'down') dir = 'up';
        if (e.key === 'ArrowDown' && dir !== 'up') dir = 'down';
        if (e.key === 'ArrowLeft' && dir !== 'right') dir = 'left';
        if (e.key === 'ArrowRight' && dir !== 'left') dir = 'right';
      });
      addMobileControls(container, d => {
        if (d === 'up' && dir !== 'down') dir = 'up';
        if (d === 'down' && dir !== 'up') dir = 'down';
        if (d === 'left' && dir !== 'right') dir = 'left';
        if (d === 'right' && dir !== 'left') dir = 'right';
      });
      return () => clearInterval(interval);
    },
    // 2 Тетрис (полноценный, но компактный)
    (container) => {
      addInstructions(container, 'Стрелки: влево/вправо, вверх — поворот, вниз — ускорение. Заполните линии.');
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 400;
      canvas.className = 'glass';
      const ctx = canvas.getContext('2d');
      container.appendChild(canvas);
      const scoreDiv = document.createElement('div'); scoreDiv.className = 'text-cyan-300 mt-2'; scoreDiv.innerText = 'Линии: 0';
      container.appendChild(scoreDiv);

      const cols = 10, rows = 20;
      let board = Array(rows).fill().map(() => Array(cols).fill(0));
      let piece, nextPiece;
      let score = 0;
      let intervalTime = 400;
      let gameInterval;

      const pieces = [
        { shape: [[1,1,1,1]], color: '#0ff' }, // I
        { shape: [[1,1],[1,1]], color: '#ff0' }, // O
        { shape: [[0,1,0],[1,1,1]], color: '#f0f' }, // T
        { shape: [[1,0,0],[1,1,1]], color: '#f80' }, // L
        { shape: [[0,0,1],[1,1,1]], color: '#80f' }, // J
        { shape: [[0,1,1],[1,1,0]], color: '#0f0' }, // S
        { shape: [[1,1,0],[0,1,1]], color: '#f00' } // Z
      ];

      function randomPiece() {
        return JSON.parse(JSON.stringify(pieces[Math.floor(Math.random() * pieces.length)]));
      }

      piece = randomPiece(); piece.x = 3; piece.y = 0;
      nextPiece = randomPiece();

      function collision(p) {
        for (let r = 0; r < p.shape.length; r++) {
          for (let c = 0; c < p.shape[0].length; c++) {
            if (p.shape[r][c]) {
              let x = p.x + c, y = p.y + r;

        let rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left, y = e.clientY - rect.top;
        for (let i = targets.length - 1; i >= 0; i--) {
          let t = targets[i];
          if (Math.hypot(t.x - x, t.y - y) < 20) {
            targets.splice(i, 1);
            score++;
            scoreDiv.innerText = 'Очки: ' + score;
            targets.push({ x: Math.random() * 380 + 10, y: Math.random() * 280 + 10 });
          }
        }
      };

      function draw() {
        ctx.clearRect(0, 0, 400, 300);
        ctx.fillStyle = 'red';
        targets.forEach(t => { ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, 2 * Math.PI); ctx.fill(); });
        requestAnimationFrame(draw);
      }
      draw();
      return () => {};
    },
    // 19 Jump Game
    (container) => {
      addInstructions(container, 'Нажимайте пробел, чтобы прыгать. Доберитесь до платформы.');
      const canvas = document.createElement('canvas'); canvas.width = 300; canvas.height = 200;
      const ctx = canvas.getContext('2d'); container.appendChild(canvas);
      let player = { x: 50, y: 180, vy: 0, onGround: true };
      let platforms = [{ x: 0, y: 190, w: 300 }, { x: 100, y: 150, w: 80 }];
      let gameOver = false;

      function update() {
        if (gameOver) return;
        player.vy += 0.5; player.y += player.vy;
        player.onGround = false;
        platforms.forEach(p => {
          if (player.y >= p.y - 20 && player.y <= p.y && player.x >= p.x && player.x <= p.x + p.w) {
            player.y = p.y - 20; player.vy = 0; player.onGround = true;
          }
        });
        if (player.y > 200) gameOver = true;
      }

      function draw() {
        ctx.clearRect(0, 0, 300, 200);
        ctx.fillStyle = 'cyan'; ctx.fillRect(player.x, player.y, 20, 20);
        ctx.fillStyle = 'gray'; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, 5));
        if (gameOver) { ctx.fillStyle = 'white'; ctx.font = '20px Arial'; ctx.fillText('Game Over', 80, 100); }
        requestAnimationFrame(draw);
      }

      setInterval(update, 30);
      window.addEventListener('keydown', e => {
        if (e.code === 'Space' && player.onGround) { player.vy = -10; player.onGround = false; }
      });
      return () => {};
    },
    // 20 Лабиринт
    (container) => {
      addInstructions(container, 'Управляйте шариком стрелками. Дойдите до зелёной цели.');
      const canvas = document.createElement('canvas'); canvas.width = 300; canvas.height = 300;
      const ctx = canvas.getContext('2d'); container.appendChild(canvas);
      let ball = { x: 20, y: 20 };
      const goal = { x: 260, y: 260 };
      let walls = [ { x: 100, y: 0, w: 20, h: 150 }, { x: 200, y: 150, w: 20, h: 150 } ];

      function collision(x, y) {
        for (let w of walls) {
          if (x+10 > w.x && x < w.x + w.w && y+10 > w.y && y < w.y + w.h) return true;
        }
        return false;
      }

      window.addEventListener('keydown', e => {
        let dx = 0, dy = 0;
        if (e.key === 'ArrowRight') dx = 5; if (e.key === 'ArrowLeft') dx = -5;
        if (e.key === 'ArrowUp') dy = -5; if (e.key === 'ArrowDown') dy = 5;
        let newX = ball.x + dx, newY = ball.y + dy;
        if (newX >= 0 && newX <= 290 && newY >= 0 && newY <= 290 && !collision(newX, newY)) {
          ball.x = newX; ball.y = newY;
        }
        if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < 15) alert('Победа!');
      });

      function draw() {
        ctx.clearRect(0, 0, 300, 300);
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(ball.x+5, ball.y+5, 5, 0, 2*Math.PI); ctx.fill();
        ctx.fillStyle = 'green'; ctx.fillRect(goal.x, goal.y, 10, 10);
        ctx.fillStyle = 'gray'; walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
        requestAnimationFrame(draw);
      }
      draw();
      return () => {};
    },
    // 21 Саймон говорит
    (container) => {
      addInstructions(container, 'Запомните последовательность цветов и повторите её.');
      const colors = ['red', 'green', 'blue', 'yellow'];
      let sequence = []; let playerIndex = 0; let level = 0;
      const div = document.createElement('div'); div.className = 'flex gap-2';
      const btns = colors.map((c, i) => {
        let btn = document.createElement('button');
        btn.className = 'w-16 h-16 rounded-full opacity-60';
        btn.style.background = c;
        btn.onclick = () => {
          if (playerIndex >= sequence.length) return;
          if (colors.indexOf(c) === sequence[playerIndex]) {
            btn.style.opacity = '1'; setTimeout(() => btn.style.opacity = '0.6', 200);
            playerIndex++;
            if (playerIndex === sequence.length) {
              level++;
              setTimeout(() => { addStep(); }, 500);
            }
          } else { alert('Ошибка! Игра окончена. Уровень ' + level); sequence = []; level = 0; }
        };
        div.appendChild(btn);
        return btn;
      });
      container.appendChild(div);
      function addStep() {
        let next = Math.floor(Math.random() * 4);
        sequence.push(next);
        playerIndex = 0;
        playSequence();
      }
      function playSequence() {
        let i = 0;
        function lightUp() {
          if (i >= sequence.length) return;
          let idx = sequence[i];
          btns[idx].style.opacity = '1';
          setTimeout(() => { btns[idx].style.opacity = '0.6'; i++; setTimeout(lightUp, 300); }, 300);
        }
        lightUp();
      }
      addStep();
      return () => {};
    },
    // 22 Слова из слов
    (container) => {
      addInstructions(container, 'Составьте как можно больше слов из букв слова "АРКАДА".');
      const base = 'АРКАДА';
      let used = [];
      const input = document.createElement('input'); input.className = 'p-2 text-black rounded';
      const btn = document.createElement('button'); btn.className = 'back-btn ml-2'; btn.innerText = 'Проверить';
      const list = document.createElement('ul'); list.className = 'mt-4';
      btn.onclick = () => {
        let word = input.value.toUpperCase().trim();
        if (word.length < 2) return;
        let tempBase = base.split('');
        let ok = true;
        for (let ch of word) {
          let idx = tempBase.indexOf(ch);
          if (idx === -1) { ok = false; break; }
          tempBase.splice(idx, 1);
        }
        if (ok && !used.includes(word)) {
          used.push(word);
          let li = document.createElement('li'); li.innerText = word; list.appendChild(li);
        }
        input.value = '';
      };
      container.appendChild(input); container.appendChild(btn); container.appendChild(list);
      return () => {};
    },
    // 23 Викторина
    (container) => {
      addInstructions(container, 'Ответьте на вопрос.');
      const questions = [
        { q: 'Столица Франции?', opts: ['Париж', 'Лондон', 'Берлин'], ans: 0 },
        { q: '2+2?', opts: ['3', '4', '5'], ans: 1 }
      ];
      let qIdx = 0;
      const div = document.createElement('div');
      function showQuestion() {
        let q = questions[qIdx];
        div.innerHTML = `<p class="text-xl mb-4">${q.q}</p>`;
        q.opts.forEach((opt, i) => {
          let btn = document.createElement('button');
          btn.className = 'back-btn m-2'; btn.innerText = opt;
          btn.onclick = () => {
            if (i === q.ans) { alert('Верно!'); qIdx = (qIdx + 1) % questions.length; showQuestion(); }
            else alert('Неверно, попробуй ещё.');
          };
          div.appendChild(btn);
        });
      }
      showQuestion();
      container.appendChild(div);
      return () => {};
    },
    // 24 Кости
    (container) => {
      addInstructions(container, 'Бросьте кости. Сумма очков.');
      const btn = document.createElement('button'); btn.className = 'back-btn'; btn.innerText = 'Бросить';
      const result = document.createElement('div'); result.className = 'text-3xl mt-4';
      btn.onclick = () => {
        let d1 = Math.floor(Math.random() * 6) + 1;
        let d2 = Math.floor(Math.random() * 6) + 1;
        result.innerText = `🎲 ${d1} + ${d2} = ${d1 + d2}`;
      };
      container.appendChild(btn); container.appendChild(result);
      return () => {};
    },
    // 25 Рулетка
    (container) => {
      addInstructions(container, 'Крутите рулетку, выпадает число от 0 до 36.');
      const btn = document.createElement('button'); btn.className = 'back-btn'; btn.innerText = 'Крутить';
      const result = document.createElement('div'); result.className = 'text-3xl mt-4';
      btn.onclick = () => { let n = Math.floor(Math.random() * 37); result.innerText = `Выпало: ${n}`; };
      container.appendChild(btn); container.appendChild(result);
      return () => {};
    },
    // 26 Угадай мелодию (имитация)
    (container) => {
      addInstructions(container, 'Прослушайте ноту и угадайте её название (до, ре, ми...).');
      const notes = ['до', 'ре', 'ми', 'фа', 'соль', 'ля', 'си'];
      const freqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
      let currentNote = Math.floor(Math.random() * 7);
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playNote() {
        let osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freqs[currentNote];
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
      const playBtn = document.createElement('button'); playBtn.className = 'back-btn'; playBtn.innerText = '▶ Сыграть';
      playBtn.onclick = playNote;
      const input = document.createElement('input'); input.className = 'p-2 text-black rounded ml-2'; placeholder = 'нота';
      const checkBtn = document.createElement('button'); checkBtn.className = 'back-btn ml-2'; checkBtn.innerText = 'Проверить';
      checkBtn.onclick = () => {
        if (input.value.trim().toLowerCase() === notes[currentNote]) {
          alert('Верно!'); currentNote = Math.floor(Math.random() * 7);
        } else alert('Неверно');
        input.value = '';
      };
      container.appendChild(playBtn); container.appendChild(input); container.appendChild(checkBtn);
      return () => audioCtx.close();
    },
    // 27 Пятнашки
    (container) => {
      addInstructions(container, 'Нажимайте на клетки рядом с пустой, чтобы переместить.');
      let tiles = [1,2,3,4,5,6,7,8,0];
      const div = document.createElement('div'); div.className = 'grid grid-cols-3 gap-1 w-48';
      function draw() {
        div.innerHTML = '';
        tiles.forEach((v, i) => {
          let cell = document.createElement('div'); cell.className = 'glass w-12 h-12 flex items-center justify-center text-xl cursor-pointer';
          cell.innerText = v || ''; cell.onclick = () => {
            let idx = tiles.indexOf(0);
            if (Math.abs(idx - i) === 1 && Math.floor(idx/3) === Math.floor(i/3) || Math.abs(idx - i) === 3) {
              [tiles[i], tiles[idx]] = [tiles[idx], tiles[i]];
              draw();
              if (tiles.join('') === '123456780') alert('Победа!');
            }
          };
          div.appendChild(cell);
        });
      }
      draw(); container.appendChild(div);
      return () => {};
    },
    // 28 Арканоид
    (container) => {
      addInstructions(container, 'Отбивайте шарик ракеткой (мышь). Разбейте все кирпичи.');
      const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 300;
      const ctx = canvas.getContext('2d'); container.appendChild(canvas);
      let ball = { x: 200, y: 250, dx: 3, dy: -3 };
      let paddle = { x: 150 };
      let bricks = [];
      for (let i = 0; i < 5; i++) for (let j = 0; j < 8; j++) bricks.push({ x: j * 50, y: i * 20, w: 40, h: 15, alive: true });
      let score = 0;
      const scoreDiv = document.createElement('div'); scoreDiv.className = 'text-cyan-300 mt-2'; scoreDiv.innerText = 'Кирпичей: 40';
      container.appendChild(scoreDiv);

      const interval = setInterval(() => {
        ball.x += ball.dx; ball.y += ball.dy;
        if (ball.x < 0 || ball.x > 400) ball.dx *= -1;
        if (ball.y < 0) ball.dy *= -1;
        if (ball.y > 280 && ball.x > paddle.x && ball.x < paddle.x + 100) ball.dy *= -1;
        bricks.forEach(b => {
          if (b.alive && ball.x > b.x && ball.x < b.x + 40 && ball.y > b.y && ball.y < b.y + 15) {
            b.alive = false; ball.dy *= -1; score++; scoreDiv.innerText = 'Осталось: ' + (40 - score);
          }
        });
        if (score === 40) alert('Победа!');
        ctx.clearRect(0, 0, 400, 300);
        ctx.fillStyle = 'cyan'; ctx.fillRect(paddle.x, 280, 100, 10);
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, 2 * Math.PI); ctx.fill();
        bricks.forEach(b => { if (b.alive) { ctx.fillStyle = 'orange'; ctx.fillRect(b.x, b.y, b.w, b.h); } });
      }, 30);

      window.addEventListener('mousemove', e => {
        let rect = canvas.getBoundingClientRect();
        paddle.x = e.clientX - rect.left - 50;
        if (paddle.x < 0) paddle.x = 0; if (paddle.x > 300) paddle.x = 300;
      });
      return () => clearInterval(interval);
    },
    // 29 Match-3 (упрощённо)
    (container) => {
      addInstructions(container, 'Обменивайте соседние фишки, чтобы собрать 3 в ряд.');
      let board = [];
      for (let i = 0; i < 6; i++) {
        board[i] = [];
        for (let j = 0; j < 6; j++) board[i][j] = Math.floor(Math.random() * 3) + 1;
      }
      const div = document.createElement('div'); div.className = 'grid grid-cols-6 gap-1 w-64';
      function draw() {
        div.innerHTML = '';
        for (let r = 0; r < 6; r++) {
          for (let c = 0; c < 6; c++) {
            let cell = document.createElement('div'); cell.className = 'glass w-10 h-10 flex items-center justify-center text-xl';
            cell.innerText = ['', '🔴', '🔵', '🟢'][board[r][c]];
            div.appendChild(cell);
          }
        }
      }
      draw();
      container.appendChild(div);
      return () => {};
    },
    // 30 Жестовый Paint (уже реализован отдельно)
    runGesturePaint
  ];

  // ====================== НАВИГАЦИЯ ======================
  function showMenu() {
    gameView.classList.add('hidden');
    menuContainer.classList.remove('hidden');
    if (currentGameIndex !== -1) gameInstances[currentGameIndex]?.stop?.();
    gsap.to(menuContainer.children, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.02 });
  }
  function showGame(index) {
    if (currentGameIndex !== -1) gameInstances[currentGameIndex]?.stop?.();
    menuContainer.classList.add('hidden');
    gameView.classList.remove('hidden');
    gameTitle.innerText = gamesList[index];
    gameCanvasContainer.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'w-full flex flex-col items-center';
    gameCanvasContainer.appendChild(wrapper);
    const cleanup = gameRunners[index]?.(wrapper) || null;
    gameInstances[index] = { stop: cleanup };
    currentGameIndex = index;
    gsap.fromTo(gameCanvasContainer, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 });
  }
  backBtn.addEventListener('click', showMenu);

  gamesList.forEach((name, idx) => {
    const card = document.createElement('div');
    card.className = 'game-card p-3 flex flex-col items-center text-center';
    card.innerHTML = `<i class="fas fa-gamepad text-3xl text-cyan-300 mb-2"></i><span class="text-sm font-medium">${name}</span><span class="text-xs text-cyan-200 mt-1">#${idx+1}</span>`;
    card.addEventListener('click', () => showGame(idx));
    menuContainer.appendChild(card);
  });

  window.onload = () => {
    gsap.to(menuContainer, { opacity: 1, duration: 0.8 });
    gsap.from(menuContainer.children, { opacity: 0, scale: 0.8, duration: 0.5, stagger: 0.03, ease: "elastic.out(1,0.5)" });
  };
})();
</script>
</body>
</html>
