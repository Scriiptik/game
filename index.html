<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Линейка</title>

<!-- PWA через data-url -->
<link rel="manifest" href="data:application/json,{
  &quot;name&quot;:&quot;AR Линейка&quot;,
  &quot;short_name&quot;:&quot;Линейка&quot;,
  &quot;start_url&quot;:&quot;.&quot;,
  &quot;display&quot;:&quot;standalone&quot;,
  &quot;background_color&quot;:&quot;#000000&quot;,
  &quot;theme_color&quot;:&quot;#000000&quot;
}">
<meta name="theme-color" content="#000000">

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: black;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}

video, canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}

#ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    color: white;
    padding: 14px 18px;
    border-radius: 18px;
    text-align: center;
    min-width: 220px;
    backdrop-filter: blur(8px);
}

#value {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
}

button {
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
}
button:active { transform: scale(0.96); }

#hint {
    position: fixed;
    top: 16px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 14px;
    opacity: 0.85;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="hint">Коснись двух точек для измерения</div>

<div id="ui">
    <div id="value">— см</div>
    <button onclick="reset()">Сброс</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const value = document.getElementById("value");

let points = [];
let cmPerPixel = 0.026; 
// 👆 Среднее значение. Для точности откалибруй (см. ниже)

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });
        video.srcObject = stream;
    } catch {
        alert("Разреши доступ к камере");
    }
}
startCamera();

function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
addEventListener("resize", resize);

canvas.addEventListener("touchstart", e => {
    if (points.length === 2) return;

    const t = e.touches[0];
    points.push({ x: t.clientX, y: t.clientY });

    if (points.length === 2) draw();
});

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const [a,b] = points;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "#ff3b30";
    ctx.lineWidth = 3;
    ctx.stroke();

    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const px = Math.hypot(dx, dy);
    const cm = (px * cmPerPixel).toFixed(1);

    ctx.fillStyle = "#ff3b30";
    ctx.font = "20px Arial";
    ctx.fillText(cm + " см", b.x + 10, b.y - 10);

    value.textContent = cm + " см";
}

function reset() {
    points = [];
    ctx.clearRect(0,0,canvas.width,canvas.height);
    value.textContent = "— см";
}

/* PWA Service Worker (встроенный) */
if ("serviceWorker" in navigator) {
    const sw = `
        self.addEventListener("fetch", e => {
            e.respondWith(fetch(e.request));
        });
    `;
    const blob = new Blob([sw], { type: "text/javascript" });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
}
</script>

</body>
</html>
