<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advanced Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== ЗВЁЗДНЫЙ ФОН ===== */
body{
  margin:0;
  height:100vh;
  background:#050b14;
  overflow:hidden;
  font-family:system-ui,sans-serif;
  color:white;
}

.starfield{
  position:fixed;
  inset:0;
  background:
    radial-gradient(1px 1px at 10% 20%,#fff,transparent),
    radial-gradient(1px 1px at 30% 80%,#fff,transparent),
    radial-gradient(2px 2px at 50% 40%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent),
    radial-gradient(1px 1px at 90% 10%,#fff,transparent);
  animation:stars 120s linear infinite;
  opacity:.8;
}
.starfield::after{
  content:"";
  position:absolute;
  inset:-2000px;
  background:inherit;
  animation:stars 240s linear infinite reverse;
  opacity:.4;
}

@keyframes stars{
  from{transform:translateY(0)}
  to{transform:translateY(2000px)}
}

/* ===== ПАНЕЛИ ===== */
.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  border-radius:20px;
}

/* ===== ИГРА ===== */
.game{
  position:relative;
  z-index:3;
  width:360px;
  padding:20px;
  margin:auto;
}

.click-btn{
  width:160px;height:160px;
  border-radius:50%;
  border:none;
  background:radial-gradient(circle,#00ffd5,#00b3a4);
  box-shadow:0 0 35px rgba(0,255,213,.7);
  font-size:22px;
  cursor:pointer;
  transition:.1s;
}
.click-btn:active{transform:scale(.9)}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  cursor:pointer;
}

/* ===== МАГАЗИН ===== */
.shop-panel{
  position:absolute;
  top:15px;
  left:15px;
  z-index:4;
}
.shop{
  margin-top:6px;
  max-height:0;
  overflow:auto;
  transition:.4s;
  width:240px;
}
.shop.open{max-height:420px}

.item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.item img{width:36px}

/* ===== ПРЕДМЕТЫ НА ФОНЕ ===== */
.bg-items{
  position:absolute;
  inset:0;
  z-index:2;
}
.bg-item{
  position:absolute;
  width:60px;
  cursor:grab;
  animation:float 6s ease-in-out infinite, spin 25s linear infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes spin{
  from{rotate:0deg}
  to{rotate:360deg}
}

/* ===== ЧАСТИЦЫ ===== */
.particle{
  position:absolute;
  color:#00ffd5;
  animation:particle 1s forwards;
  pointer-events:none;
}
@keyframes particle{
  to{opacity:0;transform:translateY(-60px)}
}
</style>
</head>

<body>

<div class="starfield"></div>
<div class="bg-items" id="bg"></div>

<div class="shop-panel glass">
  <button id="toggleShop">🛒 Магазин</button>
  <div class="shop glass" id="shop"></div>
</div>

<div class="game glass">
<h2>⚡ Advanced Clicker</h2>
<div>Очки: <span id="score">0</span></div>
<div>Сила клика: ×<span id="power">1</span></div>
<div>Автокликер ур.: <span id="autoLvl">0</span></div>

<button class="click-btn" id="click">КЛИК</button>
<button id="upgrade">🔥 Усилить ×2 (<span id="upPrice">100</span>)</button>
<button id="autoUp">🤖 Улучшить автоклик (<span id="autoPrice">500</span>)</button>
</div>

<script>
let score=+localStorage.score||0;
let power=+localStorage.power||1;
let upPrice=+localStorage.upPrice||100;
let autoLvl=+localStorage.autoLvl||0;
let autoPrice=+localStorage.autoPrice||500;
let owned=JSON.parse(localStorage.owned||"{}");
let pos=JSON.parse(localStorage.pos||"{}");

const items=[
{id:"cat",name:"Кот",img:"https://cdn-icons-png.flaticon.com/512/616/616408.png"},
{id:"phone",name:"Телефон",img:"https://cdn-icons-png.flaticon.com/512/888/888879.png"},
{id:"laptop",name:"Ноутбук",img:"https://cdn-icons-png.flaticon.com/512/3474/3474362.png"},
{id:"robot",name:"Робот",img:"https://cdn-icons-png.flaticon.com/512/4712/4712109.png"},
{id:"drone",name:"Дрон",img:"https://cdn-icons-png.flaticon.com/512/808/808439.png"},
{id:"console",name:"Консоль",img:"https://cdn-icons-png.flaticon.com/512/2972/2972215.png"}
].map((i,n)=>({...i,price:Math.floor(1000*Math.pow(1.8,n))}));

const bg=document.getElementById("bg");
const shop=document.getElementById("shop");

function save(){
Object.assign(localStorage,{score,power,upPrice,autoLvl,autoPrice,
 owned:JSON.stringify(owned),pos:JSON.stringify(pos)});
}

document.getElementById("click").onclick=e=>{
score+=power;
spawn(e.clientX,e.clientY,"+"+power);
update();
};

document.getElementById("upgrade").onclick=()=>{
if(score>=upPrice){
score-=upPrice;
power*=2;
upPrice=Math.floor(upPrice*2.8);
update();
}
};

document.getElementById("autoUp").onclick=()=>{
if(score>=autoPrice){
score-=autoPrice;
autoLvl++;
autoPrice=Math.floor(autoPrice*2.6);
update();
}
};

document.getElementById("toggleShop").onclick=()=>shop.classList.toggle("open");

function renderShop(){
shop.innerHTML="";
items.forEach(i=>{
const d=document.createElement("div");
d.className="item";
d.innerHTML=`
<img src="${i.img}">
<div>${i.name}<br>${owned[i.id]?"Куплено":"💰"+i.price}</div>
<button ${owned[i.id]?"disabled":""}>Купить</button>`;
d.querySelector("button").onclick=()=>{
if(score>=i.price){
score-=i.price;
owned[i.id]=i.img;
addBg(i.id,i.img);
update();renderShop();
}};
shop.appendChild(d);
});
}

function addBg(id,img){
const el=document.createElement("img");
el.src=img;
el.className="bg-item";
el.style.left=(pos[id]?.x||Math.random()*300)+"px";
el.style.top=(pos[id]?.y||Math.random()*400)+"px";
drag(el,id);
bg.appendChild(el);
}

function drag(el,id){
let dx,dy;
el.onmousedown=e=>{
dx=e.offsetX;dy=e.offsetY;
document.onmousemove=m=>{
el.style.left=m.pageX-dx+"px";
el.style.top=m.pageY-dy+"px";
pos[id]={x:m.pageX-dx,y:m.pageY-dy};
};
document.onmouseup=()=>{document.onmousemove=null;save();}
};
}

function spawn(x,y,t){
const p=document.createElement("div");
p.className="particle";
p.textContent=t;
p.style.left=x+"px";
p.style.top=y+"px";
document.body.appendChild(p);
setTimeout(()=>p.remove(),900);
}

setInterval(()=>{
if(autoLvl>0){
score+=power*autoLvl;
update();
}
},1000);

function update(){
document.getElementById("score").textContent=score;
document.getElementById("power").textContent=power;
document.getElementById("autoLvl").textContent=autoLvl;
save();
}

Object.keys(owned).forEach(id=>addBg(id,owned[id]));
renderShop();update();
</script>
</body>
</html>
