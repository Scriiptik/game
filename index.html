<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D пространство + скелет руки</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            text-align: right;
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">✋ Отслеживание руки активно (изображение скрыто)</div>
    <div id="status">Поиск руки...</div>
    <div class="instruction">👆 Сведите большой и указательный палец, чтобы захватить предмет<br>🖱️ Мышь/тач — вращение камеры</div>

    <!-- Подключаем Three.js и OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Hands (использует TensorFlow.js под капотом) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Настройка сцены Three.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // ограничим для производительности
        renderer.shadowMap.enabled = false; // для скорости
        document.body.appendChild(renderer.domElement);

        // Орбитальный контроллер (вращение сцены)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxDistance = 10;
        controls.minDistance = 2;
        controls.target.set(0, 0.5, 0);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        
        const backLight = new THREE.PointLight(0x4466ff, 0.5);
        backLight.position.set(-2, 1, -2);
        scene.add(backLight);

        // --- Геометрические фигуры для взаимодействия ---
        const shapes = [];

        // Кубик
        const cubeGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff5733, emissive: 0x331100 });
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        cube.position.set(0.8, 0.3, 0.5);
        scene.add(cube);
        shapes.push(cube);

        // Сфера
        const sphereGeo = new THREE.SphereGeometry(0.5, 24, 16);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0x33ff57, emissive: 0x113311 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(-0.7, 0.5, -0.2);
        scene.add(sphere);
        shapes.push(sphere);

        // Цилиндр
        const cylinderGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.8, 16);
        const cylinderMat = new THREE.MeshStandardMaterial({ color: 0x3357ff, emissive: 0x111133 });
        const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
        cylinder.position.set(0.2, 0.4, -0.9);
        scene.add(cylinder);
        shapes.push(cylinder);

        // Тор (бублик)
        const torusGeo = new THREE.TorusGeometry(0.4, 0.15, 16, 32);
        const torusMat = new THREE.MeshStandardMaterial({ color: 0xff33f5, emissive: 0x331133 });
        const torus = new THREE.Mesh(torusGeo, torusMat);
        torus.position.set(-0.3, 0.5, 0.8);
        torus.rotation.x = Math.PI / 2;
        scene.add(torus);
        shapes.push(torus);

        // Маленький кубик для теста
        const smallCubeGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const smallCubeMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
        const smallCube = new THREE.Mesh(smallCubeGeo, smallCubeMat);
        smallCube.position.set(1.0, 0.15, -0.5);
        scene.add(smallCube);
        shapes.push(smallCube);

        // Добавим пол и стены для контекста (полупрозрачные)
        const gridHelper = new THREE.GridHelper(5, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.2;
        scene.add(gridHelper);
        
        // Небольшие опорные точки
        const axesHelper = new THREE.AxesHelper(2);
        // scene.add(axesHelper); // раскомментировать для отладки

        // --- Переменные для отслеживания руки ---
        let handLandmarks = null; // массив 21 точки {x, y, z} (z в метрах от камеры, но мы адаптируем)
        const handBones = []; // для хранения линий скелета
        const handJoints = []; // сферы для суставов

        // Параметры для преобразования координат из нормализованных (0-1) в мировые
        // Мы разместим руку в плоскости XZ на уровне Y примерно 0.5, с масштабом
        const handScale = 1.5; // размах руки
        let handPositionOffset = new THREE.Vector3(0, 0.5, 0); // центр ладони

        // Создаем группу для всех элементов руки, чтобы легко управлять
        const handGroup = new THREE.Group();
        scene.add(handGroup);

        // Создаем скелет (заготовки)
        const jointMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200 });
        const boneMaterial = new THREE.LineBasicMaterial({ color: 0xffdd99 });

        // 21 точка (по спецификации MediaPipe Hands)
        for (let i = 0; i < 21; i++) {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), jointMaterial);
            sphere.visible = false;
            handGroup.add(sphere);
            handJoints.push(sphere);
        }

        // Линии между соединениями (определены в индексах)
        // Пары соединений для скелета руки (MediaPipe)
        const connections = [
            [0,1], [1,2], [2,3], [3,4], // большой палец
            [0,5], [5,6], [6,7], [7,8], // указательный
            [0,9], [9,10], [10,11], [11,12], // средний
            [0,13], [13,14], [14,15], [15,16], // безымянный
            [0,17], [17,18], [18,19], [19,20], // мизинец
            [5,9], [9,13], [13,17] // соединения между пальцами
        ];

        connections.forEach(([i, j]) => {
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
            const line = new THREE.Line(lineGeo, boneMaterial);
            line.visible = false;
            handGroup.add(line);
            handBones.push({ line, i, j });
        });

        // --- Логика захвата предметов ---
        let grabbedShape = null; // текущий захваченный объект
        let grabDistance = 0; // расстояние от пальца до объекта при захвате
        const grabThreshold = 0.3; // порог расстояния для захвата

        // --- Инициализация MediaPipe Hands ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            selfieMode: false, // не зеркалить
            maxNumHands: 1, // только одна рука для простоты
            modelComplexity: 0, // 0 = легкая модель (быстрее), 1 = точнее
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);

        // Запрос камеры
        const videoElement = document.createElement('video');
        videoElement.style.display = 'none'; // видео скрыто

        const cameraObj = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        // Запуск камеры
        cameraObj.start().then(() => {
            document.getElementById('status').textContent = 'Камера работает';
        }).catch(e => {
            document.getElementById('status').textContent = 'Ошибка доступа к камере';
            console.error(e);
        });

        // Функция обработки результатов
        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Берем только первую руку
                const landmarks = results.multiHandLandmarks[0];
                handLandmarks = landmarks.map(lm => new THREE.Vector3(lm.x, lm.y, lm.z));
                document.getElementById('status').textContent = 'Рука обнаружена';
                
                // Делаем скелет видимым
                handJoints.forEach(j => j.visible = true);
                handBones.forEach(b => b.line.visible = true);
            } else {
                handLandmarks = null;
                document.getElementById('status').textContent = 'Рука не видна';
                // Прячем скелет
                handJoints.forEach(j => j.visible = false);
                handBones.forEach(b => b.line.visible = false);
                
                // Если объект был захвачен, отпускаем
                if (grabbedShape) {
                    grabbedShape = null;
                }
            }
        }

        // --- Вспомогательные функции для обновления скелета в 3D ---
        function updateHandModel() {
            if (!handLandmarks) return;

            // Преобразование координат: нормализованные (0-1) в мировые.
            // Используем размер экрана/камеры для масштабирования, но проще задать диапазон по X и Z
            // Пусть X от -1.5 до 1.5, Y от 0 до 1.2 (примерно), Z от -1 до 1 (глубина)
            // MediaPipe z: чем больше значение, тем дальше от камеры. Инвертируем, чтобы ближе = меньше Z?
            // Для удобства: используем x-> X, y-> Y (с инверсией, т.к. в изображении y сверху вниз)
            // и z-> Z (сместим так, чтобы рука была в пределах сцены)
            
            const points = handLandmarks.map(lm => {
                // Масштабируем x и y: центр ладони где-то в середине кадра -> смещаем в центр сцены
                // x: от 0 до 1 -> от -1.5 до 1.5
                // y: от 0 до 1 -> от 1.0 до -0.2 (перевернуто)
                // z: от 0 до 1 (примерно) -> от -1 до 1 (инвертируем)
                const x = (lm.x - 0.5) * 3.0; // размах ~3 метра
                const y = (0.5 - lm.y) * 2.2 + 0.5; // чтобы рука была на уровне 0.5
                const z = (lm.z - 0.5) * 2.0; // примерно -1..1
                return new THREE.Vector3(x, y, z);
            });

            // Обновляем позиции суставов
            handJoints.forEach((joint, idx) => {
                if (idx < points.length) {
                    joint.position.copy(points[idx]);
                }
            });

            // Обновляем линии скелета
            handBones.forEach(({ line, i, j }) => {
                if (i < points.length && j < points.length) {
                    const positions = new Float32Array([
                        points[i].x, points[i].y, points[i].z,
                        points[j].x, points[j].y, points[j].z
                    ]);
                    line.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    line.geometry.setDrawRange(0, 2); // обновить
                    line.geometry.attributes.position.needsUpdate = true;
                }
            });

            // --- Логика захвата ---
            if (points.length > 0) {
                // Используем кончик большого (индекс 4) и указательного (индекс 8) пальца
                const thumbTip = points[4];
                const indexTip = points[8];
                
                // Расстояние между ними (щипок)
                const distance = thumbTip.distanceTo(indexTip);
                const pinchDetected = distance < 0.05; // порог

                // Точка захвата (среднее между пальцами)
                const grabPoint = new THREE.Vector3().addVectors(thumbTip, indexTip).multiplyScalar(0.5);

                if (pinchDetected) {
                    // Если ещё не захвачен объект, ищем ближайший
                    if (!grabbedShape) {
                        let minDist = grabThreshold;
                        let closest = null;
                        shapes.forEach(shape => {
                            const dist = shape.position.distanceTo(grabPoint);
                            if (dist < minDist) {
                                minDist = dist;
                                closest = shape;
                            }
                        });
                        if (closest) {
                            grabbedShape = closest;
                            grabDistance = grabbedShape.position.distanceTo(grabPoint);
                            // Визуально выделим (можно изменить цвет или свечение)
                            grabbedShape.material.emissive.setHex(0x444444);
                        }
                    } else {
                        // Перемещаем захваченный объект за точкой захвата с сохранением смещения
                        // Чтобы объект не "прыгал", можно просто переместить его в точку захвата (или с учётом начального смещения)
                        // Но для плавности используем интерполяцию
                        grabbedShape.position.lerp(grabPoint, 0.3);
                    }
                } else {
                    // Если щипка нет, отпускаем объект
                    if (grabbedShape) {
                        grabbedShape.material.emissive.setHex(0x000000); // убираем подсветку
                        grabbedShape = null;
                    }
                }
            }
        }

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);

            // Обновляем положение руки
            updateHandModel();

            // Обновляем контроллер (вращение)
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // --- Адаптация под ресайз окна ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Небольшое вращение фигур для красоты (не обязательно)
        function rotateShapes() {
            shapes.forEach(shape => {
                if (shape !== grabbedShape) { // не вращаем захваченный объект, чтобы не мешать
                    shape.rotation.y += 0.002;
                    shape.rotation.x += 0.001;
                }
            });
        }
        setInterval(rotateShapes, 50); // грубо, но для демо

        console.log('Инициализация завершена');
    </script>
</body>
</html>
