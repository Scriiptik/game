<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-88">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D пространство + жесты тремя пальцами</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        #status {
            position: absolute;
            bottom: 80px;
            left: 20px;
            color: #aaa;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            text-align: right;
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 10;
        }
        .button-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: none;
        }
        .button-panel button {
            pointer-events: auto;
            background: rgba(30, 30, 50, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 100px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .button-panel button:hover {
            background: rgba(80, 80, 120, 0.9);
            transform: scale(1.05);
            border-color: gold;
        }
        .button-panel button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="info">🖐️ Жест «щепоть» (три пальца) для захвата</div>
    <div id="status">Ожидание руки...</div>
    <div class="instruction">👆 Соедините большой, указательный и средний — захват<br>🖱️ Мышь/тач — вращение камеры</div>
    <div class="button-panel">
        <button id="addCube">➕ Куб</button>
        <button id="addSphere">⚪ Сфера</button>
        <button id="addCylinder">📦 Цилиндр</button>
        <button id="addTorus">🍩 Тор</button>
    </div>

    <!-- Подключаем Three.js и OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Настройка сцены ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a20); // глубокий космос

        // --- Камера и рендерер ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 4);
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = false;
        renderer.setClearColor(0x0a0a20);
        document.body.appendChild(renderer.domElement);

        // --- Орбитальный контроллер ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxDistance = 8;
        controls.minDistance = 2;
        controls.target.set(0, 0.5, 0);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);
        const pointLight = new THREE.PointLight(0x4466ff, 0.8);
        pointLight.position.set(-2, 1, 2);
        scene.add(pointLight);

        // --- Туман ---
        scene.fog = new THREE.FogExp2(0x0a0a20, 0.08);

        // --- Пол и решётка ---
        const planeGeometry = new THREE.CircleGeometry(3, 32);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a4a, emissive: 0x111122, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.2;
        scene.add(plane);

        const gridHelper = new THREE.GridHelper(6, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.19;
        scene.add(gridHelper);

        // --- ЗВЁЗДНОЕ ПОЛЕ (множество мерцающих точек) ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);
        const sizes = new Float32Array(starCount); // для индивидуального мерцания
        
        for (let i = 0; i < starCount; i++) {
            // Распределение в сфере радиусом 40-70
            const r = 40 + Math.random() * 40;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);
            
            positions[i*3] = x;
            positions[i*3+1] = y;
            positions[i*3+2] = z;
            
            // Цвет: белый с лёгким оттенком
            colors[i*3] = 0.8 + Math.random() * 0.4;
            colors[i*3+1] = 0.7 + Math.random() * 0.5;
            colors[i*3+2] = 0.6 + Math.random() * 0.5;
            
            sizes[i] = Math.random() * 0.3 + 0.1; // базовый размер
        }
        
        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1)); // сохраним для анимации
        
        // Материал с использованием шейдера для мерцания
        const starMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                varying float vSize;
                uniform float time;
                void main() {
                    vColor = color;
                    // Мерцание: размер меняется синусоидально с индивидуальной частотой
                    float flicker = 0.7 + 0.5 * sin(size * 10.0 + time * 3.0);
                    vSize = size * flicker;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = vSize * (300.0 / -mvPosition.z); // уменьшение с расстоянием
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vSize;
                void main() {
                    // Делаем круглые точки с мягким краем
                    vec2 cxy = 2.0 * gl_PointCoord - 1.0;
                    float r = dot(cxy, cxy);
                    if (r > 1.0) discard; // отсекаем углы
                    float alpha = (1.0 - r) * 0.9; // прозрачность по краям
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // --- ПАДАЮЩИЕ ЗВЁЗДЫ (метеоры) ---
        const meteorCount = 12;
        const meteors = [];
        
        // Создаём текстуру для метеора (яркая точка с хвостом)
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        
        // Рисуем хвост градиентом
        const gradient = ctx.createLinearGradient(0, 0, 64, 64);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.4, 'rgba(255, 200, 100, 0.8)');
        gradient.addColorStop(0.8, 'rgba(100, 150, 255, 0.3)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        
        // Добавляем яркое ядро
        ctx.beginPath();
        ctx.arc(20, 20, 8, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.shadowColor = 'cyan';
        ctx.shadowBlur = 10;
        ctx.fill();
        
        const meteorTexture = new THREE.CanvasTexture(canvas);
        
        for (let i = 0; i < meteorCount; i++) {
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: meteorTexture, 
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(0.8, 0.8, 1);
            
            // Случайная начальная позиция в верхней полусфере
            resetMeteor(sprite);
            
            scene.add(sprite);
            meteors.push(sprite);
        }
        
        function resetMeteor(meteor) {
            meteor.position.x = (Math.random() - 0.5) * 60;
            meteor.position.y = 30 + Math.random() * 30; // высоко
            meteor.position.z = (Math.random() - 0.5) * 60;
            
            meteor.userData = {
                speed: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.15,
                    -0.4 - Math.random() * 0.5,
                    (Math.random() - 0.5) * 0.15
                ),
                life: Math.random() * 100,
                maxLife: 120 + Math.random() * 80
            };
        }

        // --- Фигуры (массив) ---
        const shapes = [];

        // --- Функции создания фигур (оптимизированные) ---
        function createCube() {
            const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff5733, emissive: 0x331100 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()-0.5)*2, 0.3, (Math.random()-0.5)*2);
            scene.add(mesh);
            shapes.push(mesh);
        }

        function createSphere() {
            const geo = new THREE.SphereGeometry(0.35, 10, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x33ff57, emissive: 0x113311 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()-0.5)*2, 0.35, (Math.random()-0.5)*2);
            scene.add(mesh);
            shapes.push(mesh);
        }

        function createCylinder() {
            const geo = new THREE.CylinderGeometry(0.3, 0.3, 0.6, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x3357ff, emissive: 0x111133 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()-0.5)*2, 0.3, (Math.random()-0.5)*2);
            scene.add(mesh);
            shapes.push(mesh);
        }

        function createTorus() {
            const geo = new THREE.TorusGeometry(0.35, 0.1, 8, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff33f5, emissive: 0x331133 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()-0.5)*2, 0.35, (Math.random()-0.5)*2);
            mesh.rotation.x = Math.PI / 2;
            mesh.rotation.z = Math.random() * Math.PI;
            scene.add(mesh);
            shapes.push(mesh);
        }

        document.getElementById('addCube').addEventListener('click', createCube);
        document.getElementById('addSphere').addEventListener('click', createSphere);
        document.getElementById('addCylinder').addEventListener('click', createCylinder);
        document.getElementById('addTorus').addEventListener('click', createTorus);

        // --- Код отслеживания руки и скелета ---
        let handLandmarks = null;
        const handBones = [];
        const handJoints = [];
        const handGroup = new THREE.Group();
        scene.add(handGroup);

        const jointMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200 });
        const boneMaterial = new THREE.LineBasicMaterial({ color: 0xffdd99 });

        for (let i = 0; i < 21; i++) {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 4), jointMaterial);
            sphere.visible = false;
            handGroup.add(sphere);
            handJoints.push(sphere);
        }

        const connections = [
            [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
        ];

        connections.forEach(([i, j]) => {
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
            const line = new THREE.Line(lineGeo, boneMaterial);
            line.visible = false;
            handGroup.add(line);
            handBones.push({ line, i, j });
        });

        let grabbedShape = null;
        const grabThreshold = 0.08;

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({
            selfieMode: false,
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);

        const videoElement = document.createElement('video');
        videoElement.style.display = 'none';
        const cameraObj = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraObj.start().catch(e => {
            document.getElementById('status').textContent = 'Ошибка камеры';
            console.error(e);
        });

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handLandmarks = results.multiHandLandmarks[0].map(lm => new THREE.Vector3(lm.x, lm.y, lm.z));
                document.getElementById('status').textContent = 'Рука обнаружена';
                handJoints.forEach(j => j.visible = true);
                handBones.forEach(b => b.line.visible = true);
            } else {
                handLandmarks = null;
                document.getElementById('status').textContent = 'Рука не видна';
                handJoints.forEach(j => j.visible = false);
                handBones.forEach(b => b.line.visible = false);
                if (grabbedShape) {
                    grabbedShape.material.emissive.setHex(0x000000);
                    grabbedShape = null;
                }
            }
        }

        function updateHandModel() {
            if (!handLandmarks) return;
            const points = handLandmarks.map(lm => {
                const x = (lm.x - 0.5) * 3.0;
                const y = (0.5 - lm.y) * 2.5 + 0.5;
                const z = lm.z * 2.0 - 0.5;
                return new THREE.Vector3(x, y, z);
            });

            handJoints.forEach((joint, idx) => { if (idx < points.length) joint.position.copy(points[idx]); });
            handBones.forEach(({ line, i, j }) => {
                if (i < points.length && j < points.length) {
                    const positions = new Float32Array([points[i].x, points[i].y, points[i].z, points[j].x, points[j].y, points[j].z]);
                    line.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    line.geometry.setDrawRange(0, 2);
                    line.geometry.attributes.position.needsUpdate = true;
                }
            });

            if (points.length > 0) {
                const thumbTip = points[4];
                const indexTip = points[8];
                const middleTip = points[12];
                const dist1 = thumbTip.distanceTo(indexTip);
                const dist2 = thumbTip.distanceTo(middleTip);
                const dist3 = indexTip.distanceTo(middleTip);
                const pinchDetected = (dist1 < grabThreshold && dist2 < grabThreshold && dist3 < grabThreshold);
                const grabPoint = new THREE.Vector3().addVectors(thumbTip, indexTip).add(middleTip).multiplyScalar(1/3);

                if (pinchDetected) {
                    if (!grabbedShape) {
                        let minDist = 0.4;
                        let closest = null;
                        shapes.forEach(shape => {
                            const dist = shape.position.distanceTo(grabPoint);
                            if (dist < minDist) { minDist = dist; closest = shape; }
                        });
                        if (closest) {
                            grabbedShape = closest;
                            grabbedShape.material.emissive.setHex(0x444444);
                        }
                    } else {
                        grabbedShape.position.lerp(grabPoint, 0.3);
                    }
                } else {
                    if (grabbedShape) {
                        grabbedShape.material.emissive.setHex(0x000000);
                        grabbedShape = null;
                    }
                }
            }
        }

        // --- Анимация ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000; // секунды

            // Обновляем uniform времени для мерцания звёзд
            if (stars.material.uniforms) {
                stars.material.uniforms.time.value = elapsedTime;
            }

            // Медленное вращение звёздного поля
            stars.rotation.y += 0.0001;
            stars.rotation.x += 0.00005;

            // Анимация падающих звёзд
            meteors.forEach(meteor => {
                meteor.position.x += meteor.userData.speed.x * delta * 30; // корректировка скорости
                meteor.position.y += meteor.userData.speed.y * delta * 30;
                meteor.position.z += meteor.userData.speed.z * delta * 30;
                
                meteor.userData.life -= delta * 10;
                if (meteor.userData.life <= 0 || meteor.position.y < -20) {
                    resetMeteor(meteor);
                }
                
                // Мерцание (изменение прозрачности)
                meteor.material.opacity = 0.6 + 0.4 * Math.sin(elapsedTime * 5 + meteor.userData.life);
            });

            updateHandModel();
            controls.update();

            // Вращение фигур
            shapes.forEach(shape => {
                if (shape !== grabbedShape) {
                    shape.rotation.y += 0.002;
                    shape.rotation.x += 0.001;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
