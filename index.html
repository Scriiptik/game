<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Hidden</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #1c2130;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    overflow: hidden;
}

/* Canvas графика */
canvas {
    position: fixed;
    inset: 0;
}

/* Центральный текст */
#center {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #ffffff;
    z-index: 5;
}

#center h1 {
    font-size: clamp(22px, 4vw, 42px);
    margin: 0;
    letter-spacing: 0.5px;
}

#center p {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.6;
}

/* PNL */
#pnl {
    position: fixed;
    top: 16px;
    right: 20px;
    font-size: 18px;
    font-weight: 600;
    color: #f4d36b;
    z-index: 5;
}
</style>
</head>

<body>

<canvas id="chart"></canvas>

<div id="pnl">PNL: +$12,480.00</div>

<div id="center">
    <h1>Сайт скрыт по желанию правообладателя</h1>
    <p>Access restricted</p>
</div>

<script>
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const pnlEl = document.getElementById("pnl");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ДАННЫЕ PNL */
let pnlValue = 12480;
let points = [];
const maxPoints = 120;

/* начальный рост */
let value = canvas.height * 0.8;
for (let i = 0; i < maxPoints; i++) {
    value -= Math.random() * 2;
    points.push(value);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* фон */
    ctx.fillStyle = "#1c2130";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* линия + заливка */
    ctx.beginPath();
    points.forEach((y, i) => {
        const x = (i / (maxPoints - 1)) * canvas.width;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });

    ctx.lineTo(canvas.width, canvas.height);
    ctx.lineTo(0, canvas.height);
    ctx.closePath();

    ctx.fillStyle = "rgba(244, 211, 107, 0.25)";
    ctx.fill();

    ctx.beginPath();
    points.forEach((y, i) => {
        const x = (i / (maxPoints - 1)) * canvas.width;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });

    ctx.strokeStyle = "#f4d36b";
    ctx.lineWidth = 2;
    ctx.stroke();
}

/* Медленный рост PNL */
setInterval(() => {
    const trend = Math.random() > 0.15 ? -Math.random() * 6 : Math.random() * 4;
    const last = points[points.length - 1];
    const next = Math.min(canvas.height * 0.85, Math.max(canvas.height * 0.2, last + trend));

    points.push(next);
    points.shift();

    pnlValue += Math.random() > 0.2 ? Math.random() * 120 : -Math.random() * 40;
    pnlEl.textContent = `PNL: +$${pnlValue.toFixed(2)}`;

    draw();
}, 600);

draw();
</script>

</body>
</html>
