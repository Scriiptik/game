<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advanced Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
  color: white;
}

.game {
  width: 360px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 25px;
  backdrop-filter: blur(10px);
}

h1 { margin-top: 0; }

.score {
  font-size: 22px;
  margin-bottom: 15px;
}

.click-btn {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: none;
  font-size: 22px;
  cursor: pointer;
  background: radial-gradient(circle,#00ffd5,#00b3a4);
  box-shadow: 0 10px 30px rgba(0,255,213,0.5);
  transition: transform 0.1s;
}
.click-btn:active { transform: scale(0.9); }

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
  cursor: pointer;
}

.toggle {
  margin-top: 15px;
  background: rgba(0,0,0,0.3);
}

.shop {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.4s ease;
}

.shop.open {
  max-height: 600px;
}

.item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 8px;
}

.item img {
  width: 40px;
  height: 40px;
}

.particle {
  position: absolute;
  color: #00ffd5;
  animation: float 1s forwards;
  pointer-events: none;
}

@keyframes float {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-60px); }
}
</style>
</head>

<body>
<div class="game">
  <h1>⚡ Advanced Clicker</h1>
  <div class="score">Очки: <span id="score">0</span></div>
  <div>Сила клика: ×<span id="power">1</span></div>

  <button class="click-btn" id="click">КЛИК</button>

  <button id="upgrade">
    🔥 Усилить клик ×2<br>
    Цена: <span id="upgradePrice">20</span>
  </button>

  <button class="toggle" id="toggleShop">🛒 Магазин предметов</button>

  <div class="shop" id="shop"></div>
</div>

<script>
let score = Number(localStorage.getItem("score")) || 0;
let power = Number(localStorage.getItem("power")) || 1;
let upgradePrice = Number(localStorage.getItem("upgradePrice")) || 20;
let owned = JSON.parse(localStorage.getItem("owned")) || {};

const items = [
  {id:"cat", name:"Котик", price:50, img:"https://cdn-icons-png.flaticon.com/512/616/616408.png"},
  {id:"phone", name:"Смартфон", price:120, img:"https://cdn-icons-png.flaticon.com/512/888/888879.png"},
  {id:"laptop", name:"Ноутбук", price:300, img:"https://cdn-icons-png.flaticon.com/512/3474/3474362.png"},
  {id:"robot", name:"Робот", price:600, img:"https://cdn-icons-png.flaticon.com/512/4712/4712109.png"},
  {id:"neon", name:"Неон-гаджет", price:1200, img:"https://cdn-icons-png.flaticon.com/512/1048/1048953.png"}
];

const scoreEl = document.getElementById("score");
const powerEl = document.getElementById("power");
const upgradeEl = document.getElementById("upgradePrice");
const shopEl = document.getElementById("shop");

function update() {
  scoreEl.textContent = score;
  powerEl.textContent = power;
  upgradeEl.textContent = upgradePrice;
  localStorage.setItem("score", score);
  localStorage.setItem("power", power);
  localStorage.setItem("upgradePrice", upgradePrice);
  localStorage.setItem("owned", JSON.stringify(owned));
}

document.getElementById("click").onclick = (e) => {
  score += power;
  spawn(e.clientX,e.clientY,"+"+power);
  update();
};

document.getElementById("upgrade").onclick = () => {
  if(score >= upgradePrice){
    score -= upgradePrice;
    power *= 2;
    upgradePrice = Math.floor(upgradePrice * 2.5);
    update();
  }
};

document.getElementById("toggleShop").onclick = () => {
  shopEl.classList.toggle("open");
};

function renderShop(){
  shopEl.innerHTML = "";
  items.forEach(i=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `
      <img src="${i.img}">
      <div>${i.name}<br>${owned[i.id]?"Куплено":"Цена: "+i.price}</div>
      <button ${owned[i.id]?"disabled":""}>Купить</button>
    `;
    div.querySelector("button").onclick=()=>{
      if(score>=i.price){
        score-=i.price;
        owned[i.id]=true;
        update();
        renderShop();
      }
    };
    shopEl.appendChild(div);
  });
}

function spawn(x,y,t){
  const p=document.createElement("div");
  p.className="particle";
  p.textContent=t;
  p.style.left=x+"px";
  p.style.top=y+"px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1000);
}

renderShop();
update();
</script>
</body>
</html>
